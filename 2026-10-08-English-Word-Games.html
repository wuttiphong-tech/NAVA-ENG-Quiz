<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สนามซ้อมศัพท์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600;700&display=swap">
<style>
/* Layout: arcade-style hub of four game tiles; each game is a single focused card with big tap targets */
:root{
  --bg:#EEF4F3; --card:#FFFFFF; --ink:#12343B; --muted:#58707A; --line:#CFDCDA; --soft:#E2ECEA;
  --a:#0F7C7A; --a-ink:#FFFFFF; --sun:#F4B32A; --sun-soft:#FDF0CC; --coral:#E8604C; --coral-soft:#FBE2DD; --ok:#1F8A53; --ok-soft:#DDF3E6;
  --display:"Mitr","Sarabun",system-ui,sans-serif; --body:"Sarabun","Tahoma",system-ui,sans-serif; --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1B1F; --card:#15272C; --ink:#E4EFEE; --muted:#93AAB0; --line:#27424A; --soft:#1C3339;
  --a:#3CC2BD; --a-ink:#06201F; --sun:#F6C453; --sun-soft:#3A3014; --coral:#F2826F; --coral-soft:#3B1F1A; --ok:#4FCB8A; --ok-soft:#163327; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1B1F; --card:#15272C; --ink:#E4EFEE; --muted:#93AAB0; --line:#27424A; --soft:#1C3339;
  --a:#3CC2BD; --a-ink:#06201F; --sun:#F6C453; --sun-soft:#3A3014; --coral:#F2826F; --coral-soft:#3B1F1A; --ok:#4FCB8A; --ok-soft:#163327; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.25;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.muted{color:var(--muted)}
.btn{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:.45em 1.1em;font-weight:700}
.btn.go{background:var(--a);border-color:var(--a);color:var(--a-ink)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#3A2800}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* hub */
.mast{padding-block:26px 14px;display:grid;gap:6px}
.eyebrow{font-family:var(--display);font-size:.82rem;letter-spacing:.1em;color:var(--a);text-transform:uppercase}
.mast h1{font-size:clamp(1.8rem,6vw,2.5rem)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start}
.tile .top{display:flex;gap:12px;align-items:center}
.badge{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:1.05rem;background:var(--soft);color:var(--a)}
.tile:nth-child(2) .badge{background:var(--sun-soft);color:#9A6A00}
.tile:nth-child(3) .badge{background:var(--coral-soft);color:var(--coral)}
.tile:nth-child(4) .badge{background:var(--ok-soft);color:var(--ok)}
.tile h3{font-size:1.15rem}
.tile p{margin:0;font-size:.92rem;color:var(--muted)}
.best{font-size:.85rem;color:var(--muted)}
.best b{color:var(--ink);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.note{background:var(--card);border:2px dashed var(--line);border-radius:var(--r);padding:14px 16px;margin-top:14px;display:grid;gap:8px}
.foot{margin-top:20px;font-size:.85rem;color:var(--muted)}
/* game chrome */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:10px 16px;border-bottom:1px solid var(--line)}
.bar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bar .t{flex:1;min-width:0;font-family:var(--display);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-family:var(--display);font-variant-numeric:tabular-nums;padding:3px 10px;border-radius:10px;background:var(--soft);font-weight:600;white-space:nowrap}
.pill.hot{background:var(--sun);color:#3A2800}
.pill.low{background:var(--coral-soft);color:var(--coral)}
.hearts{letter-spacing:2px;color:var(--coral);font-size:1.1rem}
.stage{margin-top:18px;display:grid;gap:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px}
.prompt{font-family:var(--display);font-size:clamp(1.8rem,7vw,2.6rem);text-align:center;line-height:1.15;word-break:break-word}
.sub{text-align:center;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:460px){.opts.long{grid-template-columns:1fr}}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 10px;font-weight:700;font-size:1.05rem;min-height:56px}
.opt:hover:not(:disabled){border-color:var(--a)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--coral-soft);border-color:var(--coral);color:var(--coral)}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:10px 14px;font-size:.95rem}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--coral-soft)}
.ex{font-style:italic}
.at{font-size:.8rem;color:var(--muted)}
/* match */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
.mc{min-height:84px;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px;font-weight:700;display:grid;place-items:center;text-align:center;line-height:1.25;transition:transform .12s}
.mc.en{font-family:var(--display);font-weight:500;font-size:1.08rem}
.mc.th{font-size:.95rem}
.mc.sel{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 30%,transparent);transform:translateY(-2px)}
.mc.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);opacity:.55;cursor:default}
.mc.bad{border-color:var(--coral);background:var(--coral-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* ladder */
.ladder{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.rung{width:14px;height:14px;border-radius:4px;background:var(--soft)}
.rung.on{background:var(--sun)}
.trio{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-family:var(--display);font-size:1.25rem}
.trio span{padding:4px 12px;border-radius:10px;background:var(--soft)}
.trio span.q{background:var(--sun-soft);color:#8A5D00;border:2px dashed var(--sun)}
.ptag{display:inline-block;font-size:.8rem;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--soft);color:var(--muted)}
/* result */
.res{text-align:center;display:grid;gap:8px;padding-block:20px 6px}
.stars{font-size:2.4rem;letter-spacing:6px;color:var(--sun)}
.stars .off{color:var(--line)}
.big{font-family:var(--display);font-size:clamp(2.4rem,9vw,3.2rem);font-variant-numeric:tabular-nums;line-height:1}
.list{display:grid;gap:8px}
.li{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;gap:2px}
.li b{font-family:var(--display);font-weight:500}
.sent{font-size:1.15rem;text-align:center;line-height:1.6}
.sent .blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--sun);text-align:center;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    <section class="tile"><div class="top"><span class="badge">V2V3</span><div><h3>Verb Ladder</h3><p>เลือก V2 แล้วต่อด้วย V3 ไต่บันไดให้สูงที่สุด มีหัวใจ 3 ดวง</p></div></div>
      <div class="chips" aria-label="กลุ่มกริยา">${chips('pat',PAT)}</div>
      <div class="row"><button class="btn go" id="g-ladder">เล่น</button><span class="best">${b.ladder!=null?`สูงสุด <b>${b.ladder} ขั้น</b>`:'ยังไม่เคยเล่น'}</span></div></section>
    <section class="tile"><div class="top"><span class="badge">-tion</span><div><h3>Suffix Factory</h3><p>เปลี่ยนคำให้เป็นคำนาม รอบละ 10 ข้อ</p></div></div>
      <div class="chips" aria-label="โหมด">${chips('smode',{build:'แปลงคำ (decide → ?)',ctx:'เติมคำในประโยค'})}</div>
      <div class="row"><button class="btn go" id="g-suffix">เล่น</button><span class="best">${b.suffix!=null?`ดีที่สุด <b>${b.suffix}/10</b>`:'ยังไม่เคยเล่น'}</span></div></section>
  </div>
  <section class="note"><h3 style="font-size:1.05rem">สมุดคำผิด · ${nMiss} คำ</h3>
    ${nMiss?`<p class="muted" style="margin:0">คำที่เคยตอบผิดจะถูกเก็บไว้ที่นี่ ตอบถูกในรอบฝึกคำผิดแล้วคำนั้นจะออกจากสมุด</p>
    <div class="row">${missN('vocab')?`<button class="btn sun" id="m-vocab">ฝึกศัพท์ที่ผิด (${missN('vocab')})</button>`:''}${missN('verbs')?`<button class="btn sun" id="m-verbs">ฝึกกริยาที่ผิด (${missN('verbs')})</button>`:''}${missN('suffix')+missN('ctx')?`<button class="btn sun" id="m-suffix">ฝึก suffix ที่ผิด (${missN('suffix')+missN('ctx')})</button>`:''}</div>`
    :`<p class="muted" style="margin:0">ยังไม่มีคำที่ตอบผิด เล่นเกมไหนก็ได้ แล้วคำที่พลาดจะมาอยู่ที่นี่ให้ฝึกซ้ำ</p>`}</section>
  <p class="foot">สถิติและสมุดคำผิดจำไว้ในเครื่องนี้เท่านั้น ความหมายภาษาไทยและประโยคตัวอย่างเรียบเรียงโดย Claude ส่วนคำว่า "พบใน" บอกว่าคำนั้นเคยปรากฏในข้อสอบชุดไหน</p>`;
  app.querySelectorAll('[data-f]').forEach(c => c.onclick = () => { st.f[c.dataset.f] = c.dataset.v; save(); hub(); });
  app.querySelector('#g-match').onclick = () => match();
  app.querySelector('#g-speed').onclick = () => speed();
  app.querySelector('#g-ladder').onclick = () => ladder();
  app.querySelector('#g-suffix').onclick = () => st.f.smode==='ctx' ? suffixCtx() : suffixBuild();
  const mv = app.querySelector('#m-vocab'); if (mv) mv.onclick = () => speed(true);
  const mb = app.querySelector('#m-verbs'); if (mb) mb.onclick = () => ladder(true);
  const ms = app.querySelector('#m-suffix'); if (ms) ms.onclick = () => missN('suffix') ? suffixBuild(true) : suffixCtx(true);
}

/* ---------------- MATCH UP ---------------- */
function match(){
  const pool = vpool(); const words = [];
  for (const v of shuffle(pool)) { if (words.every(w => !clash(w,v))) words.push(v); if (words.length===6) break; }
  const cards = shuffle(words.flatMap((v,i) => [{i, en:true, t:v.w}, {i, en:false, t:v.th}]));
  let sel = null, done = 0, mistakes = 0, t0 = Date.now(); const missed = new Set();
  const draw = () => {
    app.innerHTML = bar('Match Up', `<span class="pill" id="clock">0 วิ</span><span class="pill">ผิด ${mistakes}</span>`) +
      `<div class="stage"><p class="muted" style="margin:0;text-align:center">แตะคำอังกฤษ แล้วแตะความหมายที่คู่กัน</p><div class="grid">${cards.map((c,k)=>`<button class="mc ${c.en?'en':'th'} ${c.done?'done':''}" data-k="${k}" ${c.done?'disabled':''}>${esc(c.t)}</button>`).join('')}</div></div>`;
    bindBack();
    app.querySelectorAll('.mc:not(.done)').forEach(b => b.onclick = () => tap(+b.dataset.k, b));
    tick();
  };
  const tick = () => { const el = document.getElementById('clock'); if (el) el.textContent = Math.floor((Date.now()-t0)/1000)+' วิ'; };
  stopT(); timer = setInterval(tick, 500);
  function tap(k, el){
    const c = cards[k];
    if (sel === null){ sel = k; el.classList.add('sel'); return; }
    if (sel === k){ sel = null; el.classList.remove('sel'); return; }
    const a = cards[sel];
    if (a.en === c.en){ app.querySelector(`[data-k="${sel}"]`).classList.remove('sel'); sel = k; el.classList.add('sel'); return; }
    if (a.i === c.i){ a.done = c.done = true; done++; sel = null; if (done===6) return finish(); draw(); }
    else {
      mistakes++; missed.add(words[a.i].w); missed.add(words[c.i].w);
      const prev = app.querySelector(`[data-k="${sel}"]`); sel = null;
      [prev, el].forEach(x => { x.classList.remove('sel'); x.classList.add('bad'); });
      setTimeout(draw, 380);
    }
  }
  function finish(){
    stopT(); const sec = Math.round((Date.now()-t0)/1000);
    const stars = mistakes<=1 && sec<=45 ? 3 : mistakes<=3 ? 2 : 1;
    const rec = setBest('match', sec, false);
    missed.forEach(w => missAdd('vocab', w));
    app.innerHTML = bar('Match Up') + `<div class="res">${starsHTML(stars)}<div class="big">${sec} วิ</div><p class="muted" style="margin:0">ผิด ${mistakes} ครั้ง${rec?' · สถิติใหม่!':''}</p>
      <div class="row" style="justify-content:center"><button class="btn go" id="again">เล่นอีกรอบ</button><button class="btn" id="home">หน้าหลัก</button></div></div>
      <h3 style="font-size:1rem;margin-top:12px">คำในรอบนี้</h3><div class="list">${words.map(v=>`<div class="li"><b>${esc(v.w)} <span class="ptag">${esc(v.p)}</span></b><span>${esc(v.th)}</span><span class="ex">${esc(v.ex)}</span>${atLine(v)}</div>`).join('')}</div>`;
    bindBack(); app.querySelector('#again').onclick = match; app.querySelector('#home').onclick = hub;
  }
  draw();
}

/* ---------------- SPEED ROUND ---------------- */
function speed(missMode){
  let pool = missMode ? D.vocab.filter(v => st.miss.vocab[v.w]) : vpool();
  if (!pool.length) return hub();
  const limit = missMode ? 0 : 60; let left = limit, score = 0, combo = 0, n = 0, right = 0, q = null, queue = shuffle(pool), locked = false;
  const wrongs = [];
  const next = () => {
    if (!queue.length){ if (missMode) return finish(); queue = shuffle(pool); }
    q = queue.pop(); locked = false;
    const same = D.vocab.filter(v => v.w!==q.w && !clash(v,q));
    let ds = shuffle(same.filter(v => v.p===q.p)).slice(0,3);
    if (ds.length<3) ds = ds.concat(shuffle(same.filter(v=>!ds.includes(v))).slice(0,3-ds.length));
    const opts = shuffle([q, ...ds]);
    const mult = Math.min(5, 1+Math.floor(combo/3));
    app.innerHTML = bar(missMode?'ฝึกศัพท์ที่ผิด':'Speed Round', `${limit?`<span class="pill ${left<=10?'low':''}" id="clock">${left} วิ</span>`:`<span class="pill">เหลือ ${queue.length+1}</span>`}<span class="pill ${mult>1?'hot':''}">x${mult}</span><span class="pill">${score}</span>`) +
      `<div class="stage"><div class="card"><div class="prompt">${esc(q.w)}</div><div class="sub"><span class="ptag">${esc(q.p)}</span></div>
      <div class="opts long">${opts.map(o=>`<button class="opt" data-w="${esc(o.w)}">${esc(o.th)}</button>`).join('')}</div><div id="fb"></div></div></div>`;
    bindBack();
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b, opts));
  };
  function answer(b, opts){
    if (locked) return; locked = true; n++;
    const ok = b.dataset.w === q.w;
    app.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (x.dataset.w===q.w) x.classList.add('right'); });
    if (ok){ right++; combo++; score += 10*Math.min(5, 1+Math.floor((combo-1)/3)); if (missMode) missDel('vocab', q.w); }
    else { combo = 0; b.classList.add('wrong'); wrongs.push(q); missAdd('vocab', q.w); }
    if (missMode || !ok){
      document.getElementById('fb').innerHTML = `<div class="fb ${ok?'ok':'no'}"><b>${esc(q.w)}</b> = ${esc(q.th)}<br><span class="ex">${esc(q.ex)}</span><br>${atLine(q)}</div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn go" id="nx">ต่อไป →</button></div>`;
      document.getElementById('nx').onclick = next;
      if (!missMode && left>0) {}
    } else setTimeout(next, 450);
  }
  function finish(){
    stopT();
    let rec = false; if (!missMode) rec = setBest('speed', score);
    app.innerHTML = bar(missMode?'ฝึกศัพท์ที่ผิด':'Speed Round') + `<div class="res">${missMode?'':starsHTML(score>=200?3:score>=100?2:1)}<div class="big">${missMode?`${right}/${n}`:score}</div>
      <p class="muted" style="margin:0">${missMode?`ตอบถูก ${right} คำ ออกจากสมุดคำผิดแล้ว`:`ตอบถูก ${right} จาก ${n} คำ${rec?' · สถิติใหม่!':''}`}</p>
      <div class="row" style="justify-content:center"><button class="btn go" id="again">เล่นอีกรอบ</button><button class="btn" id="home">หน้าหลัก</button></div></div>
      ${wrongs.length?`<h3 style="font-size:1rem;margin-top:12px">คำที่ตอบผิด</h3><div class="list">${wrongs.map(v=>`<div class="li"><b>${esc(v.w)}</b><span>${esc(v.th)}</span><span class="ex">${esc(v.ex)}</span>${atLine(v)}</div>`).join('')}</div>`:''}`;
    bindBack(); app.querySelector('#again').onclick = () => speed(missMode && missN('vocab')>0); app.querySelector('#home').onclick = hub;
  }
  stopT();
  if (limit) timer = setInterval(() => { left--; const el=document.getElementById('clock'); if (el){ el.textContent = left+' วิ'; el.classList.toggle('low', left<=10); } if (left<=0) finish(); }, 1000);
  next();
}

/* ---------------- VERB LADDER ---------------- */
function ladder(missMode){
  let pool = missMode ? D.verbs.filter(v => st.miss.verbs[v.v1]) : D.verbs.filter(v => st.f.pat==='all' || v.p===st.f.pat);
  if (!pool.length) return hub();
  let hearts = missMode ? 99 : 3, rungs = 0, queue = shuffle(pool), v = null, step = 2, locked = false; const wrongs = [];
  const render = (fb) => {
    const opts = step===2 ? v.o2 : v.o3;
    app.innerHTML = bar(missMode?'ฝึกกริยาที่ผิด':'Verb Ladder', `${missMode?`<span class="pill">เหลือ ${queue.length+1}</span>`:`<span class="hearts" aria-label="หัวใจ ${hearts}">${'♥'.repeat(hearts)}${'<span style="opacity:.25">♥</span>'.repeat(3-hearts)}</span>`}<span class="pill hot">${rungs} ขั้น</span>`) +
      `<div class="stage">${missMode?'':`<div class="ladder" aria-hidden="true">${Array.from({length:Math.max(10,rungs+1)},(_,i)=>`<span class="rung ${i<rungs?'on':''}"></span>`).join('')}</div>`}
      <div class="card"><div class="sub">${esc(v.th)}</div>
      <div class="trio"><span>${esc(v.v1)}</span><span class="${step===2?'q':''}">${step===2?'V2 ?':esc(v.v2)}</span><span class="${step===3?'q':''}">${step===3?'V3 ?':'…'}</span></div>
      <div class="opts">${opts.map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div><div id="fb">${fb||''}</div></div></div>`;
    bindBack();
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b));
  };
  const next = () => {
    if (!queue.length){ if (missMode) return finish(); queue = shuffle(pool); }
    v = queue.pop(); v.o2 = shuffle([v.v2, ...v.d2]); v.o3 = shuffle([v.v3, ...v.d3]); step = 2; locked = false; render();
  };
  function answer(b){
    if (locked) return;
    const want = step===2 ? v.v2 : v.v3, ok = b.dataset.o === want;
    if (ok && step===2){ step = 3; render(); return; }
    locked = true;
    app.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (x.dataset.o===want) x.classList.add('right'); });
    const trio = `<b>${esc(v.v1)} – ${esc(v.v2)} – ${esc(v.v3)}</b> <span class="ptag">${PATS[v.p]}</span>`;
    if (ok){ rungs++; if (missMode) missDel('verbs', v.v1); document.getElementById('fb').innerHTML = `<div class="fb ok">ถูกต้อง! ${trio}</div>`; setTimeout(next, missMode?900:650); }
    else {
      b.classList.add('wrong'); wrongs.push(v); missAdd('verbs', v.v1); if (!missMode) hearts--;
      document.getElementById('fb').innerHTML = `<div class="fb no">ที่ถูกคือ ${trio}</div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn go" id="nx">${hearts<=0?'ดูผล':'ต่อไป →'}</button></div>`;
      document.getElementById('nx').onclick = () => hearts<=0 ? finish() : next();
    }
  }
  function finish(){
    const rec = missMode ? false : setBest('ladder', rungs);
    app.innerHTML = bar(missMode?'ฝึกกริยาที่ผิด':'Verb Ladder') + `<div class="res">${missMode?'':starsHTML(rungs>=20?3:rungs>=10?2:1)}<div class="big">${rungs} ขั้น</div>
      <p class="muted" style="margin:0">${missMode?'กริยาที่ตอบถูกออกจากสมุดคำผิดแล้ว':(rec?'สถิติใหม่!':'ไต่ได้ '+rungs+' ขั้น')}</p>
      <div class="row" style="justify-content:center"><button class="btn go" id="again">เล่นอีกรอบ</button><button class="btn" id="home">หน้าหลัก</button></div></div>
      ${wrongs.length?`<h3 style="font-size:1rem;margin-top:12px">กริยาที่ต้องจำ</h3><div class="list">${wrongs.map(v=>`<div class="li"><b>${esc(v.v1)} – ${esc(v.v2)} – ${esc(v.v3)}</b><span>${esc(v.th)} · <span class="ptag">${PATS[v.p]}</span></span></div>`).join('')}</div>`:''}`;
    bindBack(); app.querySelector('#again').onclick = () => ladder(missMode && missN('verbs')>0); app.querySelector('#home').onclick = hub;
  }
  stopT(); next();
}

/* ---------------- SUFFIX FACTORY ---------------- */
function suffixRound(items, render, check, title, missKey, missMode){
  let i = 0, right = 0; const wrongs = [];
  const go = () => {
    if (i>=items.length) return finish();
    const it = items[i]; const opts = shuffle([it.ans, ...it.d]);
    app.innerHTML = bar(title, `<span class="pill">ข้อ ${i+1}/${items.length}</span><span class="pill hot">${right}</span>`) +
      `<div class="stage"><div class="card">${render(it)}<div class="opts">${opts.map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div><div id="fb"></div></div></div>`;
    bindBack();
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const ok = b.dataset.o === it.ans;
      app.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (x.dataset.o===it.ans) x.classList.add('right'); });
      if (ok){ right++; if (missMode) missDel(missKey, it.id); } else { b.classList.add('wrong'); wrongs.push(it); missAdd(missKey, it.id); }
      document.getElementById('fb').innerHTML = `<div class="fb ${ok?'ok':'no'}">${ok?'ถูกต้อง! ':'ยังไม่ถูก · '}${check(it)}</div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn go" id="nx">${i+1<items.length?'ต่อไป →':'ดูผล'}</button></div>`;
      document.getElementById('nx').onclick = () => { i++; go(); };
    });
  };
  function finish(){
    const rec = (!missMode && items.length===10) ? setBest('suffix', right) : false;
    app.innerHTML = bar(title) + `<div class="res">${starsHTML(right>=9?3:right>=6?2:1)}<div class="big">${right}/${items.length}</div><p class="muted" style="margin:0">${rec?'สถิติใหม่!':missMode?'ข้อที่ตอบถูกออกจากสมุดคำผิดแล้ว':''}</p>
      <div class="row" style="justify-content:center"><button class="btn go" id="again">เล่นอีกรอบ</button><button class="btn" id="home">หน้าหลัก</button></div></div>
      ${wrongs.length?`<h3 style="font-size:1rem;margin-top:12px">ข้อที่ตอบผิด</h3><div class="list">${wrongs.map(w=>`<div class="li">${check(w)}</div>`).join('')}</div>`:''}`;
    bindBack(); app.querySelector('#again').onclick = () => (missKey==='ctx'?suffixCtx:suffixBuild)(missMode && missN(missKey)>0); app.querySelector('#home').onclick = hub;
  }
  stopT(); go();
}
function suffixBuild(missMode){
  const src = missMode ? D.suffix.filter(s => st.miss.suffix[s.b+'>'+s.n]) : D.suffix;
  if (!src.length) return hub();
  const items = pick(src, missMode ? src.length : 10).map(s => ({id:s.b+'>'+s.n, ans:s.n, d:s.d, s}));
  suffixRound(items,
    it => `<div class="prompt">${esc(it.s.b)} → ?</div><div class="sub">คำนามที่แปลว่า "<b>${esc(it.s.th)}</b>"</div>`,
    it => `<b>${esc(it.s.b)} → ${esc(it.s.n)}</b> (${esc(it.s.th)}) <span class="ptag">${esc(it.s.g==='person'?'คำนามบอกคน -er/-or/-ist/-ant':it.s.g)}</span>`,
    missMode ? 'ฝึก suffix ที่ผิด' : 'Suffix Factory · แปลงคำ', 'suffix', missMode);
}
function suffixCtx(missMode){
  const src = missMode ? D.ctx.filter(c => st.miss.ctx[c.c+'|'+c.s.slice(0,12)]) : D.ctx;
  if (!src.length) return hub();
  const items = pick(src, missMode ? src.length : 10).map(c => ({id:c.c+'|'+c.s.slice(0,12), ans:c.c, d:c.d, c}));
  suffixRound(items,
    it => `<p class="sent">${esc(it.c.s).replace('____','<span class="blank">?</span>')}</p><div class="sub">เลือกคำที่ถูกต้อง</div>`,
    it => `<b>${esc(it.c.s.replace('____', it.c.c))}</b><br>${esc(it.c.x)}`,
    missMode ? 'ฝึก suffix ที่ผิด' : 'Suffix Factory · เติมประโยค', 'ctx', missMode);
}

hub();
})();
</script>
