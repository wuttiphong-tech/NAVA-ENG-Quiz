/* ---------------- MATCH UP ---------------- */
function match(){
  const pool = vpool(); const words = [];
  for (const v of shuffle(pool)) { if (words.every(w => !clash(w,v))) words.push(v); if (words.length===6) break; }
  const cards = shuffle(words.flatMap((v,i) => [{i, en:true, t:v.w}, {i, en:false, t:v.th}]));
  let sel = null, done = 0, mistakes = 0, t0 = Date.now(); const missed = new Set();
  const draw = () => {
    app.innerHTML = bar('Match Up', `<span class="pill" id="clock">0 วิ</span><span class="pill">ผิด ${mistakes}</span>`) +
      `<div class="stage"><p class="muted" style="margin:0;text-align:center">แตะคำอังกฤษ แล้วแตะความหมายที่คู่กัน</p><div class="grid">${cards.map((c,k)=>`<button class="mc ${c.en?'en':'th'} ${c.done?'done':''}" data-k="${k}" ${c.done?'disabled':''}>${esc(c.t)}</button>`).join('')}</div></div>`;
    bindBack();
    app.querySelectorAll('.mc:not(.done)').forEach(b => b.onclick = () => tap(+b.dataset.k, b));
    tick();
  };
  const tick = () => { const el = document.getElementById('clock'); if (el) el.textContent = Math.floor((Date.now()-t0)/1000)+' วิ'; };
  stopT(); timer = setInterval(tick, 500);
  function tap(k, el){
    const c = cards[k];
    if (sel === null){ sel = k; el.classList.add('sel'); return; }
    if (sel === k){ sel = null; el.classList.remove('sel'); return; }
    const a = cards[sel];
    if (a.en === c.en){ app.querySelector(`[data-k="${sel}"]`).classList.remove('sel'); sel = k; el.classList.add('sel'); return; }
    if (a.i === c.i){ a.done = c.done = true; done++; sel = null; if (done===6) return finish(); draw(); }
    else {
      mistakes++; missed.add(words[a.i].w); missed.add(words[c.i].w);
      const prev = app.querySelector(`[data-k="${sel}"]`); sel = null;
      [prev, el].forEach(x => { x.classList.remove('sel'); x.classList.add('bad'); });
      setTimeout(draw, 380);
    }
  }
  function finish(){
    stopT(); const sec = Math.round((Date.now()-t0)/1000);
    const stars = mistakes<=1 && sec<=45 ? 3 : mistakes<=3 ? 2 : 1;
    const rec = setBest('match', sec, false);
    missed.forEach(w => missAdd('vocab', w));
    app.innerHTML = bar('Match Up') + `<div class="res">${starsHTML(stars)}<div class="big">${sec} วิ</div><p class="muted" style="margin:0">ผิด ${mistakes} ครั้ง${rec?' · สถิติใหม่!':''}</p>
      <div class="row" style="justify-content:center"><button class="btn go" id="again">เล่นอีกรอบ</button><button class="btn" id="home">หน้าหลัก</button></div></div>
      <h3 style="font-size:1rem;margin-top:12px">คำในรอบนี้</h3><div class="list">${words.map(v=>`<div class="li"><b>${esc(v.w)} <span class="ptag">${esc(v.p)}</span></b><span>${esc(v.th)}</span><span class="ex">${esc(v.ex)}</span>${atLine(v)}</div>`).join('')}</div>`;
    bindBack(); app.querySelector('#again').onclick = match; app.querySelector('#home').onclick = hub;
  }
  draw();
}

/* ---------------- SPEED ROUND ---------------- */
function speed(missMode){
  let pool = missMode ? D.vocab.filter(v => st.miss.vocab[v.w]) : vpool();
  if (!pool.length) return hub();
  const limit = missMode ? 0 : 60; let left = limit, score = 0, combo = 0, n = 0, right = 0, q = null, queue = shuffle(pool), locked = false;
  const wrongs = [];
  const next = () => {
    if (!queue.length){ if (missMode) return finish(); queue = shuffle(pool); }
    q = queue.pop(); locked = false;
    const same = D.vocab.filter(v => v.w!==q.w && !clash(v,q));
    let ds = shuffle(same.filter(v => v.p===q.p)).slice(0,3);
    if (ds.length<3) ds = ds.concat(shuffle(same.filter(v=>!ds.includes(v))).slice(0,3-ds.length));
    const opts = shuffle([q, ...ds]);
    const mult = Math.min(5, 1+Math.floor(combo/3));
    app.innerHTML = bar(missMode?'ฝึกศัพท์ที่ผิด':'Speed Round', `${limit?`<span class="pill ${left<=10?'low':''}" id="clock">${left} วิ</span>`:`<span class="pill">เหลือ ${queue.length+1}</span>`}<span class="pill ${mult>1?'hot':''}">x${mult}</span><span class="pill">${score}</span>`) +
      `<div class="stage"><div class="card"><div class="prompt">${esc(q.w)}</div><div class="sub"><span class="ptag">${esc(q.p)}</span></div>
      <div class="opts long">${opts.map(o=>`<button class="opt" data-w="${esc(o.w)}">${esc(o.th)}</button>`).join('')}</div><div id="fb"></div></div></div>`;
    bindBack();
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b, opts));
  };
  function answer(b, opts){
    if (locked) return; locked = true; n++;
    const ok = b.dataset.w === q.w;
    app.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (x.dataset.w===q.w) x.classList.add('right'); });
    if (ok){ right++; combo++; score += 10*Math.min(5, 1+Math.floor((combo-1)/3)); if (missMode) missDel('vocab', q.w); }
    else { combo = 0; b.classList.add('wrong'); wrongs.push(q); missAdd('vocab', q.w); }
    if (missMode || !ok){
      document.getElementById('fb').innerHTML = `<div class="fb ${ok?'ok':'no'}"><b>${esc(q.w)}</b> = ${esc(q.th)}<br><span class="ex">${esc(q.ex)}</span><br>${atLine(q)}</div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn go" id="nx">ต่อไป →</button></div>`;
      document.getElementById('nx').onclick = next;
      if (!missMode && left>0) {}
    } else setTimeout(next, 450);
  }
  function finish(){
    stopT();
    let rec = false; if (!missMode) rec = setBest('speed', score);
    app.innerHTML = bar(missMode?'ฝึกศัพท์ที่ผิด':'Speed Round') + `<div class="res">${missMode?'':starsHTML(score>=200?3:score>=100?2:1)}<div class="big">${missMode?`${right}/${n}`:score}</div>
      <p class="muted" style="margin:0">${missMode?`ตอบถูก ${right} คำ ออกจากสมุดคำผิดแล้ว`:`ตอบถูก ${right} จาก ${n} คำ${rec?' · สถิติใหม่!':''}`}</p>
      <div class="row" style="justify-content:center"><button class="btn go" id="again">เล่นอีกรอบ</button><button class="btn" id="home">หน้าหลัก</button></div></div>

/* ---------------- VERB LADDER ---------------- */
function ladder(missMode){
  let pool = missMode ? D.verbs.filter(v => st.miss.verbs[v.v1]) : D.verbs.filter(v => st.f.pat==='all' || v.p===st.f.pat);
  if (!pool.length) return hub();
  let hearts = missMode ? 99 : 3, rungs = 0, queue = shuffle(pool), v = null, step = 2, locked = false; const wrongs = [];
  const render = (fb) => {
    const opts = step===2 ? v.o2 : v.o3;
    app.innerHTML = bar(missMode?'ฝึกกริยาที่ผิด':'Verb Ladder', `${missMode?`<span class="pill">เหลือ ${queue.length+1}</span>`:`<span class="hearts" aria-label="หัวใจ ${hearts}">${'♥'.repeat(hearts)}${'<span style="opacity:.25">♥</span>'.repeat(3-hearts)}</span>`}<span class="pill hot">${rungs} ขั้น</span>`) +
      `<div class="stage">${missMode?'':`<div class="ladder" aria-hidden="true">${Array.from({length:Math.max(10,rungs+1)},(_,i)=>`<span class="rung ${i<rungs?'on':''}"></span>`).join('')}</div>`}
      <div class="card"><div class="sub">${esc(v.th)}</div>
      <div class="trio"><span>${esc(v.v1)}</span><span class="${step===2?'q':''}">${step===2?'V2 ?':esc(v.v2)}</span><span class="${step===3?'q':''}">${step===3?'V3 ?':'…'}</span></div>
      <div class="opts">${opts.map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div><div id="fb">${fb||''}</div></div></div>`;
    bindBack();
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b));
  };
  const next = () => {
    if (!queue.length){ if (missMode) return finish(); queue = shuffle(pool); }
    v = queue.pop(); v.o2 = shuffle([v.v2, ...v.d2]); v.o3 = shuffle([v.v3, ...v.d3]); step = 2; locked = false; render();
  };
  function answer(b){
    if (locked) return;
    const want = step===2 ? v.v2 : v.v3, ok = b.dataset.o === want;
    if (ok && step===2){ step = 3; render(); return; }
    locked = true;
    app.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (x.dataset.o===want) x.classList.add('right'); });
    const trio = `<b>${esc(v.v1)} – ${esc(v.v2)} – ${esc(v.v3)}</b> <span class="ptag">${PATS[v.p]}</span>`;
    if (ok){ rungs++; if (missMode) missDel('verbs', v.v1); document.getElementById('fb').innerHTML = `<div class="fb ok">ถูกต้อง! ${trio}</div>`; setTimeout(next, missMode?900:650); }
    else {
      b.classList.add('wrong'); wrongs.push(v); missAdd('verbs', v.v1); if (!missMode) hearts--;
      document.getElementById('fb').innerHTML = `<div class="fb no">ที่ถูกคือ ${trio}</div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn go" id="nx">${hearts<=0?'ดูผล':'ต่อไป →'}</button></div>`;
      document.getElementById('nx').onclick = () => hearts<=0 ? finish() : next();
    }
  }
  function finish(){
    const rec = missMode ? false : setBest('ladder', rungs);
    app.innerHTML = bar(missMode?'ฝึกกริยาที่ผิด':'Verb Ladder') + `<div class="res">${missMode?'':starsHTML(rungs>=20?3:rungs>=10?2:1)}<div class="big">${rungs} ขั้น</div>
      <p class="muted" style="margin:0">${missMode?'กริยาที่ตอบถูกออกจากสมุดคำผิดแล้ว':(rec?'สถิติใหม่!':'ไต่ได้ '+rungs+' ขั้น')}</p>
      <div class="row" style="justify-content:center"><button class="btn go" id="again">เล่นอีกรอบ</button><button class="btn" id="home">หน้าหลัก</button></div></div>
      ${wrongs.length?`<h3 style="font-size:1rem;margin-top:12px">กริยาที่ต้องจำ</h3><div class="list">${wrongs.map(v=>`<div class="li"><b>${esc(v.v1)} – ${esc(v.v2)} – ${esc(v.v3)}</b><span>${esc(v.th)} · <span class="ptag">${PATS[v.p]}</span></span></div>`).join('')}</div>`:''}`;
    bindBack(); app.querySelector('#again').onclick = () => ladder(missMode && missN('verbs')>0); app.querySelector('#home').onclick = hub;
  }
  stopT(); next();
}

/* ---------------- SUFFIX FACTORY ---------------- */
function suffixRound(items, render, check, title, missKey, missMode){
  let i = 0, right = 0; const wrongs = [];

      `<div class="stage"><div class="card">${render(it)}<div class="opts">${opts.map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div><div id="fb"></div></div></div>`;
    bindBack();

      const ok = b.dataset.o === it.ans;
      app.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (x.dataset.o===it.ans) x.classList.add('right'); });
      if (ok){ right++; if (missMode) missDel(missKey, it.id); } else { b.classList.add('wrong'); wrongs.push(it); missAdd(missKey, it.id); }
      document.getElementById('fb').innerHTML = `<div class="fb ${ok?'ok':'no'}">${ok?'ถูกต้อง! ':'ยังไม่ถูก · '}${check(it)}</div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn go" id="nx">${i+1<items.length?'ต่อไป →':'ดูผล'}</button></div>`;
      document.getElementById('nx').onclick = () => { i++; go(); };

      <div class="row" style="justify-content:center"><button class="btn go" id="again">เล่นอีกรอบ</button><button class="btn" id="home">หน้าหลัก</button></div></div>

function labItems(){
  const L = D.lab, out = [];
  L.sort.forEach(w => out.push({id:'sort:'+w.w, m:'sort', ans:w.c, opts:[['C','นับได้ (Countable)'],['U','นับไม่ได้ (Uncountable)']],
    html:`<div class="prompt">${esc(w.w)}</div><div class="sub">${esc(w.th)} · นับได้หรือนับไม่ได้?</div>`,
    fb:`<b>${esc(w.w)}</b> = ${w.c==='C'?'นับได้':'นับไม่ได้'} · ${esc(w.x)}`}));
  const mk = (t, fill) => esc(t).replace('____', fill).replace(/~~(.+?)~~/g,'<s class="xo">$1</s>').replace(/\{(.+?)\}/g,'<b class="subj">$1</b>');
  const STEP = {'1':'ขั้น 1 · ขีดฆ่าส่วนขยาย', '2':'ขั้น 2 · นับว่า 1 หรือหลาย', '3a':'ข้อยกเว้น · ห้ามขีดฆ่า of', '3b':'ข้อยกเว้น · or / nor ตัวใกล้ชนะ'};
  ['quant','verb','sva'].forEach(k => L[k].forEach(q => out.push({id:k+':'+q.s.slice(0,40), m:k, ans:q.a, opts:shuffle([q.a,...q.d]).map(o=>[o,o]),
    html:`<p class="sent">${esc(q.s).replace('____','<span class="blank">?</span>')}</p>`+(q.k?`<p class="sent hint" hidden>${mk(q.k,'<span class="blank">?</span>')}</p><div class="sub"><button class="btn hintb" type="button">ใบ้: ขีดฆ่าส่วนขยายให้ดู</button></div>`:'<div class="sub">เลือกคำที่ถูกต้อง</div>'),
    fb: q.k ? `<span class="ptag">${STEP[q.g]}</span><br><span class="sentfb">${mk(q.k, '<u>'+esc(q.a)+'</u>')}</span><br>${esc(q.t)}`
            : `<b>${esc(q.s.replace('____', q.a))}</b><br>${esc(q.x)}`})));
  L.err.forEach(q => { const parts = {}; const h = esc(q.s).replace(/\[\[([^|\]]+)\|(\d)\]\]/g, (m,t,n) => { parts[n]=t; return `<u>${t}</u><sup>(${n})</sup>`; });
    out.push({id:'err:'+q.s.slice(0,40), m:'err', ans:q.a, opts:['1','2','3','4'].map(n=>[n,`(${n}) ${parts[n]}`]),
      html:`<p class="sent err">${h}</p><div class="sub">ส่วนที่ขีดเส้นใต้ส่วนไหนผิด?</div>`,
      fb:`ผิดที่ <b>(${q.a}) ${parts[q.a]}</b> · ${esc(q.x)}`}); });
  return out;
}

const EDTAG = {T:'ขั้น 1 · ของ → -ing', Pf:'ขั้น 2 · คน "รู้สึก" → -ed', Pc:'ขั้น 2 · คน "น่า" → -ing', C:'คำบอกใบ้ → -ed', X:'ข้อยกเว้น'};
function edItems(){
  const E = D.ed, out = [];
  E.tr.forEach(q => out.push({id:'tr:'+q.th, m:'tr', ans:q.a, opts:shuffle([q.a,q.d]).map(o=>[o,o]),

    hints: q.k==='T' ? [`ขั้น 1: ประโยคนี้พูดถึง "${q.s}" = ของ รู้สึกเองไม่ได้`] : [`ขั้น 1: ประโยคนี้พูดถึง "${q.s}" = คน/สัตว์ → ไปขั้น 2`, `ขั้น 2: ในประโยคไทยมีคำว่า "รู้สึก" หรือ "น่า"?`],

    const hints = q.k==='T' ? [`ขั้น 1: คำนี้พูดถึง "${q.s}" = ของ/เหตุการณ์ รู้สึกเองไม่ได้`]

const TNPOOL = {g1:['prep','base','fwd','ing'], g2:['er','est','as','too','enough'], g3:['con','cau','res','time','move'], g4:['oblig','proh','nonec','sug','poss'], g5:['adj','adv','advadj','spc'], g6:['pas','act','who','which','where','whose'], '1':['hab','now','stat'], '2':['dec','opi','int','evi'], '3':['past','exp','dur','rec'], '4':['bg','pt','seq','nar']};
const TNHINT = {g1:['ดูคำที่อยู่หน้าช่องว่าง: บุพบท? can / to? คำนาม? หรือกริยา?', 'ถ้าเป็นกริยา: "ไปข้างหน้า" (อยาก / วางแผน) → to V1 · "ทำอยู่ / ทำเสร็จ" → V-ing'], g2:['มีคำว่า than ไหม? หรือเป็น "ที่สุด" (in the world, ever, one of)?', 'คำนี้มีรูปพิเศษไหม (good, bad)? ห้ามใส่ more ซ้อนกับ -er'], g3:['ดูคำที่ตามหลังช่องว่าง: เป็นประโยค (มีประธาน + กริยา) หรือแค่คำนาม?', 'ความหมาย: ขัดแย้ง · เหตุผล · ผล · เวลา · ทิศทาง?'], g4:['ความหมายคือ ต้อง · ห้าม · ไม่จำเป็น · ควร · อาจจะ · หรือมั่นใจ?', 'หลัง modal ต้องเป็น V1 ไม่มี to'], g5:['คำนี้ขยายอะไร: คำนาม (adj) · กริยา (adv) · หรือคุณศัพท์ (adv)?', 'คำพิเศษ: good → well · hard ≠ hardly · friendly เป็น adj'], g6:['ประธาน "ทำเอง" หรือ "ถูกทำ"? ถูกทำ → be + V3', 'ขยายอะไร: คน who · ของ which · สถานที่ where · "…ของ" whose'], '1':['หาคำบอกเวลาหรือคำใบ้ในประโยค (every day, now, tonight…)', 'เป็นประจำ · กำลังเกิด/ช่วงนี้ · หรือแผนที่นัดไว้?', 'กริยานี้เป็นความรู้สึก ความคิด หรือการเป็นเจ้าของไหม? ถ้าใช่ ห้าม -ing'],
  '2':['ตัดสินใจตอนพูด หรือวางแผนไว้ก่อนแล้ว (มีตั๋ว ซื้อของมาแล้ว)?', 'ถ้าเป็นการทำนาย: เดาจากความคิด (think, hope) หรือเห็นหลักฐานตรงหน้า (Look!)?'],
  '3':['มีเวลาในอดีตที่จบแล้วไหม (yesterday, last…, ago, in 2019, when…)? ถ้ามี → V2', 'ถ้าไม่มี: เคย/ไม่เคย · since/for ถึงตอนนี้ · หรือ just/already/yet → have + V3'],
  '4':['เหตุการณ์ไหนยาว (ฉากหลัง กำลังทำอยู่) ไหนสั้น (แทรกเข้ามา)?', 'ถ้าเกิดต่อกันเป็นลำดับ หรือเล่าเรื่องในอดีต → V2']};
function tnsItems(){
  const out = [];
  ['1', ...Object.keys(D.tnsp)].forEach(p => { const T = p==='1' ? D.tns : D.tnsp[p];
  ['fill','pair'].forEach(k => T[k].forEach(q => { const parts = q.a.split(' / '); let n = 0;
    out.push({id:(p==='1'?'':'p'+p)+k+':'+q.q.slice(0,40), p, m:k, r:q.r, ans:q.a, opts:shuffle([q.a,...q.d]), note: (p!=='1' && k==='pair' && q.x!=='-') ? q.x : '',
      html:`<p class="sent">${esc(q.q).replace(/____/g,'<span class="blank">?</span>')}</p>`,
      full: esc(q.q).replace(/____/g, () => '<u>'+esc(parts[n++])+'</u>'), th:q.th, x:q.x,
      blanks: q.b ? q.b.map(([r,why],i) => ({w:parts[i], r, why})) : [{w:parts[0], r:q.r, why:q.x}]}); })); });
  return out;
}
function tns(review, partArg, modeArg){
  const all = tnsItems(), byId = new Map(all.map(i=>[i.id,i])), mode = modeArg || (st.f.tns==='verb' ? 'fill' : st.f.tns), part = partArg || st.f.tnp;
  const base = review ? revDue().map(id => byId.get(id)).filter(Boolean) : deal(tnKey(part, mode), all.filter(i => i.m===mode && i.p===part), i => i.id, 10);
  if (!base.length){ if (review){ revDue().forEach(id => { if (!byId.has(id)) delete st.rev[id]; }); save(); } return hub(); }
  const title = review ? 'ทบทวนวันนี้' : PLABEL(part)+' · '+(part.startsWith('g') ? GM[mode] : TNM[mode]);
  const used = new Set(base.map(i=>i.id));
  let queue = base.map(it => ({it, twin:false})), done = 0, right = 0, twinN = 0, twinOk = 0; const wrongs = [];
  const pickTwin = (it, r) => { const c = shuffle(all.filter(x => x.p===it.p && (x.r===r || x.blanks.some(bl => bl.r===r)) && !used.has(x.id))); const t = c.find(x => x.m===it.m) || c[0]; if (t) used.add(t.id); return t; };
  const show = (it, ok) => `<span class="ptag">${esc(TNTAG[it.r])}</span><br><span class="sentfb">${it.full}</span><br>แปล: ${esc(it.th)}<br>${esc(it.x)}`;
  const next = () => {
    if (!queue.length) return finish();
    const {it, twin} = queue.shift(); let hi = 0;
    const hints = TNHINT[it.p];
    app.innerHTML = bar(title, `<span class="pill">${twin?'ข้อแฝด':`ข้อ ${done+1}/${base.length}`}</span><span class="pill hot">${right}</span>`) +
      `<div class="stage"><div class="card">${twin?'<div class="sub"><span class="ptag">ข้อแฝด · กฎเดียวกับข้อที่แล้ว</span></div>':''}${review&&!twin&&st.rev[it.id]?`<div class="sub"><span class="ptag">ทบทวนครั้งที่ ${st.rev[it.id].b}/3</span></div>`:''}${it.html}<div id="hints" class="hints"></div><div class="sub"><button class="btn hintb" type="button">ใบ้ ขั้นต่อไป</button></div><div class="opts long">${it.opts.map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div><div id="fb"></div></div></div>`;
    bindBack();
    const hb = app.querySelector('.hintb');
    hb.onclick = () => { app.querySelector('#hints').insertAdjacentHTML('beforeend', `<div class="hint">${esc(hints[hi++])}</div>`); if (hi>=hints.length) hb.parentElement.remove(); };
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const ok = b.dataset.o === it.ans;
      app.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (ok && x.dataset.o===it.ans) x.classList.add('right'); });
      const h = app.querySelector('.hintb'); if (h) h.parentElement.remove();
      const fb = document.getElementById('fb');
      if (twin){ twinN++; if (ok) twinOk++; else { revWrong(it.id); wrongs.push(it); } }
      else { done++; if (ok){ right++; if (review) revRight(it.id); } else { revWrong(it.id); wrongs.push(it); } }
      const picked = b.dataset.o.split(' / ');
      const lines = (mark) => it.blanks.map((bl,i) => `<div class="bl">${it.blanks.length>1?`<span class="bn">${i+1}</span>`:''}<b>${esc(bl.w)}</b> → ${esc(TNAME[bl.r])}${mark && picked[i]!==bl.w?' <span class="xm">✗ เลือก '+esc(picked[i])+'</span>':''}<br><span class="muted">เพราะ ${esc(bl.why)}</span></div>`).join('');
      const card = (extra) => `<div class="fb info"><b>คำตอบ: ${esc(it.ans)}</b>${lines(true)}${extra||''}<span class="sentfb">${it.full}</span><br>แปล: ${esc(it.th)}${it.note?`<br><span class="ptag">${esc(it.note)}</span>`:''}</div>`;
      const nextBtn = label => `<div class="row" style="justify-content:center;margin-top:10px"><button class="btn go" id="nx">${label}</button></div>`;
      if (ok){
        fb.innerHTML = `<div class="fb ok">ถูกต้อง!${lines(false)}</div>` + nextBtn(queue.length?'ต่อไป →':'ดูผล');
        document.getElementById('nx').onclick = next; return;
      }
      b.classList.add('wrong');
      if (twin){
        app.querySelectorAll('.opt').forEach(x => { if (x.dataset.o===it.ans) x.classList.add('right'); });
        fb.innerHTML = card('<div style="margin-bottom:6px"><b>ข้อนี้จะกลับมาให้ทบทวนพรุ่งนี้</b></div>') + nextBtn(queue.length?'ต่อไป →':'ดูผล');
        document.getElementById('nx').onclick = next; return;
      }
      /* one step only: ask which rule (answer not shown yet), then a single answer card */
      const wi = Math.max(0, it.blanks.findIndex((bl,i) => picked[i]!==bl.w)), wr = it.blanks[wi].r;
      const others = shuffle(TNPOOL[it.p].filter(k => k!==wr)).slice(0,2);
      const reasons = shuffle([wr, ...others]);
      fb.innerHTML = `<div class="whyq">ยังไม่ถูก · <b>${it.blanks.length>1?`ช่องที่ ${wi+1} ใช้กฎไหน?`:'ข้อนี้ใช้กฎไหน?'}</b></div><div class="opts long why">${reasons.map(r=>`<button class="opt" data-r="${r}">${esc(TNSHORT[r])}</button>`).join('')}</div><div id="ans"></div>`;
      fb.querySelectorAll('[data-r]').forEach(rb => rb.onclick = () => {
        const rok = rb.dataset.r === wr;
        fb.querySelectorAll('[data-r]').forEach(x => { x.disabled = true; if (x.dataset.r===wr) x.classList.add('right'); else x.classList.add('off'); });
        app.querySelectorAll('.opt[data-o]').forEach(x => { if (x.dataset.o===it.ans) x.classList.add('right'); });
        const tw = pickTwin(it, wr); if (tw) queue.unshift({it:tw, twin:true});
        fb.querySelector('#ans').innerHTML = card(rok ? '' : '<div class="muted" style="margin-bottom:6px">กฎที่ถูกคือปุ่มสีเขียว</div>') + nextBtn(tw?'ลองข้อแฝด (กฎเดียวกัน) →':(queue.length?'ต่อไป →':'ดูผล'));
        document.getElementById('nx').onclick = next;
      });
    });
  };
  function finish(){
    const pool = all.filter(i => i.m===mode && i.p===part).length;
    const rec = (!review && base.length===Math.min(10,pool)) ? setBest(tnKey(part, mode), right) : false;
    app.innerHTML = bar(title) + `<div class="res">${starsHTML(right>=base.length*0.9?3:right>=base.length*0.6?2:1)}<div class="big">${right}/${base.length}</div><p class="muted" style="margin:0">${rec?'สถิติใหม่! · ':''}${twinN?`ข้อแฝดถูก ${twinOk}/${twinN}`:''}</p>
      <div class="row" style="justify-content:center"><button class="btn go" id="again">${review?'หน้าหลัก':'เล่นอีกรอบ'}</button><button class="btn" id="rl">สรุปกฎ</button><button class="btn" id="home">หน้าหลัก</button></div></div>
      ${wrongs.length?`<h3 style="font-size:1rem;margin-top:12px">ข้อที่ผิด (นัดทบทวนพรุ่งนี้)</h3><div class="list">${wrongs.map(w=>`<div class="li"><span class="sentfb">${w.full}</span>${w.blanks.map(bl=>`<span><b>${esc(bl.w)}</b> → ${esc(TNAME[bl.r])} · ${esc(bl.why)}</span>`).join('')}</div>`).join('')}</div>`:''}`;
    bindBack(); app.querySelector('#again').onclick = review ? hub : () => tns(false, part, mode); app.querySelector('#home').onclick = hub; app.querySelector('#rl').onclick = () => tnsRules(review ? st.f.tnp : part);
  }
  stopT(); next();
}
function tnsVerb(){
  const CAT = {F:'ห้าม -ing · ความรู้สึก / ความต้องการ', M:'ห้าม -ing · ความคิด / การเป็นเจ้าของ', A:'เติม -ing ได้ · การกระทำ'};
  const picked = deal('tns_verb', D.tns.verbs, c => c.w, 10);
  let queue = picked.map(c => ({c, first:true})), done = 0, firstRight = 0; const missed = [];
  const next = () => {
    if (!queue.length) return finish();
    const it = queue.shift(), c = it.c;
    app.innerHTML = bar('เติม -ing ได้ไหม?', `<span class="pill">ข้อ ${Math.min(done+1,10)}/10</span><span class="pill hot">${firstRight}</span>`) +
      `<div class="stage"><div class="card">${it.first?'':'<div class="sub"><span class="ptag">ทวนอีกครั้ง</span></div>'}<div class="prompt">${esc(c.w)}</div><div class="sub">${esc(c.th)} · กริยานี้อยู่กลุ่มไหน?</div>
      <div class="opts long">${Object.entries(CAT).map(([k,l])=>`<button class="opt" data-o="${k}">${esc(l)}</button>`).join('')}</div><div id="fb"></div></div></div>`;
    bindBack();
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const ok = b.dataset.o === c.c;
      app.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (x.dataset.o===c.c) x.classList.add('right'); });
      if (it.first) done++;
      if (ok){ if (it.first) firstRight++; } else { b.classList.add('wrong'); if (it.first) missed.push(c); queue.push({c, first:false}); }
      const ex = c.c==='A' ? `Look! He is ${c.w==='swim'?'swimming':c.w==='run'?'running':c.w==='write'?'writing':c.w+'ing'} now. ✓` : `I ${c.w} … ✓ · ✗ I am ${c.w==='like'?'liking':c.w==='love'?'loving':c.w==='hate'?'hating':c.w==='believe'?'believing':c.w==='prefer'?'preferring':c.w+'ing'}`;
      document.getElementById('fb').innerHTML = `<div class="fb ${ok?'ok':'no'}">${ok?'ถูกต้อง! ':'ยังไม่ถูก · '}<b>${esc(c.w)}</b> = ${esc(c.th)} → ${esc(CAT[c.c])}<br><span class="eg">${esc(ex)}</span>${ok?'':'<br>คำนี้จะกลับมาให้ตอบอีกครั้งท้ายรอบ'}</div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn go" id="nx">${queue.length?'ต่อไป →':'ดูผล'}</button></div>`;
      document.getElementById('nx').onclick = next;
    });
  };
  function finish(){
    const rec = setBest('tns_verb', firstRight);
    app.innerHTML = bar('เติม -ing ได้ไหม?') + `<div class="res">${starsHTML(firstRight>=9?3:firstRight>=6?2:1)}<div class="big">${firstRight}/10</div><p class="muted" style="margin:0">ตอบถูกในครั้งแรก${rec?' · สถิติใหม่!':''}</p>
      <div class="row" style="justify-content:center"><button class="btn go" id="again">เล่นอีกรอบ</button><button class="btn" id="rl">สรุปกฎ</button><button class="btn" id="home">หน้าหลัก</button></div></div>
      ${missed.length?`<h3 style="font-size:1rem;margin-top:12px">คำที่ต้องทวน</h3><div class="list">${missed.map(c=>`<div class="li"><b>${esc(c.w)}</b><span>${esc(c.th)} → ${esc(CAT[c.c])}</span></div>`).join('')}</div>`:''}`;
    bindBack(); app.querySelector('#again').onclick = tnsVerb; app.querySelector('#home').onclick = hub; app.querySelector('#rl').onclick = () => tnsRules(st.f.tnp);
  }
  stopT(); next();
}
function tnsRules(pArg){
  stopT(); window.scrollTo(0,0);
  const p = pArg || st.f.tnp, rules = p==='1' ? D.tns.rules : D.tnsp[p].rules.concat(D.tns.rules.slice(1));
  app.innerHTML = bar('สรุปกฎ · '+PLABEL(p)) + `<div class="stage rules">${rules.map(r=>`<section class="card"><h3>${r.h}</h3>${r.b}</section>`).join('')}
    <div class="row" style="justify-content:center"><button class="btn go" id="pl">ไปเล่น</button></div></div>`;
  bindBack(); app.querySelector('#pl').onclick = () => p.startsWith('g') ? tns(false, p, st.f.gm) : ((p==='1' && st.f.tns==='verb') ? tnsVerb() : tns(false));
}

{ const ids = new Set(edItems().map(i => i.id)); Object.keys(st.miss.ed).forEach(k => { if (!ids.has(k)) delete st.miss.ed[k]; }); save(); }
hub();
})();
</script>
