
<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สนามซ้อมศัพท์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600;700&display=swap">
<style>
/* Layout: arcade-style hub of four game tiles; each game is a single focused card with big tap targets */
:root{
  --bg:#EEF4F3; --card:#FFFFFF; --ink:#12343B; --muted:#58707A; --line:#CFDCDA; --soft:#E2ECEA;
  --a:#0F7C7A; --a-ink:#FFFFFF; --sun:#F4B32A; --sun-soft:#FDF0CC; --coral:#E8604C; --coral-soft:#FBE2DD; --ok:#1F8A53; --ok-soft:#DDF3E6;
  --display:"Mitr","Sarabun",system-ui,sans-serif; --body:"Sarabun","Tahoma",system-ui,sans-serif; --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1B1F; --card:#15272C; --ink:#E4EFEE; --muted:#93AAB0; --line:#27424A; --soft:#1C3339;
  --a:#3CC2BD; --a-ink:#06201F; --sun:#F6C453; --sun-soft:#3A3014; --coral:#F2826F; --coral-soft:#3B1F1A; --ok:#4FCB8A; --ok-soft:#163327; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1B1F; --card:#15272C; --ink:#E4EFEE; --muted:#93AAB0; --line:#27424A; --soft:#1C3339;
  --a:#3CC2BD; --a-ink:#06201F; --sun:#F6C453; --sun-soft:#3A3014; --coral:#F2826F; --coral-soft:#3B1F1A; --ok:#4FCB8A; --ok-soft:#163327; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.25;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.muted{color:var(--muted)}
.btn{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:.45em 1.1em;font-weight:700}
.btn.go{background:var(--a);border-color:var(--a);color:var(--a-ink)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#3A2800}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* hub */
.mast{padding-block:26px 14px;display:grid;gap:6px}
.eyebrow{font-family:var(--display);font-size:.82rem;letter-spacing:.1em;color:var(--a);text-transform:uppercase}
.mast h1{font-size:clamp(1.8rem,6vw,2.5rem)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start}
.tile .top{display:flex;gap:12px;align-items:center}
.badge{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:1.05rem;background:var(--soft);color:var(--a)}
.tile:nth-child(2) .badge{background:var(--sun-soft);color:#9A6A00}
.tile:nth-child(3) .badge{background:var(--coral-soft);color:var(--coral)}
.tile:nth-child(4) .badge{background:var(--ok-soft);color:var(--ok)}
.tile h3{font-size:1.15rem}
.tile p{margin:0;font-size:.92rem;color:var(--muted)}
.best{font-size:.85rem;color:var(--muted)}
.best b{color:var(--ink);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.note{background:var(--card);border:2px dashed var(--line);border-radius:var(--r);padding:14px 16px;margin-top:14px;display:grid;gap:8px}
.foot{margin-top:20px;font-size:.85rem;color:var(--muted)}
/* game chrome */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:10px 16px;border-bottom:1px solid var(--line)}
.bar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bar .t{flex:1;min-width:0;font-family:var(--display);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-family:var(--display);font-variant-numeric:tabular-nums;padding:3px 10px;border-radius:10px;background:var(--soft);font-weight:600;white-space:nowrap}
.pill.hot{background:var(--sun);color:#3A2800}
.pill.low{background:var(--coral-soft);color:var(--coral)}
.hearts{letter-spacing:2px;color:var(--coral);font-size:1.1rem}
.stage{margin-top:18px;display:grid;gap:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px}
.prompt{font-family:var(--display);font-size:clamp(1.8rem,7vw,2.6rem);text-align:center;line-height:1.15;word-break:break-word}
.sub{text-align:center;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:460px){.opts.long{grid-template-columns:1fr}}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 10px;font-weight:700;font-size:1.05rem;min-height:56px}
.opt:hover:not(:disabled){border-color:var(--a)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--coral-soft);border-color:var(--coral);color:var(--coral)}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:10px 14px;font-size:.95rem}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--coral-soft)}
.ex{font-style:italic}
.at{font-size:.8rem;color:var(--muted)}
/* match */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
.mc{min-height:84px;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px;font-weight:700;display:grid;place-items:center;text-align:center;line-height:1.25;transition:transform .12s}
.mc.en{font-family:var(--display);font-weight:500;font-size:1.08rem}
.mc.th{font-size:.95rem}
.mc.sel{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 30%,transparent);transform:translateY(-2px)}
.mc.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);opacity:.55;cursor:default}
.mc.bad{border-color:var(--coral);background:var(--coral-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* ladder */
.ladder{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.rung{width:14px;height:14px;border-radius:4px;background:var(--soft)}
.rung.on{background:var(--sun)}
.trio{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-family:var(--display);font-size:1.25rem}
.trio span{padding:4px 12px;border-radius:10px;background:var(--soft)}
.trio span.q{background:var(--sun-soft);color:#8A5D00;border:2px dashed var(--sun)}
.ptag{display:inline-block;font-size:.8rem;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--soft);color:var(--muted)}
/* result */
.res{text-align:center;display:grid;gap:8px;padding-block:20px 6px}
.stars{font-size:2.4rem;letter-spacing:6px;color:var(--sun)}
.stars .off{color:var(--line)}
.big{font-family:var(--display);font-size:clamp(2.4rem,9vw,3.2rem);font-variant-numeric:tabular-nums;line-height:1}
.list{display:grid;gap:8px}
.li{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;gap:2px}
.li b{font-family:var(--display);font-weight:500}
.sent{font-size:1.15rem;text-align:center;line-height:1.6}
.sent.err u{text-decoration-thickness:2px;text-underline-offset:4px}
.sent sup{font-size:.7em;color:var(--muted);margin-left:1px}
.subj{background:var(--sun-soft);border-radius:6px;padding:0 4px;font-weight:700}
s.xo{color:var(--muted);text-decoration-color:var(--coral);text-decoration-thickness:2px}
.hintb{font-size:.85rem;padding:.3em .9em}
.sentfb{display:inline-block;margin:4px 0;font-size:1.02rem}
.steps{display:grid;gap:8px}
.step{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--a);color:var(--a-ink);display:grid;place-items:center;font-family:var(--display);font-weight:600}
.step.warn .n{background:var(--coral)}
.prompt.th{font-family:var(--body);font-weight:700;font-size:clamp(1.4rem,5.5vw,1.9rem)}
.hints{display:grid;gap:6px}
.hint{background:var(--sun-soft);border-radius:10px;padding:8px 12px;font-size:.95rem}
.fb.info{background:var(--soft);margin-top:8px}
.opt.off{opacity:.5}
.whyq{padding:4px 2px 8px;font-size:1rem}
.bl{margin:6px 0;display:block}
.bn{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--a);color:var(--a-ink);font-size:.75rem;font-weight:700;margin-right:6px;vertical-align:1px}
.xm{color:var(--coral);font-size:.85rem;font-weight:600}
.tile.wide{grid-column:1/-1}
.rules .card h3{font-size:1.08rem;color:var(--a)}
.rules table{width:100%;border-collapse:collapse;font-size:.95rem}
.rules td,.rules th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.rules th{color:var(--muted);font-weight:600}
.rules p,.rules ul{margin:0}
.rules ul{padding-left:1.2em}
.rules .eg{font-style:italic;color:var(--muted)}
.sent .blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--sun);text-align:center;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

h": "แหวน", "x": "นับได้ → two rings (แต่ jewellery นับไม่ได้)"}, {"w": "loaf", "c": "C", "th": "ก้อน (ขนมปัง)", "x": "นับได้ พหูพจน์ → loaves (ใช้นับ bread)"}, {"w": "friend", "c": "C", "th": "เพื่อน", "x": "นับได้ → a few friends"}], "rules": [{"h": "วิธีคิด 3 ขั้น · Subject-Verb Agreement", "b": "<p><b>หลักพื้นฐาน: ตัว s มีได้ฝั่งเดียว<\/b> ประธาน 1 อย่าง (ไม่มี s) → กริยาเติม s / is / was / has · ประธานหลายอย่าง (มี s) → กริยาไม่เติม s / are / were / have<br><span class=\"eg\">The boy plays. · The boys play.<\/span><\/p>\n<div class=\"steps\" style=\"margin-top:10px\">\n<div class=\"step\"><span class=\"n\">1<\/span><div><b>ขีดฆ่าส่วนขยายทิ้ง<\/b>: of + … · who/which … · on/in/with … · as well as / along with …<br><span class=\"sentfb\"><b class=\"subj\">One<\/b> <s class=\"xo\">of my friends<\/s> <u>lives<\/u>…<\/span><br><span class=\"sentfb\"><b class=\"subj\">The teacher<\/b>, <s class=\"xo\">as well as her students,<\/s> <u>is<\/u>…<\/span><\/div><\/div>\n<div class=\"step\"><span class=\"n\">2<\/span><div><b>นับว่าที่เหลือ \"1 อย่าง\" หรือ \"หลายอย่าง\"<\/b><br>1 อย่าง → เอกพจน์: Each, Every, Everyone, Nobody (ชี้ทีละคน) · เงิน เวลา ระยะทาง (ก้อนเดียว) · V-ing (กิจกรรมเดียว)<br>หลายอย่าง → พหูพจน์: A and B, Both A and B (บวกกันได้ 2)<\/div><\/div>\n<div class=\"step warn\"><span class=\"n\">!<\/span><div><b>ข้อยกเว้นมีแค่ 2 กลุ่ม<\/b><br>ก) <b>ห้ามขีดฆ่า of<\/b> ต้องดูคำนามข้างหลัง: <b>A number of<\/b> (= หลาย → พหูพจน์) · <b>Most / Some / All / Half of<\/b> + นาม → ผันตามนามนั้น<br><span class=\"eg\">A number = หลาย (พหูพจน์) · The number = จำนวน (เอกพจน์)<\/span><br>ข) <b>มี or / nor → ตัวที่ใกล้กริยาชนะ<\/b>: <span class=\"sentfb\"><s class=\"xo\">Neither my brother nor<\/s> <b class=\"subj\">my parents<\/b> <u>are<\/u>…<\/span><\/div><\/div>\n<\/div>\n<p style=\"margin-top:10px\"><b>วิธีฝึก:<\/b> เอาดินสอขีดฆ่าส่วนขยายในโจทย์ก่อนเลือกคำตอบทุกครั้ง ในเกมโหมด Subject-Verb Agreement กดปุ่ม \"ใบ้\" เพื่อดูว่าต้องขีดฆ่าตรงไหน<\/p>"}, {"h": "1. นามนับได้ vs นับไม่ได้", "b": "<table><tr><th>นับได้ (C)<\/th><th>นับไม่ได้ (U)<\/th><\/tr>\n<tr><td>a / an ได้ · เติม -s ได้<br><span class=\"eg\">a chair, two chairs<\/span><\/td><td>ห้ามใช้ a / an · ห้ามเติม -s<br><span class=\"eg\">furniture (ไม่มี furnitures)<\/span><\/td><\/tr>\n<tr><td>coin, suggestion, suitcase, job, tool, song, car<\/td><td>money, advice, luggage, homework, equipment, music, traffic<\/td><\/tr><\/table>\n<p style=\"margin-top:8px\">คำที่ต้องจำว่า <b>นับไม่ได้<\/b>: information, advice, furniture, luggage, homework, news, equipment, knowledge, weather, traffic, rubbish, research, progress, fun<\/p>"}, {"h": "2. หน่วยนับของนามนับไม่ได้", "b": "<ul><li>a piece of advice / information / furniture / cake<\/li><li>a loaf of bread (two <b>loaves<\/b>) · a slice of bread / pizza<\/li><li>a glass / bottle / carton of milk / water<\/li><li>a bar of soap / chocolate · a sheet of paper · a bowl of rice<\/li><\/ul>\n<p class=\"eg\" style=\"margin-top:6px\">two pieces of furniture ✓ · two furnitures ✗<\/p>"}, {"h": "3. คำบอกปริมาณ", "b": "<table><tr><th><\/th><th>นับได้ (พหูพจน์)<\/th><th>นับไม่ได้<\/th><\/tr>\n<tr><td>มาก<\/td><td>many<\/td><td>much<\/td><\/tr>\n<tr><td>มีอยู่บ้าง (บวก)<\/td><td>a few<\/td><td>a little<\/td><\/tr>\n<tr><td>แทบไม่มี (ลบ)<\/td><td>few<\/td><td>little<\/td><\/tr>\n<tr><td>น้อยกว่า<\/td><td>fewer<\/td><td>less<\/td><\/tr>\n<tr><td>ใช้ได้ทั้งคู่<\/td><td colspan=\"2\">a lot of, lots of, some (บอกเล่า/ขอร้อง), any (ปฏิเสธ/คำถาม)<\/td><\/tr><\/table>"}, {"h": "4. เลือกกริยาให้ตรงกับคำนาม", "b": "<ul><li>นามนับไม่ได้ → กริยาเอกพจน์: <span class=\"eg\">The news <b>is<\/b> good. Money <b>is<\/b> not everything.<\/span><\/li>\n<li>ของเป็นคู่ → พหูพจน์: trousers, jeans, glasses, scissors <span class=\"eg\">My glasses <b>are<\/b>…<\/span><\/li>\n<li>พหูพจน์เสมอ: police, people, children, teeth, mice <span class=\"eg\">The police <b>are<\/b>…<\/span><\/li>\n<li>ชื่อวิชาลงท้าย -s เป็นเอกพจน์: mathematics, physics, economics<\/li>\n<li>There is + เอกพจน์/นับไม่ได้ · There are + พหูพจน์<\/li><\/ul>"}, {"h": "5. Subject-Verb Agreement: สูตรที่ต้องจำ", "b": "<table><tr><th>รูปประโยค<\/th><th>กริยา<\/th><\/tr>\n<tr><td>One of + นามพหูพจน์<\/td><td><b>เอกพจน์<\/b> <span class=\"eg\">One of my friends lives…<\/span><\/td><\/tr>\n<tr><td>A number of + พหูพจน์ (= หลาย)<\/td><td><b>พหูพจน์<\/b> <span class=\"eg\">A number of students are…<\/span><\/td><\/tr>\n<tr><td>The number of + พหูพจน์ (= จำนวน)<\/td><td><b>เอกพจน์<\/b> <span class=\"eg\">The number of students is…<\/span><\/td><\/tr>\n<tr><td>Each / Every / Each of… / Everyone / Nobody<\/td><td><b>เอกพจน์<\/b><\/td><\/tr>\n<tr><td>Neither of / Either of + พหูพจน์<\/td><td><b>เอกพจน์<\/b> (แบบข้อสอบ)<\/td><\/tr>\n<tr><td>A and B · Both A and B<\/td><td><b>พหูพจน์<\/b><\/td><\/tr>\n<tr><td>Either A or B · Neither A nor B · Not only A but also B<\/td><td>ผันตาม <b>B<\/b> (ตัวที่ใกล้กริยา)<\/td><\/tr>\n<tr><td>A as well as / along with / together with B<\/td><td>ผันตาม <b>A<\/b><\/td><\/tr>\n<tr><td>Most of / Some of / All of / Half of + นาม<\/td><td>ผันตาม<b>นามข้างหลัง<\/b><\/td><\/tr>\n<tr><td>เวลา ระยะทาง เงิน (Ten kilometres, Two hours)<\/td><td><b>เอกพจน์<\/b><\/td><\/tr>\n<tr><td>V-ing เป็นประธาน (Playing games…)<\/td><td><b>เอกพจน์<\/b><\/td><\/tr><\/table>\n<p style=\"margin-top:8px\">เคล็ดลับ: หาประธานตัวจริงก่อน แล้วข้ามส่วนขยาย เช่น <span class=\"eg\">The man <s>who sells vegetables<\/s> <b>is<\/b>… / The books <s>on the table<\/s> <b>are<\/b>…<\/span><\/p>"}], "quant": [{"s": "How ____ money do you have?", "a": "much", "d": ["many"], "x": "money นับไม่ได้ → How much"}, {"s": "How ____ eggs do we need for the cake?", "a": "many", "d": ["much"], "x": "eggs นับได้ พหูพจน์ → How many"}, {"s": "There isn't ____ milk left in the fridge.", "a": "much", "d": ["many"], "x": "milk นับไม่ได้ → much (มักใช้ในประโยคปฏิเสธ/คำถาม)"}, {"s": "I have ____ friends here, so I'm not lonely.", "a": "a few", "d": ["a little", "few"], "x": "friends นับได้ + ความหมายบวก \"มีอยู่บ้าง\" → a few"}, {"s": "We have very ____ time, so let's hurry.", "a": "little", "d": ["few", "many"], "x": "time นับไม่ได้ + ความหมายลบ \"แทบไม่มี\" → little"}, {"s": "Can I have ____ water, please?", "a": "some", "d": ["any", "many"], "x": "ประโยคขอร้อง/เสนอ ใช้ some แม้เป็นคำถาม"}, {"s": "Is there ____ sugar in the jar?", "a": "any", "d": ["many", "a few"], "x": "คำถามทั่วไป + นามนับไม่ได้ → any"}, {"s": "She gave me ____ useful advice.", "a": "some", "d": ["an", "many"], "x": "advice นับไม่ได้ → some advice (ห้าม an advice)"}, {"s": "I bought two ____ bread for breakfast.", "a": "loaves of", "d": ["bars of", "tubes of"], "x": "ขนมปังนับเป็นก้อน → a loaf of bread / two loaves of bread"}, {"s": "Could you buy me ____ soap?", "a": "a bar of", "d": ["a loaf of", "a carton of"], "x": "สบู่ก้อน → a bar of soap"}, {"s": "He drank ____ orange juice.", "a": "a glass of", "d": ["a slice of", "a bar of"], "x": "เครื่องดื่ม → a glass of juice"}, {"s": "____ students passed the test, so the teacher was disappointed.", "a": "Few", "d": ["Little", "A little"], "x": "students นับได้ + ความหมายลบ \"แทบไม่มีใคร\" → Few"}, {"s": "There's ____ furniture in the living room.", "a": "a lot of", "d": ["many", "a few"], "x": "furniture นับไม่ได้ → a lot of (many/a few ใช้กับนามนับได้)"}, {"s": "I need ____ information about the school trip.", "a": "some", "d": ["many", "a few"], "x": "information นับไม่ได้ → some"}, {"s": "How ____ luggage are you taking?", "a": "much", "d": ["many"], "x": "luggage นับไม่ได้ → How much"}, {"s": "She has ____ homework tonight.", "a": "a lot of", "d": ["many", "several"], "x": "homework นับไม่ได้ → a lot of (many/several ใช้กับนามนับได้)"}, {"s": "I don't have ____ questions.", "a": "any", "d": ["a little", "much"], "x": "ประโยคปฏิเสธ + นามนับได้พหูพจน์ → any"}, {"s": "There are ____ apples in the basket.", "a": "a few", "d": ["a little", "much"], "x": "apples นับได้ → a few"}, {"s": "Let me give you ____ piece of advice.", "a": "a", "d": ["an", "some"] frightening", "d": "frightened", "k": "Pc", "s": "The villain", "th": "ตัวร้ายในหนังน่ากลัวมาก เด็กหลายคนร้องไห้", "e": ""}, {"q": "My dad dances in the supermarket. He's so ____!", "a": "embarrassing", "d": "embarrassed", "k": "Pc", "s": "My dad", "th": "พ่อเต้นในซูเปอร์มาร์เก็ต น่าอายมาก", "e": ""}, {"q": "Are you ____ in learning Japanese?", "a": "interested", "d": "interesting", "k": "C", "s": "you", "th": "เธอสนใจเรียนภาษาญี่ปุ่นไหม", "e": "in"}, {"q": "I'm ____ of eating noodles every day.", "a": "tired", "d": "tiring", "k": "C", "s": "I", "th": "ฉันเบื่อการกินก๋วยเตี๋ยวทุกวัน", "e": "of"}, {"q": "Mali is ____ about her trip to Japan next week.", "a": "excited", "d": "exciting", "k": "C", "s": "Mali", "th": "มะลิรู้สึกตื่นเต้นกับทริปไปญี่ปุ่นสัปดาห์หน้า", "e": "about"}, {"q": "We were ____ at the size of the elephant.", "a": "amazed", "d": "amazing", "k": "C", "s": "We", "th": "พวกเรารู้สึกทึ่งกับขนาดของช้าง", "e": "at"}, {"q": "He is ____ with his new phone. He loves it.", "a": "satisfied", "d": "satisfying", "k": "C", "s": "He", "th": "เขาพอใจกับโทรศัพท์เครื่องใหม่ เขาชอบมันมาก", "e": "with"}, {"q": "I'm ____ about the exam tomorrow.", "a": "worried", "d": "worrying", "k": "C", "s": "I", "th": "ฉันกังวลเรื่องสอบพรุ่งนี้", "e": "about"}, {"q": "Mum gave me a ____ look when I came home late.", "a": "worried", "d": "worrying", "k": "X", "s": "a look", "th": "แม่มองฉันด้วยสีหน้ากังวลตอนฉันกลับบ้านดึก", "e": "look = สีหน้าของคนที่กำลังรู้สึกกังวล → ใช้ -ed ได้: a worried look"}, {"q": "He sat in class with a ____ face, waiting for the bell.", "a": "bored", "d": "boring", "k": "X", "s": "a face", "th": "เขานั่งในห้องด้วยสีหน้าเบื่อ ๆ รอให้ออดดัง", "e": "face = สีหน้าของคนที่กำลังรู้สึกเบื่อ → ใช้ -ed ได้: a bored face"}], "err": []}, "ifc": {"rules": [{"h": "Trick If-clause", "b": "<div class=\"steps\">\n<div class=\"step\"><span class=\"n\">1<\/span><div><b>ฝั่ง if ห้ามมี will<\/b> (ออกบ่อยที่สุด)<br>will ต้องอยู่อีกฝั่งเสมอ แม้จะพูดถึงอนาคต<br><span class=\"sentfb\">✓ He'll be very happy <b class=\"subj\">if I do<\/b> it myself.<\/span><br><span class=\"sentfb\">✗ <s class=\"xo\">if I will do<\/s> it myself<\/span><\/div><\/div>\n<div class=\"step\"><span class=\"n\">2<\/span><div><b>ถามว่าเรื่องนี้ \"จริง\" แค่ไหน: ยิ่งไม่จริง ยิ่งถอยหลังไปอดีต<\/b>\n<table style=\"margin-top:6px\"><tr><th>เรื่องนี้…<\/th><th>ฝั่ง if<\/th><th>อีกฝั่ง<\/th><\/tr>\n<tr><td><b>Degree 0<\/b><br>จริงเสมอ (วิทยาศาสตร์ นิสัย)<\/td><td>V1<\/td><td>V1<\/td><\/tr>\n<tr><td><b>Degree 1<\/b><br>อาจเกิดขึ้นจริง<\/td><td>V1 / V-s<\/td><td><b>will<\/b> + V1<\/td><\/tr>\n<tr><td><b>Degree 2<\/b><br>ไม่จริง (ตอนนี้) แค่สมมติ<\/td><td><b>V2 / were<\/b><\/td><td><b>would<\/b> + V1<\/td><\/tr>\n<tr><td><b>Degree 3<\/b><br>ไม่จริง (ในอดีต) ผ่านไปแล้ว<\/td><td><b>had V3<\/b><\/td><td><b>would have<\/b> + V3<\/td><\/tr><\/table>\n<p style=\"margin-top:6px\"><span class=\"eg\">If you heat ice, it melts. (0) · If it rains tomorrow, we will stay home. (1) · If I were a bird, I would fly. (2) · If I had studied, I would have passed. (3)<\/span><\/p><\/div><\/div>\n<div class=\"step\"><span class=\"n\">3<\/span><div><b>ดูประโยคใบ้<\/b> ว่าจริงหรือไม่จริง<br><span class=\"sentfb\">If I ___ the answer, I ___ you. <b class=\"subj\">Let me figure it out first.<\/b> → know / will tell (1)<\/span><br><span class=\"sentfb\">If I ___ the answer right now, I ___ you. <b class=\"subj\">But I really don't.<\/b> → knew / would tell (2)<\/span><br>คำใบ้ว่าไม่จริง (ตอนนี้) → Degree 2: But I don't… · No way · I'm not… · right now<br>คำใบ้ว่าไม่จริง (ในอดีต) → Degree 3: yesterday · last… · But I didn't… · Why didn't you…? · I'm sorry I forgot…<\/div><\/div>\n<\/div>\n<p style=\"margin-top:10px;font-size:1.05rem\"><b>ท่องสั้น ๆ:<\/b> if ห้ามมี will → จริงใช้ will · ไม่จริงถอยหลัง (ตอนนี้: V2 + would · อดีต: had V3 + would have V3) · ดูประโยคใบ้<\/p>"}, {"h": "คู่ที่ต้องมาด้วยกัน", "b": "<p><b>V1 ↔ V1<\/b> (Degree 0) · <b>V1 ↔ will<\/b> (Degree 1) · <b>V2 ↔ would<\/b> (Degree 2) · <b>had V3 ↔ would have V3<\/b> (Degree 3)<\/p><p class=\"eg\" style=\"margin-top:6px\">เห็นอีกฝั่งเป็น would → ฝั่ง if ต้องเป็น V2 · เห็นอีกฝั่งเป็น will → ฝั่ง if ต้องเป็น V1 · เห็นอีกฝั่งเป็น would have → ฝั่ง if ต้องเป็น had V3<\/p>"}, {"h": "จุดเล็กที่ต้องจำ", "b": "<ul><li><b>If I were…<\/b> ใช้ were กับทุกประธานใน Degree 2: If I <b>were<\/b> you, I would…<\/li>\n<li><b>unless = if … not:<\/b> Unless you hurry, you'll be late. = If you don't hurry…<\/li>\n<li>ฝั่ง will ใช้ <b>can / may / might<\/b> แทนได้: If you exercise, you <b>may feel<\/b> better.<\/li>\n<li>ฝั่ง if จะอยู่หน้าหรือหลังประโยคก็ได้: He'll be happy <b>if I do it<\/b>.<\/li><\/ul>"}], "deg": [{"s": "If you heat ice, it melts.", "g": "0", "x": "ความจริงทางวิทยาศาสตร์ เกิดทุกครั้ง → ทั้งสองฝั่งใช้ V1"}, {"s": "If you mix red and yellow, you get orange.", "g": "0", "x": "ผสมสีเมื่อไหร่ก็ได้ผลแบบนี้ทุกครั้ง → If + V1, V1"}, {"s": "If water reaches 100°C, it boils.", "g": "0", "x": "ความจริงทางวิทยาศาสตร์ → If + V1, V1"}, {"s": "If I drink coffee at night, I can't sleep.", "g": "0", "x": "เรื่องที่เป็นแบบนี้ทุกครั้ง (นิสัย) → If + V1, V1"}, {"s": "If plants don't get water, they die.", "g": "0", "x": "ความจริงเสมอ → If + V1, V1"}, {"s": "If you press this button, the light turns on.", "g": "0", "x": "กดเมื่อไหร่ไฟก็ติดทุกครั้ง → If + V1, V1"}, {"s": "If it rains, the roads get wet.", "g": "0", "x": "ฝนตกเมื่อไหร่ถนนก็เปียกทุกครั้ง → If + V1, V1"}, {"s": "If you don't sleep enough, you feel tired.", "g": "0", "x": "เป็นแบบนี้ทุกครั้ง → If + V1, V1"}, {"s": "If it rains tomorrow, we will stay at home.", "g": "1", "x": "พรุ่งนี้ฝนอาจตกจริง → If + V1, will + V1"}, {"s": "If you study hard, you will pass the exam.", "g": "1", "x": "เรื่องที่อาจเกิดขึ้นจริงในอนาคต → If + V1, will + V1"}, {"s": "If I see Mali, I'll give her your message.", "g": "1", "x": "อาจเจอมะลิจริง → If + V1, will + V1"}, {"s": "If you sign up today, you will get a free T-shirt.", "g": "1", "x": "สมัครวันนี้ได้จริง → If + V1, will + V1"}, {"s": "If we don't hurry, we will miss the bus.", "g": "1", "x": "อาจตกรถจริง → If + V1, will + V1"}, {"s": "If you exercise every day, you may feel better.", "g": "1", "x": "ฝั่ง will ใช้ may / can แทนได้ → ยังเป็น Degree 1"}, {"s": "Unless you hurry, you'll be late.", "g": "1", "x": "unless = if … not → If you don't hurry, you'll be late"}, {"s": "He'll be very happy if I bake the cake myself.", "g": "1", "x": "ฝั่ง if อยู่ท้ายประโยคก็ได้ ยังเป็น If + V1, will + V1 (มาจากข้อสอบจริง)"}, {"s": "If I were a bird, I would fly to Japan.", "g": "2", "x": "ฉันไม่ใช่นก = สมมติ ไม่จริง → If + were, would + V1"}, {"s": "If I had a million baht, I would buy a big house.", "g": "2", "x": "ตอนนี้ไม่มีเงินล้าน = สมมติ → If + V2, would + V1"}, {"s": "If I knew the answer, I would tell you. But I don't.", "g": "2", "x": "\"But I don't\" = ความจริงคือไม่รู้ → If + V2, would + V1"}, {"s": "If my dad were here, he would help us.", "g": "2", "x": "พ่อไม่ได้อยู่ที่นี่ = สมมติ → If + were, would + V1"}, {"s": "If I were you, I would see a doctor.", "g": "2", "x": "ฉันเป็นเธอไม่ได้ = สมมติ (ใช้ให้คำแนะนำ) → If I were you, I would…"}, {"s": "If dogs could talk, they would tell us many secrets.", "g": "2", "x": "หมาพูดไม่ได้ = ไม่จริง → If + could, would + V1"}, {"s": "If I lived near the sea, I would swim every day.", "g": "2", "x": "ตอนนี้ไม่ได้อยู่ใกล้ทะเล = สมมติ → If + V2, would + V1"}, {"s": "If she had more time, she would learn the piano.", "g": "2", "x": "ตอนนี้ไม่มีเวลา = สมมติ → If + V2, would + V1"}, {"s": "If I had studied harder, I would have passed the test.", "g": "3", "x": "เรื่องผ่านไปแล้ว (ไม่ได้ตั้งใจเรียน สอบไม่ผ่าน) → If + had V3, would have + V3"}, {"s": "If we had left earlier, we wouldn't have missed the train.", "g": "3", "x": "เรื่องในอดีตที่ไม่ได้เกิด (ไม่ได้ออกเร็ว ตกรถไฟ) → had V3 ↔ would have V3"}, {"s": "If she had seen the sign, she would have stopped.", "g": "3", "x": "ในอดีตเธอไม่เห็นป้าย = สมมติเรื่องที่ผ่านไปแล้ว → had V3 ↔ would have V3"}, {"s": "If you had told me, I would have helped you.", "g": "3", "x": "ในอดีตเธอไม่ได้บอก → had V3 ↔ would have V3"}, {"s": "If it hadn't rained yesterday, we would have gone to the beach.", "g": "3", "x": "yesterday ฝนตกไปแล้ว = สมมติย้อนอดีต → had V3 ↔ would have V3"}, {"s": "If Tom had set his alarm, he wouldn't have been late this morning.", "g": "3", "x": "เช้านี้ผ่านไปแล้ว ทอมไม่ได้ตั้งนาฬิกาปลุก → had V3 ↔ would have V3"}, {"s": "If I had known about the party, I would have come.", "g": "3", "x": "ไม่รู้เรื่องปาร์ตี้ (ผ่านไปแล้ว) → had V3 ↔ would have V3"}, {"s": "If they had taken a map, they wouldn't have got lost.", "g": "3", "x": "ไม่ได้เอาแผนที่ไป และหลงทางไปแล้ว → had V3 ↔ would have V3"}], "fill": [{"q": "If it ____ tomorrow, we ____ the picnic.", "a": "rains / will cancel", "d": ["will rain / cancel", "rained / will cancel", "will rain / will cancel"], "g": "1", "c": "tomorrow = เรื่องที่อาจเกิดจริง", "th": "ถ้าพรุ่งนี้ฝนตก เราจะยกเลิกปิกนิก"}, {"q": "If I ____ the answer right now, I ____ you. But I really don't.", "a": "knew / would tell", "d": ["know / tell", "know / will tell", "knew / told"], "g": "2", "c": "But I really don't = ความจริงคือไม่รู้", "th": "ถ้าตอนนี้ฉันรู้คำตอบ ฉันจะบอกเธอ แต่ฉันไม่รู้จริง ๆ (ข้อสอบจริง ธ.ค. 65)"}, {"q": "If I ____ the answer, I ____ you. Let me figure it out first.", "a": "know / will tell", "d": ["knew / would tell", "know / tell", "knew / told"], "g": "1", "c": "Let me figure it out first = ยังเป็นไปได้", "th": "ถ้าฉันรู้คำตอบ ฉันจะบอก ขอคิดก่อนนะ (ข้อสอบจริง ธ.ค. 65)"}, {"q": "If you ____ ice, it ____.", "a": "heat / melts", "d": ["heated / would melt", "will heat / melts", "heat / would melt"], "g": "0", "c": "ความจริงทางวิทยาศาสตร์ เกิดทุกครั้ง", "th": "ถ้าเอาน้ำแข็งไปโดนความร้อน มันจะละลาย"}, {"q": "If I ____ you, I ____ to the doctor.", "a": "were / would go", "d": ["am / will go", "was / will go", "were / will go"], "g": "2", "c": "ฉันเป็นเธอไม่ได้ = สมมติ", "th": "ถ้าฉันเป็นเธอ ฉันจะไปหาหมอ"}, {"q": "If you ____ hard, you ____ the exam.", "a": "study / will pass", "d": ["will study / pass", "studied / will pass", "will study / will pass"], "g": "1", "c": "เรื่องที่อาจเกิดจริงในอนาคต", "th": "ถ้าเธอตั้งใจเรียน เธอจะสอบผ่าน"}, {"q": "If we ____ now, we ____ the bus.", "a": "don't leave / will miss", "d": ["won't leave / miss", "didn't leave / will miss", "won't leave / will miss"], "g": "1", "c": "อาจตกรถจริง", "th": "ถ้าเราไม่ออกเดี๋ยวนี้ เราจะตกรถ"}, {"q": "No way! If I ____ her the secret, she ____ at me.", "a": "told / would laugh", "d": ["tell / laughs", "told / will laugh", "tell / would laugh"], "g": "2", "c": "No way = ไม่บอกแน่นอน → เรื่องสมมติ", "th": "ไม่มีทาง! ถ้าฉันบอกความลับเธอ เธอจะหัวเราะเยาะฉัน (ข้อสอบจริง 2022)"}, {"q": "I'm not rich, but if I ____ a million baht, I ____ a house for my parents.", "a": "had / would buy", "d": ["have / would buy", "had / will buy", "have / buy"], "g": "2", "c": "I'm not rich = ความจริงคือไม่มีเงิน", "th": "ฉันไม่รวย แต่ถ้ามีเงินล้าน ฉันจะซื้อบ้านให้พ่อแม่"}, {"q": "If you ____ red and blue, you ____ purple.", "a": "mix / get", "d": ["mixed / would get", "will mix / get", "mix / would get"], "g": "0", "c": "ผสมสีเมื่อไหร่ก็ได้ผลแบบนี้ทุกครั้ง", "th": "ถ้าผสมสีแดงกับน้ำเงิน จะได้สีม่วง"}, {"q": "If plants ____ water, they ____.", "a": "don't get / die", "d": ["won't get / die", "didn't get / would die", "don't get / would die"], "g": "0", "c": "ความจริงเสมอ", "th": "ถ้าต้นไม้ไม่ได้น้ำ มันจะตาย"}, {"q": "If dogs ____ talk, they ____ us many secrets.", "a": "could / would tell", "d": ["can / will tell", "could / will tell", "can / would tell"], "g": "2", "c": "หมาพูดไม่ได้ = ไม่จริง", "th": "ถ้าหมาพูดได้ มันจะบอกความลับเรามากมาย"}, {"q": "If you ____ up today, you ____ a free T-shirt.", "a": "sign / will get", "d": ["will sign / get", "signed / will get", "will sign / will get"], "g": "1", "c": "สมัครวันนี้ได้จริง", "th": "ถ้าสมัครวันนี้ จะได้เสื้อยืดฟรี"}, {"q": "If you exercise regularly, you ____ better.", "a": "may feel", "d": ["felt", "feeling", "to feel"], "g": "1", "c": "ฝั่ง if เป็น V1 (exercise) → อีกฝั่งใช้ will / may / can + V1", "th": "ถ้าออกกำลังกายสม่ำเสมอ เธออาจรู้สึกดีขึ้น (ข้อสอบจริง ธ.ค. 65)"}, {"q": "____ you hurry, you will be late.", "a": "Unless", "d": ["If", "When", "Because"], "g": "1", "c": "ความหมายคือ \"ถ้าไม่รีบ…จะสาย\"", "th": "ถ้าไม่รีบ เธอจะไปสาย (unless = if … not)"}, {"q": "If my grandma ____ here, she ____ us a story. But she lives in Chiang Mai.", "a": "were / would tell", "d": ["is / will tell", "was / will tell", "is / would tell"], "g": "2", "c": "But she lives in Chiang Mai = ยายไม่ได้อยู่ที่นี่", "th": "ถ้ายายอยู่ที่นี่ ยายจะเล่านิทานให้ฟัง แต่ยายอยู่เชียงใหม่"}, {"q": "If you ____ water to 100°C, it ____.", "a": "heat / boils", "d": ["will heat / boils", "heat / would boil", "heated / will boil"], "g": "0", "c": "ความจริงทางวิทยาศาสตร์", "th": "ถ้าต้มน้ำถึง 100 องศา น้ำจะเดือด"}, {"q": "I'll call you if I ____ any news.", "a": "hear", "d": ["will hear", "heard", "would hear"], "g": "1", "c": "อีกฝั่งมี will แล้ว → ฝั่ง if ห้ามมี will", "th": "ฉันจะโทรหาเธอถ้าได้ข่าวอะไร"}, {"q": "He'll be very happy if I ____ the cake myself.", "a": "make", "d": ["will make", "made", "would make"], "g": "1", "c": "อีกฝั่งมี will แล้ว → ฝั่ง if ใช้ V1", "th": "เขาจะดีใจมากถ้าฉันทำเค้กเอง (ข้อสอบจริง ธ.ค. 65)"}, {"q": "If I ____ near the sea, I would swim every day.", "a": "lived", "d": ["live", "will live", "living"], "g": "2", "c": "อีกฝั่งเป็น would → ฝั่ง if ต้องเป็น V2", "th": "ถ้าฉันอยู่ใกล้ทะเล ฉันจะว่ายน้ำทุกวัน"}, {"q": "She ____ the piano if she had more time.", "a": "would learn", "d": ["will learn", "learns", "learned"], "g": "2", "c": "ฝั่ง if เป็น V2 (had) → อีกฝั่งต้องเป็น would + V1", "th": "เธอจะเรียนเปียโนถ้าเธอมีเวลามากกว่านี้"}, {"q": "If it ____ this afternoon, the match will be cancelled.", "a": "rains", "d": ["will rain", "rained", "would rain"], "g": "1", "c": "อีกฝั่งมี will แล้ว → ฝั่ง if ใช้ V1", "th": "ถ้าบ่ายนี้ฝนตก การแข่งขันจะถูกยกเลิก"}, {"q": "If you don't sleep enough, you ____ tired.", "a": "feel", "d": ["felt", "would feel", "feeling"], "g": "0", "c": "เป็นแบบนี้ทุกครั้ง → ทั้งสองฝั่งใช้ V1", "th": "ถ้านอนไม่พอ จะรู้สึกเหนื่อย"}, {"q": "If I ____ a bird, I ____ to the moon.", "a": "were / would fly", "d": ["am / will fly", "was / will fly", "am / would fly"], "g": "2", "c": "ฉันไม่ใช่นก = สมมติ", "th": "ถ้าฉันเป็นนก ฉันจะบินไปดวงจันทร์"}, {"q": "If you ____ me your number, I ____ you tonight.", "a": "give / will call", "d": ["will give / call", "gave / will call", "will give / will call"], "g": "1", "c": "เรื่องที่อาจเกิดจริง", "th": "ถ้าให้เบอร์มา ฉันจะโทรหาคืนนี้"}, {"q": "If he ____ more carefully, he wouldn't make so many mistakes.", "a": "listened", "d": ["listens", "will listen", "has listened"], "g": "2", "c": "อีกฝั่งเป็น wouldn't → ฝั่ง if ต้องเป็น V2", "th": "ถ้าเขาฟังให้ดีกว่านี้ เขาคงไม่ทำผิดเยอะขนาดนี้"}, {"q": "If you ____ this button, the light ____ on.", "a": "press / comes", "d": ["pressed / would come", "will press / comes", "press / would come"], "g": "0", "c": "กดเมื่อไหร่ไฟก็ติดทุกครั้ง", "th": "ถ้ากดปุ่มนี้ ไฟจะติด"}, {"q": "Unless you ____ your homework, you can't play games.", "a": "finish", "d": ["will finish", "finished", "would finish"], "g": "1", "c": "unless ก็คือฝั่ง if → ห้ามมี will", "th": "ถ้าไม่ทำการบ้านให้เสร็จ จะเล่นเกมไม่ได้"}, {"q": "If I ____ you, I wouldn't eat that old sandwich.", "a": "were", "d": ["am", "will be", "be"], "g": "2", "c": "If I were you = สมมติ (ใช้ were กับทุกประธาน)", "th": "ถ้าฉันเป็นเธอ ฉันจะไม่กินแซนด์วิชเก่านั่น"}, {"q": "If we ____ the forest, many animals will lose their homes.", "a": "destroy", "d": ["will destroy", "destroyed", "would destroy"], "g": "1", "c": "อีกฝั่งมี will แล้ว → ฝั่ง if ใช้ V1", "th": "ถ้าเราทำลายป่า สัตว์มากมายจะไม่มีบ้าน"}, {"q": "If I ____ harder last year, I ____ the exam. But I didn't.", "a": "had studied / would have passed", "d": ["studied / would pass", "had studied / will pass", "studied / would have passed"], "g": "3", "c": "last year + But I didn't = สมมติเรื่องที่ผ่านไปแล้ว", "th": "ถ้าปีที่แล้วฉันตั้งใจเรียนกว่านี้ ฉันคงสอบผ่าน แต่ฉันไม่ได้ตั้งใจ"}, {"q": "Why didn't you ask me? If you ____ me yesterday, I ____ you.", "a": "had asked / would have helped", "d": ["asked / would help", "had asked / will help", "would ask / had helped"], "g": "3", "c": "Why didn't you…? + yesterday = เรื่องในอดีตที่ไม่ได้เกิด", "th": "ทำไมไม่ถามฉัน ถ้าเมื่อวานเธอถาม ฉันคงช่วยไปแล้ว"}, {"q": "If it ____ last Sunday, we ____ to the beach. It rained all day.", "a": "hadn't rained / would have gone", "d": ["didn't rain / would go", "hadn't rained / will go", "wouldn't rain / had gone"], "g": "3", "c": "last Sunday + It rained all day = สมมติย้อนอดีต", "th": "ถ้าวันอาทิตย์ที่แล้วฝนไม่ตก เราคงไปทะเลแล้ว แต่ฝนตกทั้งวัน"}, {"q": "She ____ the bus if she had left home earlier.", "a": "wouldn't have missed", "d": ["wouldn't miss", "won't miss", "hadn't missed"], "g": "3", "c": "ฝั่ง if เป็น had V3 → อีกฝั่งต้องเป็น would have + V3", "th": "เธอคงไม่ตกรถบัสถ้าออกจากบ้านเร็วกว่านี้"}, {"q": "If I ____ about the party, I would have come.", "a": "had known", "d": ["knew", "have known", "would know"], "g": "3", "c": "อีกฝั่งเป็น would have → ฝั่ง if ต้องเป็น had V3", "th": "ถ้าฉันรู้เรื่องปาร์ตี้ ฉันคงมาแล้ว"}, {"q": "If the team ____ harder, they would have won the match.", "a": "had played", "d": ["played", "would play", "have played"], "g": "3", "c": "อีกฝั่งเป็น would have → ฝั่ง if ต้องเป็น had V3", "th": "ถ้าทีมเล่นหนักกว่านี้ คงชนะการแข่งขันไปแล้ว"}, {"q": "I'm sorry I forgot your birthday. If I ____, I ____ you a present.", "a": "had remembered / would have bought", "d": ["remembered / would buy", "had remembered / will buy", "remember / will buy"], "g": "3", "c": "I forgot (อดีต) = วันเกิดผ่านไปแล้ว", "th": "ขอโทษที่ลืมวันเกิดเธอ ถ้าฉันจำได้ ฉันคงซื้อของขวัญให้แล้ว"}, {"q": "If he ____ his homework, the teacher wouldn't have been angry.", "a": "had done", "d": ["did", "has done", "would do"], "g": "3", "c": "อีกฝั่งเป็น wouldn't have → ฝั่ง if ต้องเป็น had V3", "th": "ถ้าเขาทำการบ้าน ครูคงไม่โกรธ"}], "sent": [{"a": "He'll be very happy if I do it myself.", "d": ["If I'll do it myself, he is very happy.", "If he'll be very happy, I do it myself.", "He'll be very happy if I will do it myself."], "g": "1", "x": "will อยู่ฝั่งประโยคหลัก ฝั่ง if ใช้ V1 (if I do) · ข้อสอบจริง ธ.ค. 65"}, {"a": "He'll enjoy the cake if I make it myself.", "d": ["If I'll make the cake myself, he enjoys it.", "He enjoys the cake if I'll make it myself.", "If I'll make the cake myself, he'll enjoy it."], "g": "1", "x": "ฝั่ง if ใช้ V1 (if I make) ฝั่งหลักใช้ will · ข้อสอบจริง ธ.ค. 65"}, {"a": "If it rains, we will stay at home.", "d": ["If it will rain, we stay at home.", "If it will rain, we will stay at home.", "If it rained, we will stay at home."], "g": "1", "x": "If + V1, will + V1 · ฝั่ง if ห้ามมี will"}, {"a": "I would buy a car if I had enough money.", "d": ["I will buy a car if I had enough money.", "I would buy a car if I have enough money.", "I would buy a car if I will have enough money."], "g": "2", "x": "คู่ต้องตรงกัน: V2 (had) ↔ would"}, {"a": "If I were you, I would apologise.", "d": ["If I am you, I would apologise.", "If I were you, I will apologise.", "If I would be you, I apologise."], "g": "2", "x": "If I were you, I would… (สมมติว่าเป็นเธอ)"}, {"a": "If you heat ice, it melts.", "d": ["If you will heat ice, it melts.", "If you heat ice, it would melt.", "If you heated ice, it will melt."], "g": "0", "x": "ความจริงเสมอ → If + V1, V1"}, {"a": "You will miss the bus if you don't hurry.", "d": ["You will miss the bus if you won't hurry.", "You miss the bus if you won't hurry.", "You would miss the bus if you don't hurry."], "g": "1", "x": "ฝั่ง if ห้ามมี will (won't ก็ไม่ได้) → if you don't hurry"}, {"a": "If she studied harder, she would get better grades.", "d": ["If she studies harder, she would get better grades.", "If she studied harder, she will get better grades.", "If she would study harder, she gets better grades."], "g": "2", "x": "คู่ต้องตรงกัน: V2 (studied) ↔ would"}, {"a": "Unless you leave now, you will be late.", "d": ["Unless you will leave now, you are late.", "Unless you leave now, you would be late.", "Unless you left now, you will be late."], "g": "1", "x": "unless = if not → ฝั่ง unless ใช้ V1 อีกฝั่งใช้ will"}, {"a": "If I see Tom, I'll tell him.", "d": ["If I will see Tom, I tell him.", "If I will see Tom, I'll tell him.", "If I saw Tom, I'll tell him."], "g": "1", "x": "If + V1, will + V1"}, {"a": "If dogs could talk, they would tell us secrets.", "d": ["If dogs can talk, they would tell us secrets.", "If dogs could talk, they will tell us secrets.", "If dogs would talk, they tell us secrets."], "g": "2", "x": "หมาพูดไม่ได้ = สมมติ → could ↔ would"}, {"a": "If you mix red and white, you get pink.", "d": ["If you will mix red and white, you get pink.", "If you mix red and white, you would get pink.", "If you mixed red and white, you will get pink."], "g": "0", "x": "ความจริงเสมอ → If + V1, V1"}, {"a": "If you study hard, you will pass the exam.", "d": ["If you will study hard, you pass the exam.", "If you will study hard, you will pass the exam.", "If you studied hard, you will pass the exam."], "g": "1", "x": "If + V1, will + V1 · ฝั่ง if ห้ามมี will"}, {"a": "If I had wings, I would fly to school.", "d": ["If I have wings, I would fly to school.", "If I had wings, I will fly to school.", "If I would have wings, I fly to school."], "g": "2", "x": "ไม่มีปีก = สมมติ → V2 (had) ↔ would"}, {"a": "If water reaches 100°C, it boils.", "d": ["If water will reach 100°C, it boils.", "If water reaches 100°C, it would boil.", "If water reached 100°C, it will boil."], "g": "0", "x": "ความจริงทางวิทยาศาสตร์ → If + V1, V1"}, {"a": "She will be angry if you are late again.", "d": ["She will be angry if you will be late again.", "She would be angry if you are late again.", "She is angry if you will be late again."], "g": "1", "x": "ฝั่ง if (if you are late) ห้ามมี will · ฝั่งหลังใช้ will"}, {"a": "If my brother were here, he would fix my bike.", "d": ["If my brother is here, he would fix my bike.", "If my brother were here, he will fix my bike.", "If my brother would be here, he fixes my bike."], "g": "2", "x": "พี่ไม่อยู่ = สมมติ → were ↔ would"}, {"a": "If you don't water the plants, they will die.", "d": ["If you won't water the plants, they will die.", "If you don't water the plants, they would die.", "If you didn't water the plants, they will die."], "g": "1", "x": "ฝั่ง if ห้ามมี will (won't ก็ไม่ได้)"}, {"a": "I would travel around the world if I didn't have to go to school.", "d": ["I will travel around the world if I didn't have to go to school.", "I would travel around the world if I don't have to go to school.", "I would travel around the world if I won't have to go to school."], "g": "2", "x": "ความจริงคือต้องไปโรงเรียน = สมมติ → V2 (didn't have) ↔ would"}, {"a": "If you press this button, the door opens.", "d": ["If you will press this button, the door opens.", "If you press this button, the door would open.", "If you pressed this button, the door will open."], "g": "0", "x": "กดเมื่อไหร่ประตูก็เปิดทุกครั้ง → If + V1, V1"}, {"a": "If I had known, I would have told you.", "d": ["If I know, I would have told you.", "If I had known, I will tell you.", "If I would have known, I had told you."], "g": "3", "x": "สมมติเรื่องในอดีต → had V3 ↔ would have V3"}, {"a": "If we had hurried, we wouldn't have missed the train.", "d": ["If we hurry, we wouldn't have missed the train.", "If we had hurried, we won't miss the train.", "If we would have hurried, we hadn't missed the train."], "g": "3", "x": "had V3 (had hurried) ↔ would have V3 (wouldn't have missed)"}, {"a": "She would have passed if she had studied harder.", "d": ["She will pass if she had studied harder.", "She would have passed if she studies harder.", "She would have passed if she would have studied harder."], "g": "3", "x": "ฝั่ง if ใช้ had V3 · ห้ามมี would ฝั่ง if"}, {"a": "If it hadn't rained, we would have played football.", "d": ["If it doesn't rain, we would have played football.", "If it hadn't rained, we will play football.", "If it wouldn't rain, we had played football."], "g": "3", "x": "had V3 (hadn't rained) ↔ would have V3"}, {"a": "If you had asked me, I would have helped you.", "d": ["If you ask me, I would have helped you.", "If you had asked me, I will help you.", "If you would ask me, I had helped you."], "g": "3", "x": "had V3 (had asked) ↔ would have V3 (would have helped)"}]}, "tns": {"rules": [{"h": "Trick ตอน 1 · Present Simple vs Present Continuous", "b": "<div class=\"steps\">\n<div class=\"step\"><span class=\"n\">1<\/span><div><b>ถามว่า \"เป็นประจำ\" หรือ \"กำลังเกิดตอนนี้\"<\/b>\n<table style=\"margin-top:6px\"><tr><th>เป็นประจำ / ความจริง → Present Simple<\/th><th>กำลังเกิดตอนนี้ / ช่วงนี้ → Present Continuous<\/th><\/tr>\n<tr><td>V1 / V-s (he/she/it เติม s)<\/td><td><b>is / am / are + V-ing<\/b><\/td><\/tr>\n<tr><td>every day · usually · often · always · sometimes · never · on weekends<\/td><td>now · right now · at the moment · Look! · Listen! · today · this week · these days<\/td><\/tr>\n<tr><td>He <b>comes<\/b> from Japan.<\/td><td>Right now he <b>is talking<\/b> to his mum.<\/td><\/tr><\/table>\n<p style=\"margin-top:6px\"><b>ระวัง:<\/b> คำบอกเวลาเป็นแค่<b>คำใบ้<\/b> ไม่ใช่กฎตายตัว ต้องเช็กขั้น 2 เสมอ เช่น <i>Right now, we <b>need<\/b> help.<\/i> (มี right now แต่ need ห้าม -ing)<\/p>\n<p class=\"eg\" style=\"margin-top:6px\">Joseph doesn't like spending his free time in front of a TV, but this evening he is watching the football match. (ข้อสอบจริง ธ.ค. 65)<\/p><\/div><\/div>\n<div class=\"step\"><span class=\"n\">2<\/span><div><b>กริยาความรู้สึก ความคิด การเป็นเจ้าของ ห้ามเติม -ing<\/b> แม้มีคำว่า now<br>ความรู้สึก: like · love · hate · want · need<br>ความคิด: know · think (= เห็นว่า) · believe · understand · remember<br>การเป็นเจ้าของ: have (= มี) · own · belong<br><span class=\"sentfb\">✓ I hate rain. · ✗ <s class=\"xo\">I'm hating<\/s> · ✓ This book belongs to me. · ✗ <s class=\"xo\">is belonging<\/s><\/span><br><span class=\"eg\">ระวัง: I think so. (เห็นว่า ห้าม -ing) · I'm thinking about my trip. (กำลังคิด ได้)<\/span><\/div><\/div>\n<div class=\"step\"><span class=\"n\">3<\/span><div><b>แผนที่นัดไว้แล้ว ใช้ Present Continuous แทนอนาคต<\/b><br>มีคำบอกเวลาในอนาคต + จัดไว้แล้ว: She <b>is working<\/b> this Saturday. · We <b>are going<\/b> to the cinema tonight.<br>แต่ <b>ตารางเวลา<\/b> (เที่ยวบิน รถ คาบเรียน) ใช้ Present Simple: The flight <b>arrives<\/b> at 9 a.m.<\/div><\/div>\n<\/div>\n<p style=\"margin-top:10px;font-size:1.05rem\"><b>ท่องสั้น ๆ:<\/b> ประจำ = Simple · ตอนนี้/ช่วงนี้ = Continuous · ความรู้สึก/ความคิด/ของของฉัน ห้าม -ing<\/p>"}, {"h": "วิธีฝึกให้จำได้จริง", "b": "<ul><li>ตอบผิดแล้ว เกมจะถาม <b>\"ข้อนี้ใช้กฎไหน?\"<\/b> ก่อน แล้วจึงบอกคำตอบ ลองคิดเองก่อนเลือก<\/li>\n<li>จากนั้นจะมี <b>ข้อแฝด<\/b> ที่ใช้กฎเดียวกันแต่ประโยคต่างกัน เพื่อเช็กว่าเข้าใจกฎจริง<\/li>\n<li>ข้อที่ผิดจะกลับมาใน <b>\"ทบทวนวันนี้\"<\/b> พรุ่งนี้ แล้วอีก 3 วัน และ 7 วัน ตอบถูกครบจึงผ่าน<\/li><\/ul>"}], "clues": [{"w": "every day", "c": "S", "th": "ทุกวัน"}, {"w": "usually", "c": "S", "th": "โดยปกติ"}, {"w": "often", "c": "S", "th": "บ่อย ๆ"}, {"w": "always", "c": "S", "th": "เสมอ"}, {"w": "sometimes", "c": "S", "th": "บางครั้ง"}, {"w": "never", "c": "S", "th": "ไม่เคยเลย"}, {"w": "on weekends", "c": "S", "th": "ทุกเสาร์อาทิตย์"}, {"w": "every Sunday", "c": "S", "th": "ทุกวันอาทิตย์"}, {"w": "once a week", "c": "S", "th": "สัปดาห์ละครั้ง"}, {"w": "twice a month", "c": "S", "th": "เดือนละ 2 ครั้ง"}, {"w": "normally", "c": "S", "th": "ตามปกติ"}, {"w": "rarely", "c": "S", "th": "นาน ๆ ครั้ง"}, {"w": "every morning", "c": "S", "th": "ทุกเช้า"}, {"w": "now", "c": "C", "th": "ตอนนี้"}, {"w": "right now", "c": "C", "th": "ตอนนี้เลย"}, {"w": "at the moment", "c": "C", "th": "ขณะนี้"}, {"w": "Look!", "c": "C", "th": " cently<\/td><\/tr><\/table>\n<p class=\"eg\" style=\"margin-top:6px\">ข้อสอบจริง 2020: Ken arrived last Tuesday. He has been here for four days now.<\/p><\/div><\/div>\n<\/div>\n<p style=\"margin-top:10px;font-size:1.05rem\"><b>ท่องสั้น ๆ:<\/b> มีเวลาอดีต = V2 · ไม่มี / ถึงตอนนี้ = have + V3<\/p>\n<p class=\"eg\" style=\"margin-top:4px\">have been to = เคยไป (กลับมาแล้ว) · have gone to = ไปแล้วยังไม่กลับ · ยังทำอยู่ + since/for → have been + V-ing<\/p>"}], "fill": [{"q": "I ____ my homework yesterday.", "a": "finished", "d": ["have finished", "finish", "has finished"], "r": "past", "th": "ฉันทำการบ้านเสร็จเมื่อวาน", "x": "yesterday = เวลาในอดีตที่จบแล้ว → V2"}, {"q": "We ____ to Japan last year.", "a": "went", "d": ["have gone", "have been", "go"], "r": "past", "th": "ปีที่แล้วเราไปญี่ปุ่น", "x": "last year = เวลาจบแล้ว → V2 (ห้ามใช้ have + V3 กับ last…)"}, {"q": "My dad ____ this car five years ago.", "a": "bought", "d": ["has bought", "buys", "have bought"], "r": "past", "th": "พ่อซื้อรถคันนี้เมื่อ 5 ปีก่อน", "x": "ago = เวลาในอดีต → V2"}, {"q": "She ____ in Chiang Mai when she was a child.", "a": "lived", "d": ["has lived", "lives", "have lived"], "r": "past", "th": "ตอนเด็กเธออยู่เชียงใหม่", "x": "when she was a child = ช่วงอดีตที่จบแล้ว → V2"}, {"q": "The Titanic ____ in 1912.", "a": "sank", "d": ["has sunk", "sinks", "have sunk"], "r": "past", "th": "เรือไททานิกจมในปี 1912", "x": "in 1912 = เวลาในอดีต → V2"}, {"q": "When ____ you lose your phone?", "a": "did", "d": ["have", "has", "do"], "r": "past", "th": "เธอทำโทรศัพท์หายเมื่อไหร่", "x": "ถาม When = ถามเวลาในอดีต → did (ห้ามใช้ When have…)"}, {"q": "Ken ____ at the airport last Tuesday.", "a": "arrived", "d": ["has arrived", "arrives", "have arrived"], "r": "past", "th": "เคนมาถึงสนามบินเมื่อวันอังคารที่แล้ว", "x": "last Tuesday = เวลาจบแล้ว → V2 (ข้อสอบจริง 2020)"}, {"q": "I ____ Mali at the mall two days ago.", "a": "saw", "d": ["have seen", "see", "has seen"], "r": "past", "th": "ฉันเห็นมะลิที่ห้างเมื่อ 2 in)<\/div><\/div>\n<\/div>\n<p style=\"margin-top:10px;font-size:1.05rem\"><b>ท่องสั้น ๆ:<\/b> ยาว = was/were + V-ing · สั้นแทรก / ต่อกัน = V2 · เล่าอดีต = อดีตทั้งเรื่อง<\/p>"}], "fill": [{"q": "I ____ TV when the lights went out.", "a": "was watching", "d": ["watched", "am watching", "were watching"], "r": "bg", "th": "ฉันกำลังดูทีวีอยู่ตอนไฟดับ", "x": "ฉากหลังยาว (กำลังดูอยู่) → was + V-ing · ไฟดับ = เหตุการณ์แทรก"}, {"q": "While we ____ dinner, the phone rang.", "a": "were having", "d": ["had", "are having", "was having"], "r": "bg", "th": "ขณะที่เรากำลังกินข้าวเย็น โทรศัพท์ก็ดัง", "x": "while + กำลังทำอยู่ → were + V-ing (ประธาน we)"}, {"q": "At 8 p.m. last night, she ____ her homework.", "a": "was doing", "d": ["did", "is doing", "were doing"], "r": "bg", "th": "เมื่อคืน 2 ทุ่ม เธอกำลังทำการบ้านอยู่", "x": "ณ เวลานั้นพอดี = กำลังทำอยู่ → was + V-ing"}, {"q": "The children ____ in the garden when it started to rain.", "a": "were playing", "d": ["played", "are playing", "was playing"], "r": "bg", "th": "เด็ก ๆ กำลังเล่นในสวนตอนฝนเริ่มตก", "x": "ฉากหลังยาว → were + V-ing · ฝนตก = แทรก"}, {"q": "I saw Ken while I ____ to school.", "a": "was walking", "d": ["walked", "am walking", "were walking"], "r": "bg", "th": "ฉันเห็นเคนขณะกำลังเดินไปโรงเรียน", "x": "while + กำลังทำอยู่ → was + V-ing"}, {"q": "What ____ you doing at 10 o'clock yesterday?", "a": "were", "d": ["did", "are", "was"], "r": "bg", "th": "เมื่อวาน 10 โมงเธอกำลังทำอะไรอยู่", "x": "ณ เวลานั้น + doing → were you doing"}, {"q": "It was a beautiful morning. The sun ____ and the birds were singing.", "a": "was shining", "d": ["shines", "is shining", "were shining"], "r": "bg", "th": "เช้าที่สวยงาม แดดกำลังส่องและนกกำลังร้อง", "x": "บรรยายฉากในอดีต → was + V-ing"}, {"q": "I was cycling to school when a cat suddenly ____ in front of me.", "a": "ran", "d": ["was running", "runs", "run"], "r": "pt", "th": "ฉันกำลังปั่นจักรยานไปโรงเรียน แล้วแมวก็วิ่งตัดหน้า", "x": "เหตุการณ์สั้นแทรก (suddenly) → V2 (แนวข้อสอบจริ  "-", "b": [["ing", "keep + V-ing"], ["base", "should + V1"]]}, {"q": "Thank you for ____ me. I hope ____ you again soon.", "a": "inviting / to see", "d": ["invite / seeing", "inviting / seeing", "to invite / to see"], "r": "prep", "th": "ขอบคุณที่ชวน หวังว่าจะได้เจออีกเร็ว ๆ นี้", "x": "-", "b": [["prep", "for (บุพบท) + V-ing"], ["fwd", "hope + to V1"]]}, {"q": "It's too cold ____ outside, so let's stay in and ____ a movie.", "a": "to go / watch", "d": ["going / watching", "to go / watching", "going / watch"], "r": "nadj", "th": "หนาวเกินจะออกไปข้างนอก อยู่บ้านดูหนังกันเถอะ", "x": "-", "b": [["nadj", "too + คุณศัพท์ + to V1"], ["base", "let's + V1"]]}]}, "g2": {"rules": [{"h": "Trick · Comparison, too / enough", "b": "<div class=\"steps\"><div class=\"step\"><span class=\"n\">1<\/span><div><b>นับว่าเทียบกี่อย่าง<\/b><table style=\"margin-top:6px\"><tr><th>2 อย่าง (มี than)<\/th><th>3 อย่างขึ้นไป (ที่สุด)<\/th><th>เท่ากัน<\/th><\/tr><tr><td>-er / more + than<\/td><td>the -est / the most<\/td><td>as … as (รูปปกติ)<\/td><\/tr><tr><td>bigger than · more popular than<\/td><td>the highest · the most beautiful<\/td><td>isn't <b>as big as<\/b><\/td><\/tr><\/table><span class=\"eg\">สัญญาณ \"ที่สุด\": in the world · of the year · I've ever · one of the …<\/span><\/div><\/div><div class=\"step\"><span class=\"n\">2<\/span><div><b>คำผิดปกติ และห้ามซ้อน<\/b><br>good → better → best · bad → worse → worst · many/much → more → most<br><span class=\"sentfb\">✗ <s class=\"xo\">more better<\/s> · ✗ <s class=\"xo\">most biggest<\/s> (ข้อสอบจริง 2022)<\/span><\/div><\/div><div class=\"step\"><span class=\"n\">3<\/span><div><b>too / enough<\/b><br><b>too<\/b> + adj + to V1 = มากเกินไปจนทำไม่ได้: <b>too cold<\/b> to go out<br>adj + <b>enough<\/b> (+ to V1) = พอ: big <b>enough<\/b> · <b>enough<\/b> + คำนาม: enough money<br><span class=\"eg\">so + adj + that = มากจน… (The film was so boring that I fell asleep.)<\/span><\/div><\/div><\/div><p style=\"margin-top:10px;font-size:1.05rem\"><b> _ than football in some countries.", "a": "more popular", "d": ["popularer", "most popular", "more popularer"], "r": "er", "th": "ในบางประเทศ รักบี้ได้รับความนิยมมากกว่าฟุตบอล", "x": "คำยาว → more + adj + than (ข้อสอบจริง 2022)"}, {"q": "There are ____ shops here than in Bangkok.", "a": "more", "d": ["most", "much", "the most"], "r": "er", "th": "ที่นี่มีร้านค้ามากกว่าในกรุงเทพฯ", "x": "มี than → more (ข้อสอบจริง ธ.ค. 65)"}, {"q": "My brother runs ____ than me.", "a": "faster", "d": ["more fast", "fastest", "fast"], "r": "er", "th": "พี่ชายวิ่งเร็วกว่าฉัน", "x": "fast → faster"}, {"q": "My bag is much ____ than yours.", "a": "lighter", "d": ["light", "lightest", "more light"], "r": "er", "th": "กระเป๋าฉันเบากว่าของเธอมาก", "x": "much + ขั้นกว่า + than"}, {"q": "Ken is ____ tall as his father.", "a": "as", "d": ["than", "more", "the"], "r": "as", "th": "เคนสูงเท่าพ่อ", "x": "เท่ากัน → as … as"}, {"q": "It was ____ cold to go on a picnic.", "a": "too", "d": ["enough", "very much", "so much"], "r": "too", "th": "อากาศหนาวเกินกว่าจะไปปิกนิก", "x": "too + adj + to V1 = เกินไปจนทำไม่ได้ (ข้อสอบจริง ธ.ค. 65)"}, {"q": "The tea is ____ hot to drink.", "a": "too", "d": ["enough", "very much", "more"], "r": "too", "th": "ชาร้อนเกินกว่าจะดื่ม", "x": "too + adj + to V1"}, {"q": "The film was ____ boring that I fell asleep.", "a": "so", "d": ["too", "enough", "very"], "r": "too", "th": "หนังน่าเบื่อมากจนฉันหลับ", "x": "so + adj + that = มากจน… (ต่างจาก too … to)"}, {"q": "Her house isn't big ____ for the party.", "a": "enough", "d": ["too", "so", "very"], "r": "enough", "th": "บ้านเธอไม่ใหญ่พอจะจัดปาร์ตี้", "x": "adj + enough (ข้อสอบจริง ธ.ค. 65)"}, {"q": "He's not old ____ to drive.", "a": "enough", "d": ["too", "very", "much"], "r": "enough", "th": "เขาอายุยังไม่ถึงที่จะขับรถได้", "x": "adj + enough + to V1"}, {"q": "We don't have ____ money to buy it.", "a": "enough", "d": ["too", "very", "so"], "r": "enough", "th": "เรามีเงินไม่พอจะซื้อ", "x": "enough + คำนาม"}], "pair": [{"q": "Our car isn't ____ my friend's car, but it's much ____.", "a": "as expensive as / faster", "d": ["more expensive / fast", "as expensive as / more fast", "expensive than / faster"], "r": "as", "th": "รถเราไม่แพงเท่าของเพื่อน แต่เร็วกว่ามาก", "x": "ข้อสอบจริง 2020", "b": [["as", "isn't … (ไม่มี than) → as … as"], ["er", "much + ขั้นกว่า"]]}, {"q": "I think Hong Kong is ____ city for a holiday. There are ____ shops than in Bangkok.", "a": "the best / more", "d": ["better / most", "the best / most", "better / more"], "r": "est", "th": "ฉันคิดว่าฮ่องกงเป็นเมืองที่ดีที่สุดสำหรับเที่ยว มีร้านค้ามากกว่ากรุงเทพฯ", "x": "ข้อสอบจริง ธ.ค. 65", "b": [["est", "หน้าคำนามเอกพจน์ ไม่มี than → the best"], ["er", "มี than → more"]]}, {"q": "Z is ____ than Y, and it's ____ film of the year.", "a": "more popular / the best", "d": ["popularer / the better", "more popular / the better", "popularer / the best"], "r": "er", "th": "Z ดังกว่า Y และเป็นหนังที่ดีที่สุดของปี", "x": "แนวข้อสอบจริง 2021", "b": [["er", "มี than → more popular"], ["est", "of the year → the best"]]}, {"q": "It was ____ cold to swim, and the water wasn't warm ____.", "a": "too / enough", "d": ["enough / too", "too / too", "enough / enough"], "r": "too", "th": "หนาวเกินจะว่ายน้ำ และน้ำก็ไม่อุ่นพอ", "x": "-", "b": [["too", "too + adj + to V1 = เกินไป"], ["enough", "adj + enough = พอ"]]}, {"q": "This test is ____ than the last one. It's ____ test I've ever taken!", "a": "easier / the easiest", "d": ["more easy / the most easy", "easier / the most easy", "more easy / the easiest"], "r": "er", "th": "ข้อสอบนี้ง่ายกว่าครั้งก่อน เป็นข้อสอบที่ง่ายที่สุดที่เคยทำ", "x": "-", "b": [["er", "than → easier"], ["est", "I've ever → the easiest"]]}, {"q": "My English is getting ____, but it isn't as ____ as yours yet.", "a": "better / good", "d": ["more better / good", "better / better", "more better / better"], "r": "dbl", "th": "ภาษาอังกฤษฉันดีขึ้นเรื่อย ๆ แต่ยังไม่ดีเท่าของเธอ", "x": "-", "b": [["dbl", "better เป็นขั้นกว่าอยู่แ he world<\/div><\/div><\/div><p style=\"margin-top:10px;font-size:1.05rem\"><b>ท่องสั้น ๆ:<\/b> ถึงแม้: although + ประโยค / despite + นาม · เพราะ: because + ประโยค / because of + นาม · in เดือน · on วัน · at เวลา<\/p>"}], "fill": [{"q": "____ it was powerful, it was very slow.", "a": "Although", "d": ["Despite", "Because", "So"], "r": "con", "th": "ถึงแม้มันจะแรง แต่ก็ช้ามาก", "x": "ขัดแย้ง + ประโยค (it was) → Although (ข้อสอบจริง ธ.ค. 65)"}, {"q": "____ the rain, we played football.", "a": "Despite", "d": ["Although", "Because", "So"], "r": "con", "th": "แม้ฝนตก เราก็เล่นฟุตบอล", "x": "ขัดแย้ง + คำนาม (the rain) → Despite"}, {"q": "____ she was ill, she went to school.", "a": "Although", "d": ["Despite", "Because of", "So"], "r": "con", "th": "ถึงแม้จะป่วย เธอก็ไปโรงเรียน", "x": "ขัดแย้ง + ประโยค → Although"}, {"q": "____ being tired, he finished his homework.", "a": "Despite", "d": ["Although", "Because", "So"], "r": "con", "th": "แม้จะเหนื่อย เขาก็ทำการบ้านเสร็จ", "x": "ขัดแย้ง + V-ing → Despite"}, {"q": "We stayed inside ____ it was raining.", "a": "because", "d": ["because of", "despite", "so"], "r": "cau", "th": "เราอยู่ในบ้านเพราะฝนตก", "x": "เหตุผล + ประโยค → because"}, {"q": "The match was cancelled ____ the storm.", "a": "because of", "d": ["because", "although", "so"], "r": "cau", "th": "การแข่งขันถูกยกเลิกเพราะพายุ", "x": "เหตุผล + คำนาม → because of"}, {"q": "I was tired, ____ I went to bed early.", "a": "so", "d": ["because", "although", "despite"], "r": "res", "th": "ฉันเหนื่อย ก็เลยเข้านอนเร็ว", "x": "ผลที่ตามมา → so"}, {"q": "It started to rain, ____ we went home.", "a": "so", "d": ["because", "although", "despite"], "r": "res", "th": "ฝนเริ่มตก เราจึงกลับบ้าน", "x": "ผลที่ตามมา → so"}, {"q": "My birthday is ____ May.", "a": "in", "d": ["on", "at", "for"], "r": "time", "th": "วันเกิดฉันอยู่ในเดือนพฤษภาคม", "x": "เดือน / ปี → in"}, {"q": "The class starts ____ 8 o'clock.", "a": "at", "d": ["in", "on", "for"], "r": "time", "th": "คาบเรียนเริ่ม 8 โมง", , "ผลที่ตามมา → so"]]}, {"q": "We went out ____ the rain ____ we had umbrellas.", "a": "despite / because", "d": ["although / because", "despite / so", "although / so"], "r": "con", "th": "เราออกไปข้างนอกแม้ฝนตก เพราะเรามีร่ม", "x": "-", "b": [["con", "despite + คำนาม (the rain)"], ["cau", "เหตุผล + ประโยค → because"]]}, {"q": "I got ____ the bus at the wrong stop, so I had to walk ____ the street.", "a": "off / along", "d": ["in / through", "off / through", "in / along"], "r": "move", "th": "ฉันลงรถเมล์ผิดป้าย เลยต้องเดินไปตามถนน", "x": "ข้อสอบจริง 2020", "b": [["move", "ลงรถเมล์ → get off"], ["move", "เดินไปตามถนน → along"]]}, {"q": "The party is ____ Friday ____ 7 p.m.", "a": "on / at", "d": ["in / on", "at / in", "on / in"], "r": "time", "th": "ปาร์ตี้จัดวันศุกร์ 1 ทุ่ม", "x": "-", "b": [["time", "วัน → on"], ["time", "เวลา → at"]]}, {"q": "She is good ____ English ____ she practises every day.", "a": "at / because", "d": ["in / because of", "at / because of", "in / because"], "r": "col", "th": "เธอเก่งภาษาอังกฤษเพราะฝึกทุกวัน", "x": "-", "b": [["col", "good at"], ["cau", "เหตุผล + ประโยค → because"]]}, {"q": "The game was cancelled ____ the storm, ____ we were disappointed.", "a": "because of / so", "d": ["because / so", "because of / because", "despite / so"], "r": "cau", "th": "เกมถูกยกเลิกเพราะพายุ เราเลยผิดหวัง", "x": "-", "b": [["cau", "because of + คำนาม"], ["res", "ผล → so"]]}, {"q": "I'm interested ____ history, ____ I don't like remembering dates.", "a": "in / but", "d": ["on / so", "in / so", "on / but"], "r": "col", "th": "ฉันสนใจประวัติศาสตร์ แต่ไม่ชอบจำวันที่", "x": "-", "b": [["col", "interested in"], ["con", "ขัดแย้ง → but"]]}, {"q": "He got ____ the car and drove ____ the tunnel.", "a": "into / through", "d": ["on / along", "into / along", "on / through"], "r": "move", "th": "เขาขึ้นรถแล้วขับทะลุอุโมงค์", "x": "-", "b": [["move", "ขึ้นรถยนต์ → get into"], ["move", "ทะลุอุโมงค์ → through"]]}]}, "g4": {"rules": [{"h": "Trick · Modals", "b": "<div class=\"steps\"><div class=\"step\"><span class=\"n\">1<\/span><div><b>ถามว่า \"จำเป็นแค่ไหน\"<\/b><table style=\"margin-top:6px\"><tr><th>ความหมาย<\/th><th>ใช้<\/th><\/tr><tr><td>ต้อง (กฎ / จำเป็น)<\/td><td><b>must<\/b> / have to<\/td><\/tr><tr><td>ห้าม<\/td><td><b>mustn't<\/b><\/td><\/tr><tr><td>ไม่จำเป็น (แต่ทำได้)<\/td><td><b>don't have to<\/b><\/td><\/tr><tr><td>ควร (แนะนำ)<\/td><td><b>should<\/b><\/td><\/tr><\/table><span class=\"sentfb\">mustn't ≠ don't have to · ห้าม ≠ ไม่จำเป็น<\/span><\/div><\/div><div class=\"step\"><span class=\"n\">2<\/span><div><b>ความสามารถ และความเป็นไปได้<\/b><br>ทำได้ตอนนี้ <b>can<\/b> · ทำได้ในอดีต <b>could<\/b> · ขออนุญาต <b>Can I …?<\/b><br>อาจจะ (ไม่แน่ใจ) <b>may / might<\/b> · มั่นใจว่าใช่ <b>must be<\/b> · มั่นใจว่าไม่ใช่ <b>can't be<\/b><\/div><\/div><div class=\"step\"><span class=\"n\">3<\/span><div><b>หลัง modal ใช้ V1 เสมอ<\/b> ไม่มี to ไม่เติม s / ed / ing<br><span class=\"sentfb\">✓ could <b>do<\/b> · ✗ <s class=\"xo\">could to do<\/s> · ✗ <s class=\"xo\">couldn't got<\/s> (ข้อสอบจริง ธ.ค. 65)<\/span><\/div><\/div><\/div><p style=\"margin-top:10px;font-size:1.05rem\"><b>ท่องสั้น ๆ:<\/b> ต้อง must · ห้าม mustn't · ไม่จำเป็น don't have to · ควร should · อาจ might · หลัง modal = V1<\/p>"}], "fill": [{"q": "You ____ wear a uniform at school. It's a rule.", "a": "must", "d": ["mustn't", "don't have to", "might"], "r": "oblig", "th": "ต้องใส่ชุดนักเรียน เป็นกฎ", "x": "กฎ / จำเป็นต้องทำ → must"}, {"q": "You ____ exercise more. Your doctor says it's important.", "a": "must", "d": ["can", "might", "could"], "r": "oblig", "th": "ต้องออกกำลังกายมากขึ้น หมอบอกว่าสำคัญ", "x": "จำเป็นต้องทำ (คำแนะนำหนักแน่น) → must (ข้อสอบจริง ธ.ค. 65)"}, {"q": "You ____ use your phone during the exam.", "a": "mustn't", "d": ["must", "don't have to", "can"], "r": "proh", "th": "ห้ามใช้โทรศัพท์ระหว่างสอบ", "x": "ห้าม → mustn't"}, {"q": "Students ____ run in the corridor.", "a": "mustn't", "d": ["must", "don't have to", "should"], "r": "proh", "th": "นักเรียนห้ามวิ่งในทางเดิน", "x": "ห้าม → mustn't"}, {"q": "Visitors ____ feed the animals. It's not allowed.", "a": "mustn't", "d": ["don't have to", "must", "should"], "r": "proh", "th": "ผู้เข้าชมห้ามให้อาหารสัตว์", "x": "not allowed = ห้าม → mustn't"}, {"q": "Tomorrow is Saturday, so I ____ get up early.", "a": "don't have to", "d": ["mustn't", "must", "have to"], "r": "nonec", "th": "พรุ่งนี้วันเสาร์ ไม่จำเป็นต้องตื่นเช้า", "x": "ไม่จำเป็น (แต่ทำได้) → don't have to"}, {"q": "The museum is free, so you ____ pay.", "a": "don't have to", "d": ["mustn't", "must", "have to"], "r": "nonec", "th": "พิพิธภัณฑ์เข้าฟรี ไม่ต้องจ่ายเงิน", "x": "ไม่จำเป็น → don't have to (≠ mustn't = ห้าม)"}, {"q": "You look tired. You ____ go to bed early.", "a": "should", "d": ["shouldn't", "mustn't", "don't have to"], "r": "sug", "th": "ดูเหนื่อยนะ ควรเข้านอนเร็ว", "x": "แนะนำ → should"}, {"q": "Teenagers ____ spend less time on screens.", "a": "should", "d": ["should to", "shoulds", "should spending"], "r": "sug", "th": "วัยรุ่นควรใช้เวลาหน้าจอน้อยลง", "x": "แนะนำ → should + V1 (ข้อสอบจริง ธ.ค. 65)"}, {"q": "She ____ swim when she was five.", "a": "could", "d": ["can", "can't", "could to"], "r": "abil", "th": "เธอว่ายน้ำได้ตั้งแต่ 5 ขวบ", "x": "ความสามารถในอดีต → could + V1"}, {"q": "I ____ speak three languages.", "a": "can", "d": ["could to", "am can", "cans"], "r": "abil", "th": "ฉันพูดได้ 3 ภาษา", "x": "ความสามารถตอนนี้ → can + V1"}, {"q": "He ____ come to the party because he was ill.", "a": "couldn't", "d": ["can't", "mustn't", "didn't must"], "r": "abil", "th": "เขามางานไม่ได้เพราะป่วย", "x": "ทำไม่ได้ในอดีต → couldn't"}, {"q": "____ I open the window? It's hot.", "a": "Can", "d": ["Must", "Have", "Do"], "r": "abil", "th": "ขอเปิดหน้าต่างได้ไหม ร้อนจัง", "x": "ขออนุญาต → Can I …?"}, {"q": "I'm sure we could ____ it together.", "a": "do", "d": ["to do", "doing", "did"], "r": "abil", "th": "ฉันมั่นใจว่าเราทำด้วยกันได้", "x": "หลัง modal → V1 ไม่มี to (ข้อสอบจริง ธ.ค. 65)"}, {"q": "Take an umbrella. It ____ rain later.", "a": "might", "d": ["must", "mustn't", "has to"], "r": "poss", "th": "เอาร่มไปด้วย เดี๋ยวฝนอาจตก", "x": "อาจจะ (ไม่แน่ใจ) → might"}, {"q": "If you visit the palace at night, you ____ meet the ghosts!", "a": "might", "d": ["must", "have to", "should"], "r": "poss", "th": "ถ้าไปพระราชวังตอนกลางคืน อาจเจอผีก็ได้", "x": "ความเป็นไปได้ → might (ข้อสอบจริง ธ.ค. 65)"}, {"q": "I'm not sure. She ____ be at the library.", "a": "may", "d": ["must", "has to", "mustn't"], "r": "poss", "th": "ไม่แน่ใจ เธออาจอยู่ห้องสมุด", "x": "ไม่แน่ใจ → may / might"}, {"q": "He has a big house and three cars. He ____ be rich.", "a": "must", "d": ["can't", "mustn't", "doesn't have to"], "r": "ded", "th": "เขามีบ้านหลังใหญ่และรถ 3 คัน ต้องรวยแน่ ๆ", "x": "มั่นใจว่าใช่ (มีหลักฐาน) → must be"}, {"q": "That ____ be Tom. He's in Japan now.", "a": "can't", "d": ["must", "mustn't", "doesn't have to"], "r": "ded", "th": "นั่นไม่ใช่ทอมแน่ ทอมอยู่ญี่ปุ่น", "x": "มั่นใจว่าไม่ใช่ → can't be (ไม่ใช่ mustn't)"}, {"q": "She ____ be at home. Her car is outside.", "a": "must", "d": ["can't", "mustn't", "doesn't have to"], "r": "ded", "th": "เธอต้องอยู่บ้านแน่ ๆ รถจอดอยู่ข้างนอก", "x": "มั่นใจว่าใช่ → must be"}], "pair": [{"q": "You ____ wear a helmet when you ride a bike, but you ____ wear one when you walk.", "a": "must / don't have to", "d": ["mustn't / must", "must / mustn't", "don't have to / must"], "r": "oblig", "th": "ต้องใส่หมวกกันน็อกตอนขี่จักรยาน แต่ตอนเดินไม่ต้องใส่", "x": "-", "b": [["oblig", "กฎ / จำเป็น → must"], ["nonec", "ไม่จำเป็น → don't have to"]]}, {"q": "It ____ rain this afternoon, so you ____ take an umbrella.", "a": "might / should", "d": ["must / mustn't", "might / mustn't", "must / don't have to"], "r": "poss", "th": "บ่ายนี้ฝนอาจตก ควรเอาร่มไปด้วย", "x": "-", "b": [["poss", "อาจจะ → might"], ["sug", "แนะนำ → should"]]}, {"q": "He ____ be at home – his bike isn't there. He ____ be at football practice.", "a": "can't / might", "d": ["must / can't", "mustn't / might", "can't / mustn't"], "r": "ded", "th": "เขาไม่ได้อยู่บ้านแน่ จักรยานไม่อยู่ อาจไปซ้อมฟุตบอล", "x": "-", "b": [["ded", "มั่นใจว่าไม่ใช่ → can't"], ["poss", "อาจจะ → might"]]}, {"q": "When I was six, I ____ swim, but now I ____ swim very well.", "a": "couldn't / can", "d": ["can't / could", "couldn't / could", "can't / can"], "r": "abil", "th": "ตอน 6 ขวบว่ายน้ำไม่เป็น แต่ตอนนี้ว่ายเก่งมาก", "x": "-", "b": [["abil", "ทำไม่ได้ในอดีต → couldn't"], ["abil", "ทำได้ตอนนี้ → can"]]}, {"q": "You ____ talk during the exam, and you ____ hand in your paper on time.", "a": "mustn't / must", "d": ["don't have to / must", "must / mustn't", "mustn't / don't have to"], "r": "proh", "th": "ห้ามคุยระหว่างสอบ และต้องส่งกระดาษคำตอบตรงเวลา", "x": "-", "b": [["proh", "ห้าม → mustn't"], ["oblig", "ต้อง → must"]]}, {"q": "You look ill. You ____ see a doctor. You ____ come to school tomorrow if you feel bad.", "a": "should / don't have to", "d": ["must / mustn't", "should / mustn't", "mustn't / don't have to"], "r": "sug", "th": "ดูไม่สบายนะ ควรไปหาหมอ พรุ่งนี้ถ้ายังไม่ดีก็ไม่ต้องมาโรงเรียน", "x": "-", "b": [["sug", "แนะนำ → should"], ["nonec", "ไม่จำเป็น → don't have to"]]}]}, "g5": {"rules": [{"h": "Trick · Adjective vs Adverb", "b": "<div class=\"steps\"><div class=\"step\"><span class=\"n\">1<\/span><div><b>ดูว่าคำนี้ขยายอะไร<\/b><table style=\"margin-top:6px\"><tr><th>ขยาย…<\/th><th>ใช้<\/th><\/tr><tr><td>คำนาม · หลัง be / look / feel / smell / taste / become<\/td><td><b>adjective<\/b>: a <b>careful<\/b> driver · looks <b>happy<\/b><\/td><\/tr><tr><td>กริยา (ทำอย่างไร)<\/td><td><b>adverb (-ly)<\/b>: drives <b>carefully<\/b> · grow <b>rapidly<\/b><\/td><\/tr><tr><td>คุณศัพท์ / V3<\/td><td><b>adverb<\/b>: <b>really<\/b> good · <b>professionally<\/b> organized<\/td><\/tr><\/table><span class=\"eg\">They grow <s class=\"xo\">rapid<\/s> → rapidly (ข้อสอบจริง ธ.ค. 65)<\/span><\/div><\/div><div class=\"step\"><span class=\"n\">2<\/span><div><b>คำที่ต้องจำ<\/b><br>good (adj) → <b>well<\/b> (adv) · fast / hard / late เป็น adverb ได้เลย (ไม่มี fastly)<br><b>hard<\/b> = หนัก / ขยัน ≠ <b>hardly<\/b> = แทบไม่ · late = สาย ≠ lately = ช่วงนี้<\/div><\/div><div class=\"step\"><span class=\"n\">3<\/span><div><b>ลงท้าย -ly แต่เป็น adjective:<\/b> friendly · lovely · lonely · lively → She is very <b>friendly<\/b>.<\/div><\/div><\/div><p style=\"margin-top:10px;font-size:1.05rem\"><b>ท่องสั้น ๆ:<\/b> ขยายนาม / หลัง be-look = adj · ขยายกริยา / adj = adv (-ly) · good → well · hard ≠ hardly<\/p>"}], "fill": [{"q": "Bear cubs grow ____.", "a": "rapidly", "d": ["rapid", "rapidness", "more rapid"], "r": "adv", "th": "ลูกหมีโตเร็วมาก", "x": "ขยายกริยา grow → adverb (-ly) (ข้อสอบจริง ธ.ค. 65)"}, {"q": "She drives ____.", "a": "carefully", "d": ["careful", "care", "carefulness"], "r": "adv", "th": "เธอขับรถอย่างระมัดระวัง", "x": "ขยายกริยา drives → adverb"}, {"q": "The children played ____ in the garden.", "a": "happily", "d": ["happy", "happiness", "happier"], "r": "adv", "th": "เด็ก ๆ เล่นในสวนอย่างมีความสุข", "x": "ขยายกริยา played → adverb"}, {"q": "He answered the question ____.", "a": "correctly", "d": ["correct", "correction", "corrects"], "r": "adv", "th": "เขาตอบคำถามถูกต้อง", "x": "ขยายกริยา answered → adverb"}, {"q": "She has ____ offered to help.", "a": "kindly", "d": ["kind", "kindness", "kinder"], "r": "adv", "th": "เธอเสนอตัวช่วยอย่างใจดี", "x": "ขยายกริยา offered → adverb (ข้อสอบจริง ธ.ค. 65)"}, {"q": "She is a ____ driver.", "a": "careful", "d": ["carefully", "care", "carefulness"], "r": "adj", "th": "เธอเป็นคนขับรถที่ระมัดระวัง", "x": "ขยายคำนาม driver → adjective"}, {"q": "The soup smells ____.", "a": "delicious", "d": ["deliciously", "deliciousness", "more deliciously"], "r": "adj", "th": "ซุปกลิ่นหอมน่ากิน", "x": "หลัง smell / taste / look / feel → adjective"}, {"q": "You look ____ today.", "a": "happy", "d": ["happily", "happiness", "happier than"], "r": "adj", "th": "วันนี้ดูมีความสุขนะ", "x": "หลัง look → adjective"}, {"q": "They live very ____ lives.", "a": "tough", "d": ["toughly", "toughness", "tougher than"], "r": "adj", "th": "พวกเขามีชีวิตที่ลำบากมาก", "x": "ขยายคำนาม lives → adjective (ข้อสอบจริง ธ.ค. 65)"}, {"q": "The test was ____ easy.", "a": "surprisingly", "d": ["surprising", "surprise", "surprised"], "r": "advadj", "th": "ข้อสอบง่ายอย่างไม่น่าเชื่อ", "x": "ขยายคุณศัพท์ easy → adverb"}, {"q": "The party was ____ organized.", "a": "professionally", "d": ["professional", "profession", "professionals"], "r": "advadj", "th": "ปาร์ตี้จัดอย่างมืออาชีพ", "x": "ขยาย V3 (organized) → adverb (ข้อสอบจริง ธ.ค. 65)"}, {"q": "It's ____ cold today.", "a": "extremely", "d": ["extreme", "extremes", "extremity"], "r": "advadj", "th": "วันนี้หนาวมาก ๆ", "x": "ขยายคุณศัพท์ cold → adverb"}, {"q": "He speaks English ____.", "a": "well", "d": ["good", "goodly", "best"], "r": "spc", "th": "เขาพูดภาษาอังกฤษเก่ง", "x": "adverb ของ good คือ well (ไม่มี goodly)"}, {"q": "Your English is very ____.", "a": "good", "d": ["well", "goodly", "better than"], "r": "spc", "th": "ภาษาอังกฤษของเธอดีมาก", "x": "หลัง is → adjective good"}, {"q": "He works very ____.", "a": "hard", "d": ["hardly", "hards", "hardness"], "r": "spc", "th": "เขาทำงานหนักมาก", "x": "hard = หนัก/ขยัน (เป็นทั้ง adj และ adv)"}, {"q": "I can ____ hear you. Please speak up.", "a": "hardly", "d": ["hard", "hards", "hardness"], "r": "spc", "th": "แทบไม่ได้ยินเลย พูดดัง ๆ หน่อย", "x": "hardly = แทบจะไม่ (คนละความหมายกับ hard)"}, {"q": "The train arrived ____.", "a": "late", "d": ["lately", "lateness", "later than"], "r": "spc", "th": "รถไฟมาถึงช้า", "x": "late = สาย (adverb ด้วย) · lately = ช่วงนี้"}, {"q": "He is a ____ runner.", "a": "fast", "d": ["fastly", "faster than", "fastness"], "r": "spc", "th": "เขาเป็นนักวิ่งที่เร็ว", "x": "fast เป็นทั้ง adj และ adv (ไม่มี fastly)"}, {"q": "Our teacher is very ____. She always smiles.", "a": "friendly", "d": ["friendlily", "friend", "friendship"], "r": "ly", "th": "ครูของเราใจดีเป็นกันเองมาก", "x": "friendly const GPD = {g1:'บุพบท / ต้นประโยค = V-ing · can / to = V1 · อยาก-วางแผน = to V1 · ทำอยู่-ทำเสร็จ = V-ing', g2:'2 อย่าง = -er/more + than · ที่สุด = the -est/most · เท่ากัน = as…as · too = เกิน · enough = พอ', g3:'although + ประโยค / despite + นาม · because + ประโยค / because of + นาม · in เดือน · on วัน · at เวลา', g4:'ต้อง must · ห้าม mustn\'t · ไม่จำเป็น don\'t have to · ควร should · อาจ might · หลัง modal = V1', g5:'ขยายนาม / หลัง be-look = adj · ขยายกริยา / adj = adv (-ly) · good → well', g6:'ถูกทำ = be + V3 · คน who · ของ which · ที่ where · ของใคร whose'};
const GM = {fill:'เติมคำ', pair:'2 ช่องแบบข้อสอบ'};
const PLABEL = p => p.startsWith('g') ? GP[p] : 'Tense ตอน '+p;
if (!GP[st.f.gp]) st.f.gp = 'g1'; if (!GM[st.f.gm]) st.f.gm = 'fill';
const PAT = {all:'ทุกแบบ', AAA:'เหมือนกันทั้ง 3 (cut-cut-cut)', ABB:'V2 = V3 (buy-bought-bought)', ABC:'ไม่ซ้ำกัน (go-went-gone)', ABA:'V1 = V3 (come-came-come)'};
const PATS = {AAA:'AAA · เหมือนกันทั้ง 3 ช่อง', ABB:'ABB · V2 = V3', ABC:'ABC · ไม่ซ้ำกันเลย', ABA:'ABA · V1 = V3'};
if (!SRC[st.f.src]) st.f.src = 'all';
const vpool = () => D.vocab.filter(v => st.f.src==='all' || v.s===st.f.src);
const missAdd = (k,id) => { st.miss[k][id] = (st.miss[k][id]||0)+1; save(); };
const missDel = (k,id) => { delete st.miss[k][id]; save(); };
const missN = k => Object.keys(st.miss[k]).length;
const dayStr = (n=0) => { const d = new Date(); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const revDue = () => Object.keys(st.rev).filter(id => st.rev[id].d <= dayStr());
const REV_GAP = [1,3,7]; /* box 1 → tomorrow, box 2 → +3 days, box 3 → +7 days, then mastered */
const revWrong = id => { st.rev[id] = {b:1, d:dayStr(1)}; save(); };
const revRight = id => { const r = st.rev[id]; if (!r) return; if (r.b>=3) delete st.rev[id]; else { r.b++; r.d = dayStr(REV_GAP[r.b-1]); } save(); };
const atLine = v => v.at ? `<span class="at">พบใน: ${esc(v.at)}</span>` : `<span class="at">${v.s==='phr'?'สำนวนที่ควรรู้':'คำพื้นฐานที่ควรรู้'}</span>`;
const bar = (title, right) => `<div class="bar"><div class="in"><button class="btn" id="back" aria-label="กลับหน้าหลัก">←</button><span class="t">${esc(title)}</span>${right||''}</div></div>`;
const bindBack = () => { app.querySelector('#back').onclick = () => { stopT(); hub(); }; };
const starsHTML = n => `<div class="stars" aria-label="${n} ดาว">${[1,2,3].map(i=>i<=n?'★':'<span class="off">★</span>').join('')}</div>`;
const setBest = (k, v, higher=true) => { const o = st.best[k]; if (o==null || (higher ? v>o : v<o)) { st.best[k]=v; save(); return true; } return false; };
