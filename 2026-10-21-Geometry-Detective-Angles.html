<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>นักสืบรูปเรขาคณิต</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600&family=Mitr:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ec;--card:#fffdf8;--ink:#1f2430;--soft:#5d6472;--rule:#e2ddd2;--good:#2f7d4f;--goods:#e3f2e8;--bad:#b4473a;--bads:#f8e3df;--acc:#d9822b;--fig:#1f2430;--shade:#cfe0f5;--aux:#8a8fa0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181e;--card:#1e222a;--ink:#e9e6df;--soft:#a3a8b3;--rule:#323844;--good:#6cc58f;--goods:#1f3a2a;--bad:#e8857a;--bads:#432622;--acc:#f0a050;--fig:#e9e6df;--shade:#2c4766;--aux:#7c8293}}
:root[data-theme="dark"]{--bg:#15181e;--card:#1e222a;--ink:#e9e6df;--soft:#a3a8b3;--rule:#323844;--good:#6cc58f;--goods:#1f3a2a;--bad:#e8857a;--bads:#432622;--acc:#f0a050;--fig:#e9e6df;--shade:#2c4766;--aux:#7c8293}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Anuphan,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font:500 22px Mitr,sans-serif;margin:4px 0 12px}h1 small{display:block;font:400 13px Anuphan;color:var(--soft)}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px}
.top{display:flex;justify-content:space-between;font-size:14px;color:var(--soft);margin-bottom:8px}
.fig{position:sticky;top:0;z-index:2;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:6px;margin:10px 0;text-align:center}
.fig svg{width:100%;max-height:220px}
svg .ln{stroke:var(--fig);stroke-width:2;fill:none}
svg .lbl{fill:var(--fig);font:14px Anuphan,sans-serif}
svg .ang{stroke:var(--soft);stroke-width:1.5;fill:none}
svg .aux{stroke:var(--aux);stroke-width:1.5;stroke-dasharray:6 5;opacity:0;transition:.3s}
svg .shade{fill:var(--shade);stroke:none}
svg .hl{stroke:var(--acc)!important;stroke-width:3.5!important;opacity:1!important}
svg text.hl{fill:var(--acc);stroke:none!important;font-weight:600}
.ask{font-weight:600;margin:14px 0 8px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:10px;align-items:center;text-align:left;padding:11px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.choice .n{width:24px;height:24px;border-radius:6px;background:var(--bg);display:grid;place-items:center;font-size:13px;flex:none}
.choice.ok{background:var(--goods);border-color:var(--good)}.choice.no{background:var(--bads);border-color:var(--bad)}
.fb{margin-top:8px;padding:10px 12px;border-radius:10px;font-size:14.5px}.fb.ok{background:var(--goods)}.fb.no{background:var(--bads)}
.line{border:1px solid var(--rule);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:var(--bg)}
.line.cur{background:var(--card);border-color:var(--ink)}.line.ok{border-left:4px solid var(--good)}.line.fixed{border-left:4px solid var(--bad)}
.ev{font-size:14px;color:var(--soft)}.line.cur .ev{color:var(--ink);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.opt{font:15px/1.4 ui-monospace,Anuphan,monospace;padding:8px 12px;border-radius:8px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
.opt.no{background:var(--bads)}
.res{font:15px ui-monospace,Anuphan,monospace}.line.ok .res{color:var(--good)}
.why{display:block;font-size:13.5px;margin-top:4px;color:var(--bad)}
.ans{background:var(--goods);border-radius:10px;padding:10px 12px;margin-top:10px}
.alt{margin-top:10px;border:1px solid var(--rule);border-radius:10px;padding:8px 12px}.alt summary{cursor:pointer;font-weight:600}
.btns{display:flex;gap:8px;margin-top:14px}.btns button{flex:1;padding:12px;border-radius:10px;font:600 15px Anuphan;cursor:pointer;border:1px solid var(--rule)}
.got{background:var(--good);color:#fff;border-color:var(--good)!important}.later{background:var(--card);color:var(--ink)}
.note{font-size:12.5px;color:var(--soft)}

svg .mk{stroke:var(--fig);stroke-width:1.6;fill:none}
svg text.al{font-size:13px}
.panel2{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--rule);background:transparent;color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.meter{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:var(--good)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.lnk{border:0;background:none;color:var(--acc);text-decoration:underline;cursor:pointer;font:inherit;font-size:14px;padding:0}
.danger{border:1px solid var(--bad);background:none;color:var(--bad);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;font-size:14px}
.go{border:0;background:var(--ink);color:var(--card);border-radius:10px;padding:10px 18px;font:600 15px Anuphan;cursor:pointer}
.xdef{background:var(--bg);border-left:4px solid var(--good);border-radius:8px;padding:8px 12px;margin:0 0 10px}.xdef.nox{border-left-color:var(--acc)}
.sum{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin-top:14px}
.sum h4{margin:0 0 8px;font:500 16px Mitr,sans-serif}
.sum pre{white-space:pre-wrap;font:14px/1.7 ui-monospace,Anuphan,monospace;background:var(--bg);border-radius:8px;padding:10px 12px;margin:0}
.muted{color:var(--soft)}
.done{padding:18px;text-align:center}
</style>
<main>
<h1>นักสืบรูปเรขาคณิต <small>ข้อสอบเก่าเรื่องมุม 18 ข้อ · โจทย์ให้หาอะไร → ใช้หลักอะไร → คิดทีละบรรทัด</small></h1>
<div class="panel2" id="setup"></div>
<div id="app"></div>
</main>
