<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ข้อสอบเสมือนสามเสน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=Sarabun:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: one centred column, like an exam booklet; answer choices drawn as OMR bubbles */
:root{
  --paper:#F3F5FA; --card:#FFFFFF; --ink:#1B2A4A; --muted:#5A6580; --line:#D6DCE8; --soft:#E9EDF5;
  --accent:#C92A63; --accent-soft:#FBE3EC; --ok:#1C8253; --ok-soft:#DFF3E8; --bad:#C2362C; --bad-soft:#FBE4E1; --warn:#9A6200; --warn-soft:#FFF1D6;
  --display:"Bai Jamjuree","Sarabun",system-ui,sans-serif; --body:"Sarabun","Tahoma",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1522; --card:#182030; --ink:#E5EAF4; --muted:#9BA6BE; --line:#2B364A; --soft:#212B3D;
  --accent:#F0679A; --accent-soft:#3A1F2C; --ok:#45C489; --ok-soft:#163327; --bad:#F2766B; --bad-soft:#3A1E1C; --warn:#F2B84B; --warn-soft:#3A2E14; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1522; --card:#182030; --ink:#E5EAF4; --muted:#9BA6BE; --line:#2B364A; --soft:#212B3D;
  --accent:#F0679A; --accent-soft:#3A1F2C; --ok:#45C489; --ok-soft:#163327; --bad:#F2766B; --bad-soft:#3A1E1C; --warn:#F2B84B; --warn-soft:#3A2E14; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.25}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:.5em 1.1em;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
/* home */
.mast{padding-block:28px 18px;display:grid;gap:6px}
.eyebrow{font-family:var(--display);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.mast h1{font-size:clamp(1.7rem,5vw,2.4rem)}
.modes{display:flex;flex-wrap:wrap;gap:10px;margin-block:14px 6px}
.mode{flex:1 1 220px;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.mode b{font-family:var(--display);font-size:1.05rem}
.mode span{color:var(--muted);font-size:.9rem}
.mode[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.year{font-family:var(--display);font-size:.85rem;color:var(--muted);letter-spacing:.08em;margin-block:22px 8px;font-weight:600}
.sets{display:grid;gap:10px}
.set{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center}
.set h3{font-size:1.08rem}
.set .meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:.88rem;color:var(--muted);align-items:center}
.chip{display:inline-block;font-size:.78rem;padding:1px 9px;border-radius:999px;background:var(--soft);color:var(--muted);font-weight:600}
.chip.claude{background:var(--warn-soft);color:var(--warn)}
.score{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.set .acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
@media (max-width:520px){.set{grid-template-columns:1fr}.set .acts{flex-direction:row;flex-wrap:wrap}}
.foot{margin-top:28px;font-size:.88rem;color:var(--muted)}
/* quiz */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px}
.bar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bar .t{flex:1;min-width:0}
.bar .t b{display:block;font-family:var(--display);font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t small{color:var(--muted);font-variant-numeric:tabular-nums}
.timer{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700;padding:3px 10px;border-radius:8px;background:var(--soft)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.prog{height:4px;background:var(--soft);border-radius:4px;margin-top:8px;overflow:hidden;max-width:760px;margin-inline:auto}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.dir{font-weight:700;font-size:.95rem;margin-block:18px 8px}
.ctx{display:grid;gap:10px;margin-bottom:12px}
.ctx .lab{font-family:var(--display);font-size:.85rem;color:var(--accent);font-weight:600}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:.98rem}
.box p{margin:0 0 .45em}
.box p:last-child{margin-bottom:0}
.box .bt{font-weight:700;text-align:center}
.box .src{font-size:.82rem;color:var(--muted);font-style:italic;text-align:right}
.box .sp{display:grid;grid-template-columns:7.5em 1fr;gap:8px}
@media (max-width:520px){.box .sp{grid-template-columns:1fr;gap:0}}
.ctx img,.stem img{display:block;max-width:100%;height:auto;border-radius:8px;background:#fff;border:1px solid var(--line);margin-block:6px}
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.qn{font-family:var(--display);font-weight:700;color:var(--accent);font-size:1.05rem}
.stem p{margin:.2em 0}
.stem u,.box u,.opt u{text-decoration-thickness:1.5px;text-underline-offset:3px}
sup{color:var(--accent);font-weight:700;font-size:.72em;margin-left:1px}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:9px 12px}
.opt:hover:not(:disabled){border-color:var(--muted)}
.bub{flex:none;width:28px;height:28px;border-radius:50%;border:1.8px solid var(--muted);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.opt .ot{padding-top:1px;min-width:0}
.opt.sel{border-color:var(--ink)}
.opt.sel .bub{background:var(--ink);border-color:var(--ink);color:var(--card)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.note{font-size:.85rem;color:var(--muted);margin-top:6px}
.fb{margin-top:12px;border-radius:10px;padding:12px 14px;display:grid;gap:4px}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--bad-soft)}
.fb b{font-family:var(--display)}
.fb.ok b{color:var(--ok)} .fb.no b{color:var(--bad)}
.warnline{font-size:.85rem;color:var(--warn)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:18px}
.grid button{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:5px 0;font-size:.85rem;font-variant-numeric:tabular-nums;font-weight:600}
.grid button.done{background:var(--soft);border-color:var(--muted)}
.grid button.cur{border-color:var(--accent);color:var(--accent)}
.grid button.r{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid button.w{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.confirm{margin-top:14px;border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.confirm .row{display:flex;gap:10px;flex-wrap:wrap}
/* result */
.res-head{padding-block:26px 10px;display:grid;gap:8px}
.big{font-family:var(--display);font-size:clamp(2.6rem,10vw,3.6rem);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:.4em;color:var(--muted);font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:.92rem}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-block:16px 10px}
.filters .btn[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.rv{display:grid;gap:12px}
.rv .q{padding:14px}
.rvh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:.8rem;font-weight:700;padding:1px 9px;border-radius:999px}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.no{background:var(--bad-soft);color:var(--bad)} .tag.skip{background:var(--soft);color:var(--muted)}
details.ctxd{margin-top:8px} details.ctxd summary{cursor:pointer;color:var(--muted);font-size:.88rem}
.notice{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:12px 16px;font-size:.95rem;max-width:560px}
.notice .nt{font-family:var(--display);font-weight:700;letter-spacing:.04em;margin-bottom:6px}
.notice .nt.big{font-size:1.8rem;color:var(--accent);text-align:center}
.notice p{margin:.3em 0}.notice .nf{font-size:.85rem;color:var(--muted)}
.notice.poster{text-align:center;border-style:dashed}
.tt{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;margin-block:4px}
.tt th,.tt td{border:1px solid var(--line);padding:4px 8px;text-align:left}.tt th{background:var(--soft)}
.tbl{overflow-x:auto}
.rules{margin:.2em 0;padding-left:1.2em}
.chart{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-width:560px}
.chart figcaption{font-weight:700;font-size:.92rem;margin-bottom:4px}
.chart svg{width:100%;height:auto;display:block}
.chart .ax line{stroke:var(--ink);stroke-width:1.2}.chart .gl line{stroke:var(--line);stroke-width:1}
.chart .br rect{fill:var(--accent)}
.chart text{fill:var(--ink);font-family:var(--body);font-size:11px}
.chart .yl text{text-anchor:end;fill:var(--muted)}.chart .hl text{text-anchor:end}
.chart .vl text{text-anchor:middle;font-weight:700}.chart .vl.l text{text-anchor:start}
.chart .xl text{text-anchor:middle}
.chart .nf{font-size:.82rem;color:var(--muted);margin:.2em 0 0}
.topic{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--muted);font-weight:600;margin-left:6px;vertical-align:middle}
.tops{display:grid;gap:6px;margin-block:8px 4px}
.trow{display:grid;grid-template-columns:minmax(0,11em) 1fr 3.4em;gap:10px;align-items:center;font-size:.9rem}
.trow .tb{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.trow .tb i{display:block;height:100%;background:var(--ok)}
.trow.weak .tb i{background:var(--bad)}
.trow .tv{font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
@media (max-width:520px){.trow{grid-template-columns:minmax(0,8.5em) 1fr 3em}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script id="data" type="application/json">[{"groups": [{"l": "For items 11 – 13", "h": "<div class=\"box\"><p class=\"bt\">A Day Without Plastic<\/p><p>Last month, our class ____(11)____ to spend one whole day without using any plastic. It was much harder than we expected! ____(12)____ we brought our lunch in glass boxes, many of us forgot about our plastic water bottles. Our teacher says that if every student ____(13)____ just one plastic bag a day, our school can save more than 300,000 bags a year.<\/p><\/div>"}, {"l": "For items 14 – 16", "h": "<div class=\"box\"><p>Chiang Mai is famous ____(14)____ its temples, night markets and cool weather. Every year, thousands of tourists ____(15)____ the city during the Yi Peng festival, when people release lanterns into the night sky. However, local officials now ask visitors to buy lanterns only from approved shops, ____(16)____ some cheap lanterns can cause fires.<\/p><\/div>"}, {"l": "For items 17 – 19", "h": "<div class=\"box\"><p>Have you ever heard of \"forest bathing\"? It doesn't mean ____(17)____ a shower in the woods! The idea comes from Japan, and it simply means spending quiet time among trees. Scientists ____(18)____ that walking slowly in a forest for just twenty minutes can lower stress. So next time you feel tired of screens, why not ____(19)____ a walk in the park?<\/p><\/div>"}, {"l": "For items 31 – 33", "h": "<div class=\"box\"><p class=\"sp\"><b>Waiter:<\/b><span>Good evening. ____(31)____<\/span><\/p><p class=\"sp\"><b>Customer:<\/b><span>Yes, a table for two, please. Under the name \"Somchai\".<\/span><\/p><p class=\"sp\"><b>Waiter:<\/b><span>Ah, yes. This way, please. ____(32)____<\/span><\/p><p class=\"sp\"><b>Customer:<\/b><span>Not yet. Could we have a few more minutes?<\/span><\/p><p class=\"sp\"><b>Waiter:<\/b><span>Of course. Can I get you something to drink while you're waiting?<\/span><\/p><p class=\"sp\"><b>Customer:<\/b><span>____(33)____ Just two glasses of water, please.<\/span><\/p><\/div>"}, {"l": "For items 34 – 36", "h": "<div class=\"box\"><p class=\"bt\">The Boy Who Harnessed the Wind<\/p><p>William Kamkwamba was born in 2001 in Malawi, a small country in Africa. When he was fourteen, a terrible drought hit his village. His family could not afford to pay his school fees, so he had to leave school. But William did not stop learning. He went to the village library every day and read science books in English, a language he could barely understand.<\/p><p>In one book, he saw a picture of a windmill. William decided to build one himself. People in the village laughed at him and called him \"crazy\". Using old bicycle parts, plastic pipes and wood, he finally built a windmill that produced electricity for his home. Later, he built another one to pump water for the fields.<\/p><p>His story spread around the world, and he was invited to study in the United States. Today he helps young people in Africa use science to solve local problems.<\/p><\/div>"}, {"l": "For items 37 – 39", "h": "<div class=\"box\"><p>Many people believe that goldfish have a memory of only three seconds. However, this is a myth. Scientists have shown that goldfish can remember things for months. In one experiment, researchers played a sound every time they fed the fish. After a while, the fish swam to the feeding area as soon as they heard the sound, even when no food was given. Some goldfish can even be trained to push small levers or swim through tiny hoops. So the next time someone says you have \"the memory of a goldfish\", you can take it as a compliment!<\/p><\/div>"}, {"l": "For items 40 – 41", "h": "<div class=\"box\"><p class=\"bt\">Running Out of Sand?<\/p><p>Sand looks like something we will never run out of. Yet sand is the most used natural resource on Earth after water. It is used to make concrete, glass and even computer chips. Desert sand, however, is too smooth and round to be used in building, so builders take sand from rivers and beaches instead. In some places, so much sand has been removed that rivers have changed their shape and small islands have disappeared.<\/p><\/div>"}, {"l": "For item 42", "h": "<div class=\"notice\"><div class=\"nt\">SAMSEN LIBRARY · EXAM WEEK HOURS<\/div><table class=\"tt\"><tr><th>Day<\/th><th>Opening hours<\/th><\/tr><tr><td>Monday – Thursday<\/td><td>7.00 a.m. – 7.00 p.m.<\/td><\/tr><tr><td>Friday<\/td><td>7.00 a.m. – 4.00 p.m.<\/td><\/tr><tr><td>Saturday<\/td><td>9.00 a.m. – 12.00 p.m.<\/td><\/tr><tr><td>Sunday<\/td><td>Closed<\/td><\/tr><\/table><p class=\"nf\">Students may borrow up to 3 books. Laptops can be used in Room B only.<br>Please keep your voice down. Food and drinks are not allowed.<\/p><\/div>"}, {"l": "For item 43", "h": "<figure class=\"chart\"><figcaption>How Grade 6 students get to school (120 students)<\/figcaption><svg viewBox=\"0 0 360 200\" role=\"img\" aria-label=\"bar chart\"><g class=\"ax\"><line x1=\"70\" y1=\"20\" x2=\"70\" y2=\"170\"/><line x1=\"70\" y1=\"170\" x2=\"350\" y2=\"170\"/><\/g><g class=\"gl\"><line x1=\"70\" y1=\"132.5\" x2=\"350\" y2=\"132.5\"/><line x1=\"70\" y1=\"95\" x2=\"350\" y2=\"95\"/><line x1=\"70\" y1=\"57.5\" x2=\"350\" y2=\"57.5\"/><line x1=\"70\" y1=\"20\" x2=\"350\" y2=\"20\"/><\/g><g class=\"yl\"><text x=\"62\" y=\"174\">0<\/text><text x=\"62\" y=\"136\">10<\/text><text x=\"62\" y=\"99\">20<\/text><text x=\"62\" y=\"61\">30<\/text><text x=\"62\" y=\"24\">40<\/text><\/g><g class=\"br\"><rect x=\"85\" y=\"57.5\" width=\"44\" height=\"112.5\"/><rect x=\"153\" y=\"38.75\" width=\"44\" height=\"131.25\"/><rect x=\"221\" y=\"132.5\" width=\"44\" height=\"37.5\"/><rect x=\"289\" y=\"95\" width=\"44\" height=\"75\"/><\/g><g class=\"vl\"><text x=\"107\" y=\"52\">30<\/text><text x=\"175\" y=\"33\">35<\/text><text x=\"243\" y=\"127\">10<\/text><text x=\"311\" y=\"89\">20<\/text><\/g><g class=\"xl\"><text x=\"107\" y=\"188\">School bus<\/text><text x=\"175\" y=\"188\">Parents' car<\/text><text x=\"243\" y=\"188\">Bicycle<\/text><text x=\"311\" y=\"188\">BTS/MRT<\/text><\/g><\/svg><p class=\"nf\">*The rest of the students walk to school.<\/p><\/figure>"}, {"l": "For item 44", "h": "<div class=\"notice poster\"><div class=\"nt big\">LOST!<\/div><p><b>Grey kitten, 4 months old<\/b><br>Wearing a red collar with a small bell.<br>Last seen near Soi 5 on Saturday evening.<br>She is very shy and may hide under cars.<\/p><p class=\"nf\">If you find her, please DO NOT chase her.<br>Call Fah: 08x-xxx-1234 · Reward: 1,000 baht<\/p><\/div>"}, {"l": "For item 45", "h": "<div class=\"notice\"><div class=\"nt\">SPORTS DAY – IMPORTANT CHANGE<\/div><p>Because of the heavy rain forecast, Sports Day will be moved from<br><b>Friday 14th<\/b> to <b>Friday 21st<\/b>.<br>The cheerleading competition will still take place on the 14th in the indoor hall.<br>Students must wear their house T-shirts on both days.<\/p><\/div>"}], "qs": [{"n": "1", "alt": "", "d": "Directions: Choose the best alternative to complete each blank.", "g": -1, "s": "<p>Mia: Where's Tom? I need to talk to him.<\/p><p>Ken: He ________ in the library right now. He ________ there since lunchtime because of the science fair.<\/p>", "o": ["studies / is", "is studying / was", "is studying / has been", "studied / has been"], "note": "", "t": "Tenses", "a": 3, "x": "\"right now\" = กำลังทำอยู่ → is studying; \"since lunchtime\" (ตั้งแต่…จนถึงตอนนี้) → Present Perfect: has been"}, {"n": "2", "alt": "", "d": "", "g": -1, "s": "<p>By the time the ambulance arrived, the old man ________ for nearly an hour.<\/p>", "o": ["has lain", "was lain", "lay", "had been lying"], "note": "", "t": "Tenses", "a": 4, "x": "เหตุการณ์ต่อเนื่องมาก่อนอีกเหตุการณ์ในอดีต (By the time … arrived) → Past Perfect Continuous: had been lying"}, {"n": "3", "alt": "", "d": "", "g": -1, "s": "<p>Nina: Why didn't you come to the party last night?<\/p><p>Jack: Nobody told me about it. If someone ________ me, I ________.<\/p>", "o": ["had told / would have come", "tells / would have come", "had told / will come", "told / would come"], "note": "", "t": "Conditionals & wish", "a": 1, "x": "สมมติย้อนอดีตที่ไม่ได้เกิดจริง → If-clause แบบที่ 3: If + had V3, would have V3"}, {"n": "4", "alt": "", "d": "", "g": -1, "s": "<p>You ________ have bought so much food for the picnic. Only five people came, so most of it was wasted.<\/p>", "o": ["mustn't", "needn't", "couldn't", "shouldn't to"], "note": "", "t": "Modals", "a": 2, "x": "needn't have + V3 = ไม่จำเป็นต้องทำ (แต่ทำไปแล้ว) ตรงกับที่ซื้ออาหารเกินจนเหลือทิ้ง (ข้อ 4 ผิดไวยากรณ์ ไม่มี to หลัง modal)"}, {"n": "5", "alt": "", "d": "", "g": -1, "s": "<p>The new sports hall ________ at the moment, so PE lessons ________ in the school field until next month.<\/p>", "o": ["is built / are holding", "is being built / will be held", "is building / are held", "has built / will hold"], "note": "", "t": "Passive & causative", "a": 2, "x": "อาคาร \"ถูกสร้าง\" อยู่ตอนนี้ → is being built; คาบพละ \"จะถูกจัด\" ที่สนามจนถึงเดือนหน้า → will be held"}, {"n": "6", "alt": "", "d": "", "g": -1, "s": "<p>This year's science project is ________ than last year's. In fact, it is ________ project our class has ever done.<\/p>", "o": ["very more difficult / the most challenging", "much difficult / most challenging", "much more difficult / the most challenging", "more difficult / more challenging"], "note": "", "t": "Adjectives, adverbs & comparison", "a": 3, "x": "ใช้ much ขยายขั้นกว่า (much more difficult) และ \"…has ever done\" ใช้ขั้นสูงสุด the most challenging"}, {"n": "7", "alt": "", "d": "", "g": -1, "s": "<p>I'll never forget ________ the Grand Palace for the first time. Please remember ________ your camera when we go there again.<\/p>", "o": ["visiting / to bring", "to visit / to bring", "to visit / bringing", "visiting / bringing"], "note": "", "t": "Gerund & infinitive", "a": 1, "x": "forget + V-ing = ลืมไม่ได้ว่าเคยทำ (เรื่องในอดีต); remember + to V = อย่าลืมทำ (สิ่งที่ต้องทำในอนาคต)"}, {"n": "8", "alt": "", "d": "", "g": -1, "s": "<p>The documentary about ocean pollution was really ________. Everyone in the class felt ________ after watching it.<\/p>", "o": ["shocked / depressing", "shocking / depressing", "shocked / depressed", "shocking / depressed"], "note": "", "t": "Adjectives, adverbs & comparison", "a": 4, "x": "สิ่งที่ทำให้รู้สึก ใช้ -ing (สารคดีน่าตกใจ = shocking); ความรู้สึกของคน ใช้ -ed (depressed)"}, {"n": "9", "alt": "", "d": "", "g": -1, "s": "<p>The girl ________ bicycle was stolen yesterday is the one ________ won the speech contest.<\/p>", "o": ["who / whose", "which / that", "whose / who", "whose / which"], "note": "", "t": "Sentence structure", "a": 3, "x": "จักรยาน \"ของ\" เด็กหญิง → whose; ขยายคนที่ทำหน้าที่ประธาน (won) → who"}, {"n": "10", "alt": "", "d": "", "g": -1, "s": "<p>My grandmother gave me ________ bag for my birthday.<\/p>", "o": ["a small lovely leather brown", "a brown lovely small leather", "a leather small lovely brown", "a lovely small brown leather"], "note": "", "t": "Adjectives, adverbs & comparison", "a": 4, "x": "ลำดับคุณศัพท์: ความคิดเห็น (lovely) → ขนาด (small) → สี (brown) → วัสดุ (leather)"}, {"n": "11", "alt": "", "d": "", "g": 0, "s": "", "o": ["was deciding", "decided", "has decided", "decides"], "note": "", "t": "Tenses", "a": 2, "x": "\"Last month\" ระบุเวลาในอดีตชัดเจน → Past Simple: decided"}, {"n": "12", "alt": "", "d": "", "g": 0, "s": "", "o": ["Although", "Because", "So that", "Unless"], "note": "", "t": "Linking words & prepositions", "a": 1, "x": "ประโยคขัดแย้งกัน (เอากล่องแก้วมา แต่ลืมขวดพลาสติก) → Although"}, {"n": "13", "alt": "", "d": "", "g": 0, "s": "", "o": ["saves", "saved", "has saved", "will save"], "note": "", "t": "Conditionals & wish", "a": 1, "x": "If-clause แบบที่ 1 (ประโยคหลักใช้ can save) → if + Present Simple และประธานเอกพจน์ (every student) → saves"}, {"n": "14", "alt": "", "d": "", "g": 1, "s": "", "o": ["with", "by", "for", "of"], "note": "", "t": "Linking words & prepositions", "a": 3, "x": "สำนวน be famous for = มีชื่อเสียงเรื่อง…"}, {"n": "15", "alt": "", "d": "", "g": 1, "s": "", "o": ["are visiting", "visited", "visits", "visit"], "note": "", "t": "Tenses", "a": 4, "x": "\"Every year\" = เกิดเป็นประจำ ประธานพหูพจน์ (thousands of tourists) → visit"}, {"n": "16", "alt": "", "d": "", "g": 1, "s": "", "o": ["however", "because", "although", "so"], "note": "", "t": "Linking words & prepositions", "a": 2, "x": "ให้เหตุผลว่าทำไมต้องซื้อจากร้านที่อนุญาต (โคมถูก ๆ อาจทำให้ไฟไหม้) → because"}, {"n": "17", "alt": "", "d": "", "g": 2, "s": "", "o": ["to take", "taking", "taken", "take"], "note": "", "t": "Gerund & infinitive", "a": 2, "x": "หลัง mean ที่แปลว่า \"หมายถึง\" ใช้ V-ing → doesn't mean taking"}, {"n": "18", "alt": "", "d": "", "g": 2, "s": "", "o": ["are finding", "had found", "were found", "have found"], "note": "", "t": "Tenses", "a": 4, "x": "ผลการค้นพบที่ส่งผลถึงปัจจุบัน → Present Perfect: have found (ข้อ 3 เป็น passive ไม่มีกรรมตามหลังที่ถูกต้อง)"}, {"n": "19", "alt": "", "d": "", "g": 2, "s": "", "o": ["to go", "going", "go for", "went for"], "note": "", "t": "Gerund & infinitive", "a": 3, "x": "why not + V1 (ไม่มี to) → why not go for a walk?"}, {"n": "20", "alt": "", "d": "Directions: Choose the best alternative to complete each sentence.", "g": -1, "s": "<p>Our school's football team was ________ from the tournament after losing three matches in a row.<\/p>", "o": ["eliminated", "examined", "elected", "excluded"], "note": "", "t": "Vocabulary", "a": 1, "x": "eliminated = ถูกคัดออก (จากการแข่งขัน) ส่วน elected = ได้รับเลือกตั้ง"}, {"n": "21", "alt": "", "d": "", "g": -1, "s": "<p>Ploy is very ________. She always thinks about other people's feelings before she speaks.<\/p>", "o": ["considerable", "careless", "confident", "considerate"], "note": "", "t": "Vocabulary", "a": 4, "x": "considerate = เกรงใจ ใส่ใจความรู้สึกผู้อื่น (considerable = มาก/จำนวนไม่น้อย ระวังสับสน)"}, {"n": "22", "alt": "", "d": "", "g": -1, "s": "<p>The heavy rain caused serious ________ in the north. Many villages were under water for days.<\/p>", "o": ["pollution", "flooding", "earthquake", "drought"], "note": "", "t": "Vocabulary", "a": 2, "x": "หมู่บ้านจมน้ำหลายวัน → น้ำท่วม (flooding) (drought = ภัยแล้ง)"}, {"n": "23", "alt": "", "d": "", "g": -1, "s": "<p>The teacher had to ________ the school trip because of the storm. It will now take place next Friday.<\/p>", "o": ["put off", "take off", "put on", "call up"], "note": "", "t": "Idioms & phrasal verbs", "a": 1, "x": "put off = เลื่อนออกไป ตรงกับ \"will now take place next Friday\""}, {"n": "24", "alt": "", "d": "", "g": -1, "s": "<p>While I was cleaning my room, I ________ an old photo of my parents' wedding.<\/p>", "o": ["looked after", "ran out of", "came across", "gave up"], "note": "", "t": "Idioms & phrasal verbs", "a": 3, "x": "come across = เจอโดยบังเอิญ"}, {"n": "25", "alt": "", "d": "", "g": -1, "s": "<p>Mark: Do you often eat at that expensive restaurant?<\/p><p>Joe: No, only ________. Maybe once or twice a year.<\/p>", "o": ["on cloud nine", "once in a blue moon", "in hot water", "a piece of cake"], "note": "", "t": "Idioms & phrasal verbs", "a": 2, "x": "once in a blue moon = นาน ๆ ครั้ง (on cloud nine = ดีใจสุด ๆ, in hot water = มีปัญหา)"}, {"n": "26", "alt": "", "d": "", "g": -1, "s": "<p>Which word has the closest meaning to the underlined word?<\/p><p>The museum is <u>enormous<\/u>. You need a whole day to see everything.<\/p>", "o": ["modern", "ancient", "huge", "crowded"], "note": "", "t": "Vocabulary", "a": 3, "x": "enormous = ใหญ่มาก (huge)"}, {"n": "27", "alt": "", "d": "Directions: Choose the best response for each situation.", "g": -1, "s": "<p>You accidentally step on someone's foot on a crowded bus. You say, \"________\"<\/p>", "o": ["Watch where you're going!", "Never mind. It happens.", "Excuse me, can I get past?", "Oh, I'm so sorry! Are you OK?"], "note": "", "t": "Conversation", "a": 4, "x": "เราเป็นฝ่ายผิด ต้องขอโทษและถามว่าเขาเป็นอะไรไหม"}, {"n": "28", "alt": "", "d": "", "g": -1, "s": "<p>A: Would you mind turning down the music? I'm trying to study.<\/p><p>B: ________<\/p>", "o": ["Not at all. Sorry about that.", "No, I wouldn't do it.", "Yes, I'd love to.", "Yes, of course. I'll turn it down."], "note": "", "t": "Conversation", "a": 1, "x": "Would you mind…? ถ้ายินดีทำตามต้องตอบปฏิเสธ (Not at all = ไม่รังเกียจเลย) ข้อ 4 ตอบ Yes แปลว่า \"รังเกียจ\" ขัดกับที่บอกว่าจะเบาเสียง"}, {"n": "29", "alt": "", "d": "", "g": -1, "s": "<p>A: I've got a terrible toothache.<\/p><p>B: ________<\/p>", "o": ["You'd better see a dentist.", "You'd better to see a dentist.", "You'd rather see a doctor.", "Congratulations!"], "note": "", "t": "Conversation", "a": 1, "x": "ให้คำแนะนำ had better + V1 (ไม่มี to) และปวดฟันต้องไปหาหมอฟัน"}, {"n": "30", "alt": "", "d": "", "g": -1, "s": "<p>Your friend has just won first prize in a singing contest. You say, \"________\"<\/p>", "o": ["Take it easy.", "What a pity!", "Better luck next time!", "Well done! You deserve it."], "note": "", "t": "Conversation", "a": 4, "x": "แสดงความยินดี → Well done! You deserve it. (สมควรได้รับแล้ว)"}, {"n": "31", "alt": "", "d": "", "g": 3, "s": "", "o": ["Are you ready to pay?", "How much is the bill?", "Have you booked a table?", "What would you like to eat?"], "note": "", "t": "Conversation", "a": 3, "x": "ลูกค้าตอบเรื่องโต๊ะสำหรับ 2 คนพร้อมชื่อที่จองไว้ → ถามว่าจองโต๊ะไว้หรือยัง"}, {"n": "32", "alt": "", "d": "", "g": 3, "s": "", "o": ["How was your trip?", "Are you ready to order?", "Did you enjoy your meal?", "Would you like the bill?"], "note": "", "t": "Conversation", "a": 2, "x": "ลูกค้าตอบว่า \"ยังเลย ขอเวลาอีกสักครู่\" → ถามว่าพร้อมสั่งอาหารหรือยัง"}, {"n": "33", "alt": "", "d": "", "g": 3, "s": "", "o": ["No, thank you. We're full.", "It's on me.", "Here you are.", "Yes, please."], "note": "", "t": "Conversation", "a": 4, "x": "รับข้อเสนอ แล้วบอกว่าขอน้ำเปล่า 2 แก้ว → Yes, please."}, {"n": "34", "alt": "", "d": "Directions: Read the passages and choose the best answer.", "g": 4, "s": "<p>Why did William have to leave school?<\/p>", "o": ["He couldn't understand English.", "The school was destroyed by the drought.", "His family didn't have enough money.", "He wanted to build a windmill."], "note": "", "t": "Reading", "a": 3, "x": "\"His family could not afford to pay his school fees\" = ไม่มีเงินจ่ายค่าเรียน"}, {"n": "35", "alt": "", "d": "", "g": 4, "s": "<p>The word <b>\"barely\"<\/b> in paragraph 1 is closest in meaning to ________.<\/p>", "o": ["hardly", "quickly", "easily", "clearly"], "note": "", "t": "Reading", "a": 1, "x": "barely = แทบจะไม่ (เข้าใจภาษาอังกฤษแทบไม่ได้) = hardly"}, {"n": "36", "alt": "", "d": "", "g": 4, "s": "<p>Which of the following is <b>NOT<\/b> true?<\/p>", "o": ["He later studied in the United States.", "The villagers supported his idea from the beginning.", "His first windmill made electricity for his house.", "William learned from books in the library."], "note": "", "t": "Reading", "a": 2, "x": "ชาวบ้านหัวเราะเยาะและเรียกเขาว่า \"บ้า\" ไม่ได้สนับสนุนตั้งแต่แรก"}, {"n": "37", "alt": "", "d": "", "g": 5, "s": "<p>What is the main purpose of the passage?<\/p>", "o": ["To explain how to feed goldfish", "To show that a common belief is wrong", "To compare goldfish with other fish", "To teach readers how to train pets"], "note": "", "t": "Reading", "a": 2, "x": "ย่อหน้าบอกว่าความเชื่อเรื่องปลาทองจำได้ 3 วินาทีเป็น \"myth\" (เรื่องที่ไม่จริง) แล้วยกหลักฐานมาหักล้าง"}, {"n": "38", "alt": "", "d": "", "g": 5, "s": "<p>In the experiment, why did the fish swim to the feeding area?<\/p>", "o": ["They connected the sound with food.", "They were hungry all the time.", "They were trained to push levers.", "They could see the food."], "note": "", "t": "Reading", "a": 1, "x": "ปลาจำได้ว่าเสียงมาพร้อมอาหาร จึงว่ายไปทันทีที่ได้ยินเสียง แม้ไม่มีอาหาร"}, {"n": "39", "alt": "", "d": "", "g": 5, "s": "<p>What does the writer mean in the last sentence?<\/p>", "o": ["Goldfish like people who praise them.", "People with poor memories should keep goldfish.", "Goldfish can understand compliments.", "Having a goldfish's memory is actually good."], "note": "", "t": "Reading", "a": 4, "x": "ความจำแบบปลาทองจริง ๆ แล้วดี จึงถือเป็น \"คำชม\" ได้"}, {"n": "40", "alt": "", "d": "", "g": 6, "s": "<p>Why isn't desert sand used for building?<\/p>", "o": ["It is too far away from cities.", "It contains too much water.", "Its grains are too smooth and round.", "It is too expensive to collect."], "note": "", "t": "Reading", "a": 3, "x": "\"Desert sand is too smooth and round to be used in building\""}, {"n": "41", "alt": "", "d": "", "g": 6, "s": "<p>What can be inferred from the passage?<\/p>", "o": ["Taking too much sand can damage the environment.", "Beaches are created by builders.", "There is plenty of sand for everyone forever.", "Computer chips are made only from desert sand."], "note": "", "t": "Reading", "a": 1, "x": "ขุดทรายมากจนแม่น้ำเปลี่ยนรูปและเกาะเล็ก ๆ หายไป → ทำลายสิ่งแวดล้อม"}, {"n": "42", "alt": "", "d": "", "g": 7, "s": "<p>According to the notice, which of the following is <b>CORRECT<\/b>?<\/p>", "o": ["Each student can borrow four books.", "Students can eat snacks in Room B.", "Students can study in the library on Sunday morning.", "The library closes earlier on Friday than on Monday."], "note": "", "t": "Notices & charts", "a": 4, "x": "วันศุกร์ปิด 16.00 น. ส่วนวันจันทร์ปิด 19.00 น. (วันอาทิตย์ปิด, ห้ามนำอาหารเข้า, ยืมได้ 3 เล่ม)"}, {"n": "43", "alt": "", "d": "", "g": 8, "s": "<p>According to the chart, which statement is <b>INCORRECT<\/b>?<\/p>", "o": ["Twenty-five students walk to school.", "Fewer than ten students ride bicycles.", "Twice as many students use the BTS/MRT as ride bicycles.", "More students come by parents' car than by school bus."], "note": "", "t": "Notices & charts", "a": 2, "x": "ขี่จักรยาน 10 คนพอดี ไม่ใช่ \"น้อยกว่า 10\" (เดิน = 120 − 30 − 35 − 10 − 20 = 25 คน)"}, {"n": "44", "alt": "", "d": "", "g": 9, "s": "<p>What should you do if you see the kitten?<\/p>", "o": ["Look for her under the cars on Soi 5 only.", "Take the kitten to the police station.", "Call Fah and tell her where the kitten is.", "Run after her quickly so she can't escape."], "note": "", "t": "Notices & charts", "a": 3, "x": "ประกาศให้โทรหา Fah และ \"DO NOT chase her\" (ห้ามไล่จับ)"}, {"n": "45", "alt": "", "d": "", "g": 10, "s": "<p>Which statement is <b>TRUE<\/b> according to the notice?<\/p>", "o": ["Sports Day will take place outdoors on the 14th.", "All activities are cancelled because of the rain.", "The cheerleading competition will be held on the 21st.", "Students need their house T-shirts on the 14th and the 21st."], "note": "", "t": "Notices & charts", "a": 4, "x": "\"Students must wear their house T-shirts on both days\" (วันที่ 14 แข่งเชียร์ในหอประชุม, วันที่ 21 กีฬาสี)"}, {"n": "46", "alt": "", "d": "Directions: Choose the underlined part which contains an error.", "g": -1, "s": "<p>My brother <u>has lived<\/u><sup>(1)<\/sup> in Japan <u>since<\/u><sup>(2)<\/sup> three years, and he <u>speaks<\/u><sup>(3)<\/sup> Japanese <u>very well<\/u><sup>(4)<\/sup> now.<\/p>", "o": ["<u>has lived<\/u>", "<u>since<\/u>", "<u>speaks<\/u>", "<u>very well<\/u>"], "note": "", "t": "Tenses", "a": 2, "x": "three years เป็นช่วงระยะเวลา ต้องใช้ for (since ใช้กับจุดเริ่มต้นของเวลา)"}, {"n": "47", "alt": "", "d": "", "g": -1, "s": "<p>Neither the students <u>nor<\/u><sup>(1)<\/sup> the teacher <u>were<\/u><sup>(2)<\/sup> <u>able to<\/u><sup>(3)<\/sup> answer the visitor's <u>difficult<\/u><sup>(4)<\/sup> question.<\/p>", "o": ["<u>nor<\/u>", "<u>were<\/u>", "<u>able to<\/u>", "<u>difficult<\/u>"], "note": "", "t": "Nouns, pronouns & agreement", "a": 2, "x": "neither … nor … กริยาผันตามประธานตัวที่ใกล้ที่สุด (the teacher = เอกพจน์) → was"}, {"n": "48", "alt": "", "d": "", "g": -1, "s": "<p>She <u>is interested<\/u><sup>(1)<\/sup> in <u>learn<\/u><sup>(2)<\/sup> Korean <u>because<\/u><sup>(3)<\/sup> she loves <u>watching<\/u><sup>(4)<\/sup> K-dramas.<\/p>", "o": ["<u>is interested<\/u>", "<u>learn<\/u>", "<u>because<\/u>", "<u>watching<\/u>"], "note": "", "t": "Gerund & infinitive", "a": 2, "x": "หลังบุพบท in ต้องใช้ V-ing → learning"}, {"n": "49", "alt": "", "d": "", "g": -1, "s": "<p><u>Each<\/u><sup>(1)<\/sup> of the students <u>have<\/u><sup>(2)<\/sup> to bring <u>their<\/u><sup>(3)<\/sup> own pencil case to the exam <u>room<\/u><sup>(4)<\/sup>.<\/p>", "o": ["<u>Each<\/u>", "<u>have<\/u>", "<u>their<\/u>", "<u>room<\/u>"], "note": "", "t": "Nouns, pronouns & agreement", "a": 2, "x": "Each of + นามพหูพจน์ ใช้กริยาเอกพจน์ → has to"}, {"n": "50", "alt": "", "d": "", "g": -1, "s": "<p>The volunteers <u>worked<\/u><sup>(1)<\/sup> <u>tireless<\/u><sup>(2)<\/sup> for three days <u>to clean up<\/u><sup>(3)<\/sup> the beach <u>after<\/u><sup>(4)<\/sup> the oil spill.<\/p>", "o": ["<u>worked<\/u>", "<u>tireless<\/u>", "<u>to clean up<\/u>", "<u>after<\/u>"], "note": "", "t": "Adjectives, adverbs & comparison", "a": 2, "x": "ขยายกริยา worked ต้องใช้ adverb → tirelessly"}], "src": "claude", "id": "new1", "title": "ชุดฝึกที่ 1", "sub": "ข้อสอบแต่งใหม่สไตล์ SAMSEN Pre-Test ห้องพิเศษ · 50 ข้อ", "key": "ข้อสอบและเฉลยแต่งโดย Claude"}, {"groups": [{"l": "For items 11 – 13", "h": "<div class=\"box\"><p class=\"bt\">Robots in Our Kitchen?<\/p><p>In the future, robots ____(11)____ cook our meals and wash our dishes. Some restaurants in Japan and China ____(12)____ robot waiters since 2020. Not everyone likes this idea, ____(13)____. Some people worry that robots will take jobs away from humans.<\/p><\/div>"}, {"l": "For items 14 – 16", "h": "<div class=\"box\"><p>Dear Ms. Wong,<\/p><p>I am writing to ____(14)____ for the summer English camp. I am twelve years old and I ____(15)____ English for six years. I am especially interested in drama, ____(16)____ I would love to join the acting workshop.<\/p><p>Yours sincerely,<\/p><p>Pim<\/p><\/div>"}, {"l": "For items 17 – 19", "h": "<div class=\"box\"><p>Do you know why the sky is blue? Sunlight looks white, but it is actually made ____(17)____ many colours. When sunlight enters the air, blue light is scattered more ____(18)____ the other colours because it travels in shorter waves. That is why we see blue ____(19)____ we look up on a clear day.<\/p><\/div>"}, {"l": "For items 31 – 33", "h": "<div class=\"box\"><p class=\"sp\"><b>Pharmacist:<\/b><span>Hello. How can I help you?<\/span><\/p><p class=\"sp\"><b>Nok:<\/b><span>____(31)____<\/span><\/p><p class=\"sp\"><b>Pharmacist:<\/b><span>How long have you had it?<\/span><\/p><p class=\"sp\"><b>Nok:<\/b><span>____(32)____<\/span><\/p><p class=\"sp\"><b>Pharmacist:<\/b><span>Take this medicine three times a day after meals. ____(33)____<\/span><\/p><p class=\"sp\"><b>Nok:<\/b><span>OK, I will. Thank you.<\/span><\/p><\/div>"}, {"l": "For items 34 – 36", "h": "<div class=\"box\"><p class=\"bt\">The Great Wall of Plastic?<\/p><p>Every year, about eight million tonnes of plastic end up in the ocean. Much of it breaks into tiny pieces called microplastics, which are smaller than a grain of rice. Fish and other sea animals often mistake these pieces for food. When people eat these fish, the plastic may enter our bodies too.<\/p><p>Some countries have started to fight back. Kenya banned plastic bags in 2017, and anyone caught selling them can be fined up to 40,000 US dollars. In Thailand, many big shops stopped giving out free plastic bags in 2020. Experts say these steps help, but the most important change must come from each of us: using less plastic in our daily lives.<\/p><\/div>"}, {"l": "For items 37 – 39", "h": "<div class=\"box\"><p>Muay Thai is known as \"the art of eight limbs\" because fighters use their fists, elbows, knees and feet. Before every fight, boxers perform a dance called the Wai Kru Ram Muay to show respect to their teachers. In the past, Muay Thai was used by soldiers in battle. Today it has become popular all over the world, and there are Muay Thai gyms in more than 100 countries. Many foreigners now travel to Thailand just to train in the sport.<\/p><\/div>"}, {"l": "For items 40 – 41", "h": "<div class=\"box\"><p>Dear Diary,<\/p><p>Today was the worst day ever. First, my alarm didn't ring, so I missed the school bus. Then I realised I had left my homework on the kitchen table. At lunch, I dropped my tray in front of the whole class. But when I got home, Mum had baked my favourite chocolate cake. Maybe today wasn't so bad after all.<\/p><p>— Toon<\/p><\/div>"}, {"l": "For item 42", "h": "<div class=\"notice\"><div class=\"nt\">RIVER EXPRESS BOAT · TIMETABLE (Weekdays)<\/div><table class=\"tt\"><tr><th>Sathorn Pier<\/th><th>Tha Chang Pier<\/th><th>Nonthaburi Pier<\/th><\/tr><tr><td>07.00<\/td><td>07.25<\/td><td>08.10<\/td><\/tr><tr><td>08.30<\/td><td>08.55<\/td><td>09.40<\/td><\/tr><tr><td>10.00<\/td><td>10.25<\/td><td>11.10<\/td><\/tr><tr><td>12.00<\/td><td>12.25<\/td><td>—<\/td><\/tr><\/table><p class=\"nf\">Fare: 16 baht (any distance) · Children under 90 cm travel free<br>— The 12.00 boat stops at Tha Chang Pier.<\/p><\/div>"}, {"l": "For item 43", "h": "<figure class=\"chart\"><figcaption>Favourite after-school activities of Class 6/1 (40 students)<\/figcaption><svg viewBox=\"0 0 360 200\" role=\"img\" aria-label=\"bar chart\"><g class=\"ax\"><line x1=\"110\" y1=\"15\" x2=\"110\" y2=\"175\"/><\/g><g class=\"hl\"><text x=\"104\" y=\"35\">Playing games<\/text><text x=\"104\" y=\"70\">Sports<\/text><text x=\"104\" y=\"105\">Reading<\/text><text x=\"104\" y=\"140\">Music lessons<\/text><text x=\"104\" y=\"175\">Drawing<\/text><\/g><g class=\"br\"><rect x=\"110\" y=\"22\" width=\"168\" height=\"18\"/><rect x=\"110\" y=\"57\" width=\"112\" height=\"18\"/><rect x=\"110\" y=\"92\" width=\"56\" height=\"18\"/><rect x=\"110\" y=\"127\" width=\"42\" height=\"18\"/><rect x=\"110\" y=\"162\" width=\"28\" height=\"18\"/><\/g><g class=\"vl l\"><text x=\"284\" y=\"36\">12<\/text><text x=\"228\" y=\"71\">8<\/text><text x=\"172\" y=\"106\">4<\/text><text x=\"158\" y=\"141\">3<\/text><text x=\"144\" y=\"176\">2<\/text><\/g><\/svg><p class=\"nf\">*Some students did not choose any activity.<\/p><\/figure>"}, {"l": "For item 44", "h": "<div class=\"notice\"><div class=\"nt\">SWIMMING POOL RULES<\/div><ul class=\"rules\"><li>Shower before entering the pool.<\/li><li>Children under 10 must be with an adult.<\/li><li>No running, pushing or diving in the shallow end.<\/li><li>Swimming caps are required.<\/li><li>The pool is closed during thunderstorms.<\/li><\/ul><\/div>"}, {"l": "For item 45", "h": "<div class=\"notice poster\"><div class=\"nt big\">BOOK SWAP DAY<\/div><p><b>Bring a book, take a book!<\/b><br>Wednesday 5th · 12.00 – 1.00 p.m. · Main Hall<\/p><p class=\"nf\">Books must be in good condition. No textbooks or magazines, please.<br>Each student may take the same number of books they bring.<\/p><\/div>"}], "qs": [{"n": "1", "alt": "", "d": "Directions: Choose the best alternative to complete each blank.", "g": -1, "s": "<p>Mom: Look at those dark clouds! It ________ rain.<\/p><p>Son: Oh no, I left my umbrella upstairs. I ________ it.<\/p>", "o": ["is going to / 'll get", "is going to / am going to get", "will / 'm going to get", "will / get"], "note": "", "t": "Tenses", "a": 1, "x": "มีหลักฐานชัดเจน (เมฆดำ) → is going to rain; ตัดสินใจทันทีขณะพูด → I'll get it"}, {"n": "2", "alt": "", "d": "", "g": -1, "s": "<p>When I was younger, I ________ afraid of the dark, but now I ________ with the lights off.<\/p>", "o": ["use to be / used to sleeping", "used to being / used to sleep", "was used to be / am used to sleep", "used to be / am used to sleeping"], "note": "", "t": "Tenses", "a": 4, "x": "used to + V1 = เคย (แต่ตอนนี้ไม่แล้ว); be used to + V-ing = เคยชินกับ"}, {"n": "3", "alt": "", "d": "", "g": -1, "s": "<p>If I ________ a bird, I ________ fly to my grandmother's house in Chiang Rai every weekend.<\/p>", "o": ["was / will", "had been / would", "were / would", "am / will"], "note": "", "t": "Conditionals & wish", "a": 3, "x": "สมมติสิ่งที่เป็นไปไม่ได้ในปัจจุบัน → If-clause แบบที่ 2: If + were, would + V1"}, {"n": "4", "alt": "", "d": "", "g": -1, "s": "<p>I wish I ________ more time to practise. The piano competition is tomorrow, and I'm not ready.<\/p>", "o": ["have", "had", "will have", "would have had"], "note": "", "t": "Conditionals & wish", "a": 2, "x": "wish เกี่ยวกับปัจจุบัน (อยากให้ตอนนี้มีเวลามากกว่านี้) → wish + Past Simple: had"}, {"n": "5", "alt": "", "d": "", "g": -1, "s": "<p>\"I am going to the museum tomorrow,\" said Anna.<\/p><p>→ Anna said that she ________ to the museum ________.<\/p>", "o": ["went / the day before", "was going / the next day", "is going / tomorrow", "would go / yesterday"], "note": "", "t": "Sentence structure", "a": 2, "x": "ประโยคบอกเล่าทางอ้อม: am going → was going และ tomorrow → the next day"}, {"n": "6", "alt": "", "d": "", "g": -1, "s": "<p>My bike had a flat tyre, so I ________ at the shop near my house.<\/p>", "o": ["had repaired it", "repaired it", "got repairing it", "had it repaired"], "note": "", "t": "Passive & causative", "a": 4, "x": "ให้คนอื่นทำให้ → have + object + V3: had it repaired"}, {"n": "7", "alt": "", "d": "", "g": -1, "s": "<p>Nobody called while I was out, ________?<\/p>", "o": ["did they", "did he", "wasn't it", "didn't they"], "note": "", "t": "Sentence structure", "a": 1, "x": "ประธาน Nobody มีความหมายปฏิเสธและใช้ they ใน tag → ประโยคหลักปฏิเสธ tag เป็นบอกเล่า: did they?"}, {"n": "8", "alt": "", "d": "", "g": -1, "s": "<p>There is ________ milk left in the fridge — not even enough for one glass. Could you also get ________ eggs?<\/p>", "o": ["a few / little", "few / a little", "little / a few", "a little / a few"], "note": "", "t": "Nouns, pronouns & agreement", "a": 3, "x": "milk นับไม่ได้ และ \"ไม่พอแม้แต่แก้วเดียว\" = แทบไม่เหลือ → little (ไม่มี a); eggs นับได้ → a few"}, {"n": "9", "alt": "", "d": "", "g": -1, "s": "<p>________ Mekong River flows through six countries, including ________ China and Thailand.<\/p>", "o": ["A / –", "The / –", "The / the", "– / the"], "note": "", "t": "Nouns, pronouns & agreement", "a": 2, "x": "ชื่อแม่น้ำใช้ the (The Mekong River); ชื่อประเทศทั่วไปไม่ใช้ the"}, {"n": "10", "alt": "", "d": "", "g": -1, "s": "<p>English ________ in many countries, and it ________ by more than a billion people today.<\/p>", "o": ["is spoken / is learned", "spoke / is learning", "speaks / is learned", "is speaking / learns"], "note": "", "t": "Passive & causative", "a": 1, "x": "ภาษา \"ถูกพูด\" และ \"ถูกเรียน\" → Passive Present Simple ทั้งคู่"}, {"n": "11", "alt": "", "d": "", "g": 0, "s": "", "o": ["should to", "must to", "are able", "might"], "note": "", "t": "Modals", "a": 4, "x": "คาดการณ์อนาคตแบบไม่แน่นอน → might + V1 (ข้ออื่นผิดไวยากรณ์: must/should ไม่ตามด้วย to, are able ต้องมี to)"}, {"n": "12", "alt": "", "d": "", "g": 0, "s": "", "o": ["used", "use", "have used", "are used"], "note": "", "t": "Tenses", "a": 3, "x": "since 2020 (ตั้งแต่…จนถึงปัจจุบัน) → Present Perfect: have used"}, {"n": "13", "alt": "", "d": "", "g": 0, "s": "", "o": ["however", "therefore", "because", "so"], "note": "", "t": "Linking words & prepositions", "a": 1, "x": "ขัดแย้งกับประโยคก่อนหน้า วางท้ายประโยคหลังเครื่องหมายจุลภาค → , however."}, {"n": "14", "alt": "", "d": "", "g": 1, "s": "", "o": ["attend", "appear", "accept", "apply"], "note": "", "t": "Vocabulary", "a": 4, "x": "apply for = สมัคร (เขียนจดหมายสมัครเข้าค่าย)"}, {"n": "15", "alt": "", "d": "", "g": 1, "s": "", "o": ["am studying", "have been studying", "studied", "study"], "note": "", "t": "Tenses", "a": 2, "x": "for six years และยังเรียนอยู่ → Present Perfect Continuous: have been studying"}, {"n": "16", "alt": "", "d": "", "g": 1, "s": "", "o": ["unless", "although", "so", "but"], "note": "", "t": "Linking words & prepositions", "a": 3, "x": "สนใจการแสดง จึง (so) อยากเข้าเวิร์กช็อปการแสดง"}, {"n": "17", "alt": "", "d": "", "g": 2, "s": "", "o": ["of", "from", "in", "by"], "note": "", "t": "Linking words & prepositions", "a": 1, "x": "be made up of / made of = ประกอบด้วย (ในที่นี้ made of many colours)"}, {"n": "18", "alt": "", "d": "", "g": 2, "s": "", "o": ["that", "then", "than", "as"], "note": "", "t": "Adjectives, adverbs & comparison", "a": 3, "x": "more … than (มากกว่า)"}, {"n": "19", "alt": "", "d": "", "g": 2, "s": "", "o": ["although", "whenever", "until", "unless"], "note": "", "t": "Linking words & prepositions", "a": 2, "x": "whenever = ทุกครั้งที่ เงยหน้ามองในวันที่ท้องฟ้าแจ่มใส"}, {"n": "20", "alt": "", "d": "Directions: Choose the best alternative to complete each sentence.", "g": -1, "s": "<p>The doctor told my father to ________ fried food and eat more vegetables.<\/p>", "o": ["allow", "attract", "admire", "avoid"], "note": "", "t": "Vocabulary", "a": 4, "x": "avoid = หลีกเลี่ยง"}, {"n": "21", "alt": "", "d": "", "g": -1, "s": "<p>Lisa is so ________ that she never gives up, even when a task is very difficult.<\/p>", "o": ["jealous", "stubborn", "determined", "generous"], "note": "", "t": "Vocabulary", "a": 3, "x": "determined = มุ่งมั่น ไม่ยอมแพ้ (stubborn = หัวดื้อ มีความหมายเชิงลบ ไม่ใช่การไม่ยอมแพ้ในงานยาก)"}, {"n": "22", "alt": "", "d": "", "g": -1, "s": "<p>Thailand's ________ is hot and humid for most of the year.<\/p>", "o": ["season", "climate", "weather", "temperature"], "note": "", "t": "Vocabulary", "a": 2, "x": "ลักษณะอากาศโดยรวมทั้งปีของประเทศ = climate (weather = สภาพอากาศรายวัน)"}, {"n": "23", "alt": "", "d": "", "g": -1, "s": "<p>We've ________ sugar. Can you buy some on your way home?<\/p>", "o": ["run out of", "come up with", "got on with", "looked forward to"], "note": "", "t": "Idioms & phrasal verbs", "a": 1, "x": "run out of = หมด"}, {"n": "24", "alt": "", "d": "", "g": -1, "s": "<p>On the first day of school, the teacher played a fun game to help the new students ________.<\/p>", "o": ["cost an arm and a leg", "feel under the weather", "hit the books", "break the ice"], "note": "", "t": "Idioms & phrasal verbs", "a": 4, "x": "break the ice = ทำลายความเงียบ/ความเขินอายเมื่อเจอกันครั้งแรก"}, {"n": "25", "alt": "", "d": "", "g": -1, "s": "<p>Ben: Can you help me with my homework tonight?<\/p><p>Sara: Sorry, I can't. I have to ________ my little sister while my mum is out.<\/p>", "o": ["look up", "look for", "look into", "look after"], "note": "", "t": "Idioms & phrasal verbs", "a": 4, "x": "look after = ดูแล"}, {"n": "26", "alt": "", "d": "", "g": -1, "s": "<p>Which word is the <b>opposite<\/b> of the underlined word?<\/p><p>The road to the village is very <u>narrow<\/u>, so big trucks cannot use it.<\/p>", "o": ["steep", "short", "wide", "long"], "note": "", "t": "Vocabulary", "a": 3, "x": "narrow = แคบ ตรงข้ามคือ wide = กว้าง"}, {"n": "27", "alt": "", "d": "Directions: Choose the best response for each situation.", "g": -1, "s": "<p>A: I'm sorry I broke your ruler.<\/p><p>B: ________ I have another one.<\/p>", "o": ["Don't worry about it.", "I'm afraid not.", "Same to you.", "You're welcome."], "note": "", "t": "Conversation", "a": 1, "x": "ตอบรับคำขอโทษว่า \"ไม่เป็นไร\" → Don't worry about it."}, {"n": "28", "alt": "", "d": "", "g": -1, "s": "<p>You want to know how to get to the post office. You ask a stranger, \"________\"<\/p>", "o": ["Could you tell me where is the post office?", "Could you tell me the way to the post office?", "Do you go to the post office?", "Where is the post office going?"], "note": "", "t": "Conversation", "a": 2, "x": "ถามทางอย่างสุภาพ (ข้อ 1 ผิดไวยากรณ์ คำถามซ้อนต้องเรียงเป็น where the post office is)"}, {"n": "29", "alt": "", "d": "", "g": -1, "s": "<p>A: Let's go to the beach this weekend.<\/p><p>B: ________ The weather forecast says there will be a storm.<\/p>", "o": ["That's a great idea!", "I'm looking forward to it.", "I don't think that's a good idea.", "Sure, why not?"], "note": "", "t": "Conversation", "a": 3, "x": "มีพายุ จึงไม่เห็นด้วย → I don't think that's a good idea."}, {"n": "30", "alt": "", "d": "", "g": -1, "s": "<p>A: How often do you go swimming?<\/p><p>B: ________<\/p>", "o": ["With my brother.", "Twice a week.", "At the sports club.", "For two hours."], "note": "", "t": "Conversation", "a": 2, "x": "How often ถามความถี่ → Twice a week."}, {"n": "31", "alt": "", "d": "", "g": 3, "s": "", "o": ["Can I pay by card?", "I'm just looking, thanks.", "I'd like to buy a new phone.", "I've got a bad cough."], "note": "", "t": "Conversation", "a": 4, "x": "พูดกับเภสัชกร และถูกถามต่อว่า \"เป็นมานานแค่ไหน\" → อาการไอ"}, {"n": "32", "alt": "", "d": "", "g": 3, "s": "", "o": ["For about three days.", "Since three days.", "Three days ago.", "In three days."], "note": "", "t": "Conversation", "a": 1, "x": "How long have you had…? ตอบระยะเวลา → For about three days."}, {"n": "33", "alt": "", "d": "", "g": 3, "s": "", "o": ["And this is my favourite medicine.", "And you don't need to take it at all.", "And please come back tomorrow to pay.", "And make sure you drink plenty of water."], "note": "", "t": "Conversation", "a": 4, "x": "คำแนะนำเพิ่มเติมจากเภสัชกร และ Nok ตอบว่า \"OK, I will.\""}, {"n": "34", "alt": "", "d": "Directions: Read the passages and choose the best answer.", "g": 4, "s": "<p>What are microplastics?<\/p>", "o": ["A kind of food for fish", "Very small pieces of plastic", "Plastic bags sold in shops", "A grain of rice"], "note": "", "t": "Reading", "a": 2, "x": "\"tiny pieces called microplastics, which are smaller than a grain of rice\""}, {"n": "35", "alt": "", "d": "", "g": 4, "s": "<p>The word <b>\"banned\"<\/b> is closest in meaning to ________.<\/p>", "o": ["did not allow", "allowed", "produced", "sold cheaply"], "note": "", "t": "Reading", "a": 1, "x": "ban = สั่งห้าม = did not allow"}, {"n": "36", "alt": "", "d": "", "g": 4, "s": "<p>According to the experts, what is the most important way to solve the problem?<\/p>", "o": ["Shops giving out free bags", "Stopping fish from eating plastic", "Each person using less plastic", "Fining people who sell plastic bags"], "note": "", "t": "Reading", "a": 3, "x": "\"the most important change must come from each of us: using less plastic\""}, {"n": "37", "alt": "", "d": "", "g": 5, "s": "<p>Why is Muay Thai called \"the art of eight limbs\"?<\/p>", "o": ["Because fighters use eight parts of the body to fight", "Because it began eight hundred years ago", "Because it has eight rules", "Because there are eight fighters in each match"], "note": "", "t": "Reading", "a": 1, "x": "ใช้หมัด ศอก เข่า เท้า ข้างละ 2 = 8 ส่วนของร่างกาย"}, {"n": "38", "alt": "", "d": "", "g": 5, "s": "<p>What is the purpose of the Wai Kru Ram Muay?<\/p>", "o": ["To warm up the body only", "To show respect to teachers", "To scare the other fighter", "To entertain foreign tourists"], "note": "", "t": "Reading", "a": 2, "x": "\"to show respect to their teachers\""}, {"n": "39", "alt": "", "d": "", "g": 5, "s": "<p>Which of the following can be inferred?<\/p>", "o": ["Foreigners are not allowed to train in Muay Thai.", "Soldiers today still use Muay Thai in war.", "Muay Thai has attracted people from many countries.", "Muay Thai is only practised in Thailand."], "note": "", "t": "Reading", "a": 3, "x": "มีค่ายมวยไทยกว่า 100 ประเทศ และชาวต่างชาติเดินทางมาฝึก → ดึงดูดคนจากหลายประเทศ"}, {"n": "40", "alt": "", "d": "", "g": 6, "s": "<p>How did Toon feel at the end of the day?<\/p>", "o": ["Still angry about everything", "Worried about tomorrow's homework", "Embarrassed about the cake", "A little better"], "note": "", "t": "Reading", "a": 4, "x": "\"Maybe today wasn't so bad after all\" → รู้สึกดีขึ้นบ้าง"}, {"n": "41", "alt": "", "d": "", "g": 6, "s": "<p>Which event did <b>NOT<\/b> happen to Toon today?<\/p>", "o": ["He lost his chocolate cake.", "He dropped his lunch tray.", "He missed the school bus.", "He forgot his homework at home."], "note": "", "t": "Reading", "a": 1, "x": "แม่อบเค้กช็อกโกแลตให้ ไม่ได้ทำเค้กหาย"}, {"n": "42", "alt": "", "d": "", "g": 7, "s": "<p>According to the timetable, which statement is <b>CORRECT<\/b>?<\/p>", "o": ["The fare to Nonthaburi is more expensive than to Tha Chang.", "A child 100 cm tall can travel free.", "Every boat goes all the way to Nonthaburi Pier.", "It takes 25 minutes from Sathorn Pier to Tha Chang Pier."], "note": "", "t": "Notices & charts", "a": 4, "x": "07.00 → 07.25 = 25 นาที (เรือ 12.00 ไม่ถึงนนทบุรี, เด็กต่ำกว่า 90 ซม. เท่านั้นที่ฟรี, ค่าโดยสาร 16 บาททุกระยะ)"}, {"n": "43", "alt": "", "d": "", "g": 8, "s": "<p>Which statement is <b>TRUE<\/b> according to the chart?<\/p>", "o": ["Half of the class chose sports.", "Every student chose one activity.", "Playing games is three times as popular as reading.", "More students chose music lessons than reading."], "note": "", "t": "Notices & charts", "a": 3, "x": "เล่นเกม 12 คน = 3 เท่าของการอ่าน 4 คน (กีฬา 8 จาก 40 ไม่ใช่ครึ่ง, มีนักเรียนบางคนไม่ได้เลือก)"}, {"n": "44", "alt": "", "d": "", "g": 9, "s": "<p>Which of the following is <b>allowed<\/b> at this pool?<\/p>", "o": ["Diving into the shallow end", "A twelve-year-old swimming without an adult", "Swimming without a cap", "An eight-year-old swimming alone"], "note": "", "t": "Notices & charts", "a": 2, "x": "เด็กอายุต่ำกว่า 10 ปีต้องมีผู้ใหญ่ เด็กอายุ 12 ปีจึงว่ายคนเดียวได้"}, {"n": "45", "alt": "", "d": "", "g": 10, "s": "<p>Nan brings two storybooks and an old maths textbook. How many books can she take home?<\/p>", "o": ["One", "Two", "Three", "None"], "note": "", "t": "Notices & charts", "a": 2, "x": "ห้ามนำหนังสือเรียนมาแลก จึงนับได้แค่ 2 เล่ม และรับกลับได้เท่าจำนวนที่นำมา = 2 เล่ม"}, {"n": "46", "alt": "", "d": "Directions: Choose the underlined part which contains an error.", "g": -1, "s": "<p>Of all the students <u>in<\/u><sup>(1)<\/sup> our class, Mint <u>is<\/u><sup>(2)<\/sup> <u>the most good<\/u><sup>(3)<\/sup> at <u>solving<\/u><sup>(4)<\/sup> puzzles.<\/p>", "o": ["<u>in<\/u>", "<u>is<\/u>", "<u>the most good<\/u>", "<u>solving<\/u>"], "note": "", "t": "Adjectives, adverbs & comparison", "a": 3, "x": "ขั้นสูงสุดของ good คือ the best (ต้องเป็น the best at) ไม่ใช้ the most good"}, {"n": "47", "alt": "", "d": "", "g": -1, "s": "<p><u>While<\/u><sup>(1)<\/sup> we <u>were having<\/u><sup>(2)<\/sup> dinner, the lights suddenly <u>were going<\/u><sup>(3)<\/sup> <u>out<\/u><sup>(4)<\/sup>.<\/p>", "o": ["<u>While<\/u>", "<u>were having<\/u>", "<u>were going<\/u>", "<u>out<\/u>"], "note": "", "t": "Tenses", "a": 3, "x": "เหตุการณ์สั้นที่แทรกเข้ามา ใช้ Past Simple → went out"}, {"n": "48", "alt": "", "d": "", "g": -1, "s": "<p>If it <u>will rain<\/u><sup>(1)<\/sup> tomorrow, we <u>will have<\/u><sup>(2)<\/sup> to <u>cancel<\/u><sup>(3)<\/sup> the picnic <u>in<\/u><sup>(4)<\/sup> the park.<\/p>", "o": ["<u>will rain<\/u>", "<u>will have<\/u>", "<u>cancel<\/u>", "<u>in<\/u>"], "note": "", "t": "Conditionals & wish", "a": 1, "x": "ประโยค if ของเงื่อนไขแบบที่ 1 ใช้ Present Simple → If it rains"}, {"n": "49", "alt": "", "d": "", "g": -1, "s": "<p>I need <u>an<\/u><sup>(1)<\/sup> <u>information<\/u><sup>(2)<\/sup> about the <u>history<\/u><sup>(3)<\/sup> <u>of<\/u><sup>(4)<\/sup> our school.<\/p>", "o": ["<u>an<\/u>", "<u>information<\/u>", "<u>history<\/u>", "<u>of<\/u>"], "note": "", "t": "Nouns, pronouns & agreement", "a": 1, "x": "information เป็นนามนับไม่ได้ ใช้ an ไม่ได้ (ใช้ some information หรือ a piece of information)"}, {"n": "50", "alt": "", "d": "", "g": -1, "s": "<p>The man <u>who<\/u><sup>(1)<\/sup> car <u>was<\/u><sup>(2)<\/sup> stolen <u>called<\/u><sup>(3)<\/sup> the police <u>immediately<\/u><sup>(4)<\/sup>.<\/p>", "o": ["<u>who<\/u>", "<u>was<\/u>", "<u>called<\/u>", "<u>immediately<\/u>"], "note": "", "t": "Sentence structure", "a": 1, "x": "รถ \"ของ\" ผู้ชายคนนั้น ต้องใช้คำแสดงความเป็นเจ้าของ → whose car"}], "src": "claude", "id": "new2", "title": "ชุดฝึกที่ 2", "sub": "ข้อสอบแต่งใหม่สไตล์ SAMSEN Pre-Test ห้องพิเศษ · 50 ข้อ", "key": "ข้อสอบและเฉลยแต่งโดย Claude"}, {"groups": [{"l": "For items 11 – 13", "h": "<div class=\"box\"><p class=\"bt\">Time Capsule<\/p><p>Fifty years ago, the students of our school buried a time capsule under the old mango tree. Last week, it ____(11)____ at last. Inside, we found letters, photos and a cassette tape. One letter said, \"We hope that by the time you read this, people ____(12)____ cars that can fly!\" We all laughed, because we still ____(13)____ in traffic jams every day.<\/p><\/div>"}, {"l": "For items 14 – 16", "h": "<div class=\"box\"><p>Thai students ____(14)____ to wear uniforms at school. Some people think uniforms are a good idea ____(15)____ they make everyone look equal. Others believe students should be free to express ____(16)____ through their clothes.<\/p><\/div>"}, {"l": "For items 17 – 19", "h": "<div class=\"box\"><p>Have you ever ____(17)____ a durian? Many foreigners say it smells terrible, but people in Southeast Asia call it \"the king of fruits\". In fact, the smell is so strong ____(18)____ durians are not allowed on many buses and in hotels in Singapore. If you ____(19)____ to try one, ask a Thai friend to choose a ripe one for you.<\/p><\/div>"}, {"l": "For items 31 – 33", "h": "<div class=\"box\"><p class=\"sp\"><b>Receptionist:<\/b><span>Good afternoon, Sunshine Hotel. ____(31)____<\/span><\/p><p class=\"sp\"><b>Mr. Lee:<\/b><span>Yes, I'd like to book a room for next weekend.<\/span><\/p><p class=\"sp\"><b>Receptionist:<\/b><span>Certainly. ____(32)____<\/span><\/p><p class=\"sp\"><b>Mr. Lee:<\/b><span>Just two nights, Friday and Saturday.<\/span><\/p><p class=\"sp\"><b>Receptionist:<\/b><span>A double room is 2,500 baht per night, including breakfast.<\/span><\/p><p class=\"sp\"><b>Mr. Lee:<\/b><span>____(33)____ I'll take it.<\/span><\/p><\/div>"}, {"l": "For items 34 – 36", "h": "<div class=\"box\"><p class=\"bt\">Hachiko, the Loyal Dog<\/p><p>Hachiko was an Akita dog who lived in Tokyo in the 1920s. Every evening, he waited at Shibuya Station for his owner, Professor Ueno, to come home from work. One day in 1925, the professor died suddenly at his university and never returned. However, Hachiko did not give up. For the next nine years, he came to the station every day at exactly the time the train arrived.<\/p><p>People who passed by the station began to notice the faithful dog. Some of them brought him food, and newspapers wrote stories about him. Today, a bronze statue of Hachiko stands outside Shibuya Station. It has become one of the most popular meeting places in Tokyo.<\/p><\/div>"}, {"l": "For items 37 – 39", "h": "<div class=\"box\"><p>Why do we yawn? For a long time, people believed that we yawn because our bodies need more oxygen. However, recent studies have shown that this is probably not true. Instead, many scientists now think that yawning helps to cool down the brain. When we yawn, we take in a large amount of air, which may lower the temperature of the blood going to the head. Interestingly, yawning is also \"contagious\": seeing or even reading about someone yawning can make you yawn too. Are you yawning right now?<\/p><\/div>"}, {"l": "For items 40 – 41", "h": "<div class=\"box\"><p>Tired of throwing away clothes? Try \"upcycling\"! Instead of putting old T-shirts in the rubbish bin, you can turn them into shopping bags, pillow covers or even dog toys. Upcycling saves money, reduces waste and lets you be creative. All you need is a pair of scissors, some thread and a little imagination.<\/p><\/div>"}, {"l": "For item 42", "h": "<div class=\"notice\"><div class=\"nt\">SCHOOL CANTEEN · TODAY'S MENU<\/div><table class=\"tt\"><tr><th>Dish<\/th><th>Price<\/th><\/tr><tr><td>Fried rice with chicken<\/td><td>35 baht<\/td><\/tr><tr><td>Noodle soup with pork<\/td><td>30 baht<\/td><\/tr><tr><td>Green curry with rice <i>(spicy)<\/i><\/td><td>40 baht<\/td><\/tr><tr><td>Fresh fruit cup<\/td><td>15 baht<\/td><\/tr><tr><td>Bottled water<\/td><td>10 baht<\/td><\/tr><\/table><p class=\"nf\">★ Special: Any main dish + fruit cup = 10 baht off!<\/p><\/div>"}, {"l": "For item 43", "h": "<figure class=\"chart\"><figcaption>Average monthly rainfall in Bangkok (mm)<\/figcaption><svg viewBox=\"0 0 360 200\" role=\"img\" aria-label=\"bar chart\"><g class=\"ax\"><line x1=\"40\" y1=\"20\" x2=\"40\" y2=\"170\"/><line x1=\"40\" y1=\"170\" x2=\"350\" y2=\"170\"/><\/g><g class=\"gl\"><line x1=\"40\" y1=\"132.5\" x2=\"350\" y2=\"132.5\"/><line x1=\"40\" y1=\"95\" x2=\"350\" y2=\"95\"/><line x1=\"40\" y1=\"57.5\" x2=\"350\" y2=\"57.5\"/><line x1=\"40\" y1=\"20\" x2=\"350\" y2=\"20\"/><\/g><g class=\"yl\"><text x=\"34\" y=\"174\">0<\/text><text x=\"34\" y=\"136\">100<\/text><text x=\"34\" y=\"99\">200<\/text><text x=\"34\" y=\"61\">300<\/text><text x=\"34\" y=\"24\">400<\/text><\/g><g class=\"br\"><rect x=\"52\" y=\"162.5\" width=\"34\" height=\"7.5\"/><rect x=\"102\" y=\"140\" width=\"34\" height=\"30\"/><rect x=\"152\" y=\"113.75\" width=\"34\" height=\"56.25\"/><rect x=\"202\" y=\"57.5\" width=\"34\" height=\"112.5\"/><rect x=\"252\" y=\"50\" width=\"34\" height=\"120\"/><rect x=\"302\" y=\"140\" width=\"34\" height=\"30\"/><\/g><g class=\"vl\"><text x=\"69\" y=\"157\">20<\/text><text x=\"119\" y=\"135\">80<\/text><text x=\"169\" y=\"108\">150<\/text><text x=\"219\" y=\"52\">300<\/text><text x=\"269\" y=\"44\">320<\/text><text x=\"319\" y=\"135\">80<\/text><\/g><g class=\"xl\"><text x=\"69\" y=\"188\">Jan<\/text><text x=\"119\" y=\"188\">Mar<\/text><text x=\"169\" y=\"188\">May<\/text><text x=\"219\" y=\"188\">Jul<\/text><text x=\"269\" y=\"188\">Sep<\/text><text x=\"319\" y=\"188\">Nov<\/text><\/g><\/svg><\/figure>"}, {"l": "For item 44", "h": "<div class=\"notice\"><div class=\"nt\">⚠ CAUTION: WILD MONKEYS<\/div><p>Do <b>not<\/b> feed the monkeys.<br>Keep food and plastic bags out of sight.<br>Do not look directly into a monkey's eyes.<br>If a monkey takes something from you, let it go.<\/p><\/div>"}, {"l": "For item 45", "h": "<div class=\"notice poster\"><div class=\"nt big\">HELP WANTED<\/div><p><b>Weekend volunteers needed at Happy Paws Animal Shelter<\/b><br>Walk dogs · Clean cages · Play with cats<\/p><p class=\"nf\">Age 12+ (under 15 must come with a parent) · Saturdays 9 a.m. – 12 p.m.<br>No experience needed — just love animals!<\/p><\/div>"}], "qs": [{"n": "1", "alt": "", "d": "Directions: Choose the best alternative to complete each blank.", "g": -1, "s": "<p>Ann: Have you finished your report yet?<\/p><p>Ben: Not yet. I ________ it for two hours, but I still ________ the conclusion.<\/p>", "o": ["write / didn't write", "am writing / haven't been written", "wrote / don't write", "have been writing / haven't written"], "note": "", "t": "Tenses", "a": 4, "x": "ทำต่อเนื่องมา 2 ชั่วโมงจนถึงตอนนี้ → have been writing; ยังไม่ได้เขียนบทสรุป (ถึงตอนนี้) → haven't written"}, {"n": "2", "alt": "", "d": "", "g": -1, "s": "<p>The film ________ by the time we got to the cinema, so we ________ the beginning.<\/p>", "o": ["started / missed", "had started / missed", "was starting / have missed", "has started / had missed"], "note": "", "t": "Tenses", "a": 2, "x": "หนังเริ่มก่อนที่เราจะไปถึง (เกิดก่อนในอดีต) → had started; ผลในอดีต → missed"}, {"n": "3", "alt": "", "d": "", "g": -1, "s": "<p>________ you study harder, you won't pass the entrance exam.<\/p>", "o": ["Because", "If", "Unless", "When"], "note": "", "t": "Conditionals & wish", "a": 3, "x": "Unless = If … not (ถ้าไม่ขยันกว่านี้ จะสอบไม่ผ่าน)"}, {"n": "4", "alt": "", "d": "", "g": -1, "s": "<p>Somchai has been working since 6 a.m. without a break. He ________ be very tired now.<\/p>", "o": ["must", "can't", "mustn't", "needn't"], "note": "", "t": "Modals", "a": 1, "x": "สรุปอย่างมั่นใจจากหลักฐาน → must be (ต้องเหนื่อยมากแน่ ๆ)"}, {"n": "5", "alt": "", "d": "", "g": -1, "s": "<p>\"Romeo and Juliet\" ________ by William Shakespeare more than 400 years ago.<\/p>", "o": ["was written", "wrote", "has written", "is written"], "note": "", "t": "Passive & causative", "a": 1, "x": "บทละคร \"ถูกเขียน\" เมื่อกว่า 400 ปีก่อน → Passive Past Simple: was written"}, {"n": "6", "alt": "", "d": "", "g": -1, "s": "<p>The more you practise, ________ you will become.<\/p>", "o": ["the most confident", "more confident", "the more confident", "the confident more"], "note": "", "t": "Adjectives, adverbs & comparison", "a": 3, "x": "โครงสร้าง The + ขั้นกว่า …, the + ขั้นกว่า … (ยิ่ง…ยิ่ง…)"}, {"n": "7", "alt": "", "d": "", "g": -1, "s": "<p>My parents don't let me ________ video games on school nights, but they allow me ________ on weekends.<\/p>", "o": ["playing / to play", "to play / play", "play / playing", "play / to play"], "note": "", "t": "Gerund & infinitive", "a": 4, "x": "let + someone + V1; allow + someone + to V1"}, {"n": "8", "alt": "", "d": "", "g": -1, "s": "<p>The firefighters showed great ________ when they rescued the children from the burning building.<\/p>", "o": ["braver", "bravery", "bravely", "brave"], "note": "", "t": "Adjectives, adverbs & comparison", "a": 2, "x": "หลัง great (คุณศัพท์) ต้องเป็นคำนาม → bravery (ความกล้าหาญ)"}, {"n": "9", "alt": "", "d": "", "g": -1, "s": "<p>Do you remember the day ________ we first met? It was the day ________ the school held its 100th anniversary.<\/p>", "o": ["that / which", "which / where", "when / when", "where / when"], "note": "", "t": "Sentence structure", "a": 3, "x": "ขยายคำบอกเวลา (the day) ที่ตามด้วยประโยคสมบูรณ์ → when ทั้งสองช่อง"}, {"n": "10", "alt": "", "d": "", "g": -1, "s": "<p>Both of my sisters can swim, but ________ of them can ride a bicycle.<\/p>", "o": ["none", "neither", "either", "both"], "note": "", "t": "Nouns, pronouns & agreement", "a": 2, "x": "พูดถึงคน 2 คน ในความหมายปฏิเสธ (ไม่มีใครเลยในสองคน) → neither (none ใช้กับ 3 คนขึ้นไป)"}, {"n": "11", "alt": "", "d": "", "g": 0, "s": "", "o": ["has opened", "is opened", "opened", "was opened"], "note": "", "t": "Passive & causative", "a": 4, "x": "ไทม์แคปซูล \"ถูกเปิด\" เมื่อสัปดาห์ที่แล้ว → was opened"}, {"n": "12", "alt": "", "d": "", "g": 0, "s": "", "o": ["will have invented", "invent", "had invented", "are inventing"], "note": "", "t": "Tenses", "a": 1, "x": "คาดว่าจะทำสำเร็จภายในจุดเวลาหนึ่งในอนาคต (by the time you read this) → Future Perfect: will have invented"}, {"n": "13", "alt": "", "d": "", "g": 0, "s": "", "o": ["had sat", "sat", "sit", "have sat"], "note": "", "t": "Tenses", "a": 3, "x": "ข้อเท็จจริง/กิจวัตรปัจจุบัน (every day) → sit"}, {"n": "14", "alt": "", "d": "", "g": 1, "s": "", "o": ["require", "requiring", "have required", "are required"], "note": "", "t": "Passive & causative", "a": 4, "x": "นักเรียน \"ถูกกำหนดให้\" ใส่เครื่องแบบ → be required to"}, {"n": "15", "alt": "", "d": "", "g": 1, "s": "", "o": ["although", "because", "so", "unless"], "note": "", "t": "Linking words & prepositions", "a": 2, "x": "ให้เหตุผลว่าทำไมบางคนคิดว่าเครื่องแบบดี → because"}, {"n": "16", "alt": "", "d": "", "g": 1, "s": "", "o": ["themselves", "theirselves", "them", "their"], "note": "", "t": "Nouns, pronouns & agreement", "a": 1, "x": "ประธานกับกรรมเป็นคนเดียวกัน (students … express themselves) → reflexive pronoun: themselves (theirselves ไม่มีในภาษาอังกฤษ)"}, {"n": "17", "alt": "", "d": "", "g": 2, "s": "", "o": ["eat", "eating", "ate", "eaten"], "note": "", "t": "Tenses", "a": 4, "x": "Have you ever + V3 → eaten"}, {"n": "18", "alt": "", "d": "", "g": 2, "s": "", "o": ["as", "that", "than", "which"], "note": "", "t": "Linking words & prepositions", "a": 2, "x": "โครงสร้าง so + adj + that … (…มากเสียจนกระทั่ง…)"}, {"n": "19", "alt": "", "d": "", "g": 2, "s": "", "o": ["will want", "had wanted", "want", "wanted"], "note": "", "t": "Conditionals & wish", "a": 3, "x": "If-clause แบบที่ 1 (ประโยคหลักเป็นคำสั่ง ask) → if + Present Simple: want"}, {"n": "20", "alt": "", "d": "Directions: Choose the best alternative to complete each sentence.", "g": -1, "s": "<p>The scientist made an important ________ about how dolphins communicate.<\/p>", "o": ["discovery", "decoration", "invention", "direction"], "note": "", "t": "Vocabulary", "a": 1, "x": "discovery = การค้นพบ (สิ่งที่มีอยู่แล้วแต่เพิ่งรู้) ส่วน invention = การประดิษฐ์สิ่งใหม่"}, {"n": "21", "alt": "", "d": "", "g": -1, "s": "<p>Please be ________ when you carry those glasses. They break easily.<\/p>", "o": ["caring", "careless", "carefree", "careful"], "note": "", "t": "Vocabulary", "a": 4, "x": "careful = ระมัดระวัง"}, {"n": "22", "alt": "", "d": "", "g": -1, "s": "<p>Many animals in the rainforest are in danger of becoming ________ because people are cutting down the trees.<\/p>", "o": ["excellent", "expensive", "extinct", "extra"], "note": "", "t": "Vocabulary", "a": 3, "x": "extinct = สูญพันธุ์"}, {"n": "23", "alt": "", "d": "", "g": -1, "s": "<p>I can't ________ the noise from the construction site next door. It's driving me crazy!<\/p>", "o": ["put up with", "keep up with", "come up with", "catch up with"], "note": "", "t": "Idioms & phrasal verbs", "a": 1, "x": "put up with = ทนกับ…"}, {"n": "24", "alt": "", "d": "", "g": -1, "s": "<p>Fon was ________ when she heard she had won a scholarship to study in England.<\/p>", "o": ["under the weather", "on cloud nine", "out of the blue", "in hot water"], "note": "", "t": "Idioms & phrasal verbs", "a": 2, "x": "on cloud nine = ดีใจมาก"}, {"n": "25", "alt": "", "d": "", "g": -1, "s": "<p>The fire alarm ________ in the middle of the maths test, and everyone had to leave the room.<\/p>", "o": ["gave up", "went off", "turned down", "took off"], "note": "", "t": "Idioms & phrasal verbs", "a": 2, "x": "(alarm) go off = ดังขึ้น"}, {"n": "26", "alt": "", "d": "", "g": -1, "s": "<p>Which word has the closest meaning to the underlined word?<\/p><p>Please <u>remain<\/u> in your seats until the bus stops completely.<\/p>", "o": ["stay", "leave", "change", "return"], "note": "", "t": "Vocabulary", "a": 1, "x": "remain = อยู่ต่อ (stay)"}, {"n": "27", "alt": "", "d": "Directions: Choose the best response for each situation.", "g": -1, "s": "<p>A: Thank you so much for helping me carry my bags.<\/p><p>B: ________<\/p>", "o": ["I'm sorry about that.", "Help yourself.", "It's my pleasure.", "No, thank you."], "note": "", "t": "Conversation", "a": 3, "x": "ตอบรับคำขอบคุณ → It's my pleasure. (Help yourself = เชิญตามสบาย ใช้ตอนเชิญให้หยิบอาหาร)"}, {"n": "28", "alt": "", "d": "", "g": -1, "s": "<p>Your friend says, \"I failed my science test.\" You want to show sympathy. You say, \"________\"<\/p>", "o": ["Lucky you!", "It serves you right.", "I'm glad to hear that.", "That's too bad. You'll do better next time."], "note": "", "t": "Conversation", "a": 4, "x": "แสดงความเห็นใจและให้กำลังใจ (It serves you right = สมน้ำหน้า)"}, {"n": "29", "alt": "", "d": "", "g": -1, "s": "<p>A: Do you mind if I sit here?<\/p><p>B: ________ The seat is free.<\/p>", "o": ["No, go ahead.", "I'd rather you didn't.", "Yes, I do.", "Yes, please don't."], "note": "", "t": "Conversation", "a": 1, "x": "ยินดีให้นั่ง ต้องตอบปฏิเสธ (No = ไม่รังเกียจ) + go ahead"}, {"n": "30", "alt": "", "d": "", "g": -1, "s": "<p>A: What does your father look like?<\/p><p>B: ________<\/p>", "o": ["He likes reading and gardening.", "He's very kind and patient.", "He's a doctor.", "He's tall with short grey hair."], "note": "", "t": "Conversation", "a": 4, "x": "What … look like? ถามรูปร่างหน้าตา (ข้อ 2 เป็นนิสัย ตอบคำถาม What is he like?)"}, {"n": "31", "alt": "", "d": "", "g": 3, "s": "", "o": ["What's the matter with you?", "Can I take your order?", "How can I help you?", "Where are you going?"], "note": "", "t": "Conversation", "a": 3, "x": "ทักทายลูกค้าทางโทรศัพท์ของโรงแรม → How can I help you?"}, {"n": "32", "alt": "", "d": "", "g": 3, "s": "", "o": ["How far is the hotel?", "How long will you be staying?", "When did you arrive?", "How much do you want to pay?"], "note": "", "t": "Conversation", "a": 2, "x": "ลูกค้าตอบว่า \"แค่ 2 คืน\" → ถามว่าจะพักนานเท่าไร"}, {"n": "33", "alt": "", "d": "", "g": 3, "s": "", "o": ["I'm afraid not.", "That sounds reasonable.", "Never mind.", "That's too expensive."], "note": "", "t": "Conversation", "a": 2, "x": "ตกลงจองต่อ \"I'll take it.\" → ราคาฟังดูสมเหตุสมผล"}, {"n": "34", "alt": "", "d": "Directions: Read the passages and choose the best answer.", "g": 4, "s": "<p>Why did Professor Ueno never come back to the station?<\/p>", "o": ["He died at work.", "He moved to another city.", "He forgot about Hachiko.", "He took a different train."], "note": "", "t": "Reading", "a": 1, "x": "\"the professor died suddenly at his university\""}, {"n": "35", "alt": "", "d": "", "g": 4, "s": "<p>The word <b>\"faithful\"<\/b> in paragraph 2 is closest in meaning to ________.<\/p>", "o": ["hungry", "clever", "loyal", "lost"], "note": "", "t": "Reading", "a": 3, "x": "faithful = ซื่อสัตย์ จงรักภักดี (loyal) ตรงกับชื่อเรื่อง \"the Loyal Dog\""}, {"n": "36", "alt": "", "d": "", "g": 4, "s": "<p>Which of the following is <b>TRUE<\/b>?<\/p>", "o": ["Nobody noticed Hachiko at the station.", "Hachiko waited at the station for nine days.", "Hachiko was given to the newspaper after 1925.", "The statue of Hachiko is now a famous meeting point."], "note": "", "t": "Reading", "a": 4, "x": "\"It has become one of the most popular meeting places in Tokyo\" (ข้อ 2 ผิด ที่ถูกคือ 9 ปี)"}, {"n": "37", "alt": "", "d": "", "g": 5, "s": "<p>According to many scientists today, why do we yawn?<\/p>", "o": ["To get more oxygen", "To make others yawn", "To cool down the brain", "To show we are bored"], "note": "", "t": "Reading", "a": 3, "x": "\"many scientists now think that yawning helps to cool down the brain\""}, {"n": "38", "alt": "", "d": "", "g": 5, "s": "<p>What does <b>\"contagious\"<\/b> mean in this passage?<\/p>", "o": ["able to spread from one person to another", "very difficult to stop", "only happening at night", "dangerous to health"], "note": "", "t": "Reading", "a": 1, "x": "เห็นหรืออ่านเรื่องคนหาวแล้วทำให้หาวตาม → ติดต่อกันได้"}, {"n": "39", "alt": "", "d": "", "g": 5, "s": "<p>Why does the writer ask \"Are you yawning right now?\" at the end?<\/p>", "o": ["To prove that yawning gives us more oxygen", "To show that reading about yawning can make people yawn", "To ask the reader to stop reading", "To check if the reader is sleepy"], "note": "", "t": "Reading", "a": 2, "x": "ผู้เขียนเล่นมุกกับข้อมูลว่าแค่ \"อ่าน\" เรื่องการหาวก็ทำให้หาวตามได้"}, {"n": "40", "alt": "", "d": "", "g": 6, "s": "<p>What is the main purpose of this text?<\/p>", "o": ["To warn people about rubbish bins", "To explain how T-shirts are made", "To sell new T-shirts", "To encourage readers to reuse old clothes in new ways"], "note": "", "t": "Reading", "a": 4, "x": "ชวนให้นำเสื้อผ้าเก่ามาดัดแปลงเป็นของใช้ใหม่ (upcycling)"}, {"n": "41", "alt": "", "d": "", "g": 6, "s": "<p>Which is <b>NOT<\/b> mentioned as a benefit of upcycling?<\/p>", "o": ["It saves money.", "It lets you be creative.", "It reduces waste.", "It makes clothes last longer in shops."], "note": "", "t": "Reading", "a": 4, "x": "ข้อดีที่กล่าวถึงคือ ประหยัดเงิน ลดขยะ และได้ใช้ความคิดสร้างสรรค์ ไม่ได้พูดถึงร้านค้า"}, {"n": "42", "alt": "", "d": "", "g": 7, "s": "<p>Kla buys noodle soup and a fruit cup. How much does he pay?<\/p>", "o": ["45 baht", "35 baht", "40 baht", "30 baht"], "note": "", "t": "Notices & charts", "a": 2, "x": "30 + 15 = 45 บาท ลด 10 บาทตามโปรโมชัน = 35 บาท"}, {"n": "43", "alt": "", "d": "", "g": 8, "s": "<p>Which statement is <b>CORRECT<\/b> according to the chart?<\/p>", "o": ["It rains more in May than in July.", "September has four times as much rain as November.", "January is the wettest month shown.", "March and November have different amounts of rain."], "note": "", "t": "Notices & charts", "a": 2, "x": "กันยายน 320 มม. = 4 เท่าของพฤศจิกายน 80 มม. (มกราคมแห้งที่สุด, กรกฎาคม 300 &gt; พฤษภาคม 150, มีนาคมกับพฤศจิกายนเท่ากัน)"}, {"n": "44", "alt": "", "d": "", "g": 9, "s": "<p>What should you do if a monkey grabs your hat?<\/p>", "o": ["Let the monkey keep the hat.", "Offer it some food to get the hat back.", "Shout at it and chase it.", "Look straight into its eyes."], "note": "", "t": "Notices & charts", "a": 1, "x": "\"If a monkey takes something from you, let it go.\" (ห้ามให้อาหาร ห้าม
