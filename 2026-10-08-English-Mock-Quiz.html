สบตา)"}, {"n": "45", "alt": "", "d": "", "g": 10, "s": "<p>Who can volunteer <b>alone<\/b> at the shelter?<\/p>", "o": ["A ten-year-old who loves cats", "A fourteen-year-old who can come on Sundays", "A sixteen-year-old who has never had a pet", "A thirteen-year-old with no experience"], "note": "", "t": "Notices & charts", "a": 3, "x": "อายุ 15 ปีขึ้นไปมาคนเดียวได้ ไม่ต้องมีประสบการณ์ (อายุต่ำกว่า 12 ปีมาไม่ได้, ต่ำกว่า 15 ต้องมากับผู้ปกครอง, รับเฉพาะวันเสาร์)"}, {"n": "46", "alt": "", "d": "Directions: Choose the underlined part which contains an error.", "g": -1, "s": "<p>The number of students <u>who<\/u><sup>(1)<\/sup> <u>walk<\/u><sup>(2)<\/sup> to school <u>have<\/u><sup>(3)<\/sup> increased <u>since<\/u><sup>(4)<\/sup> last year.<\/p>", "o": ["<u>who<\/u>", "<u>walk<\/u>", "<u>have<\/u>", "<u>since<\/u>"], "note": "", "t": "Nouns, pronouns & agreement", "a": 3, "x": "The number of … เป็นเอกพจน์ → has increased"}, {"n": "47", "alt": "", "d": "", "g": -1, "s": "<p>I was <u>so<\/u><sup>(1)<\/sup> <u>exciting<\/u><sup>(2)<\/sup> <u>about<\/u><sup>(3)<\/sup> the trip that I couldn't <u>sleep<\/u><sup>(4)<\/sup>.<\/p>", "o": ["<u>so<\/u>", "<u>exciting<\/u>", "<u>about<\/u>", "<u>sleep<\/u>"], "note": "", "t": "Adjectives, adverbs & comparison", "a": 2, "x": "ความรู้สึกของคน → excited"}, {"n": "48", "alt": "", "d": "", "g": -1, "s": "<p>We <u>decided<\/u><sup>(1)<\/sup> <u>stopping<\/u><sup>(2)<\/sup> at a café <u>because<\/u><sup>(3)<\/sup> we were all <u>hungry<\/u><sup>(4)<\/sup>.<\/p>", "o": ["<u>decided<\/u>", "<u>stopping<\/u>", "<u>because<\/u>", "<u>hungry<\/u>"], "note": "", "t": "Gerund & infinitive", "a": 2, "x": "decide + to V1 → decided to stop"}, {"n": "49", "alt": "", "d": "", "g": -1, "s": "<p>My cousin was born <u>on<\/u><sup>(1)<\/sup> 2012 and <u>has lived<\/u><sup>(2)<\/sup> <u>in<\/u><sup>(3)<\/sup> Phuket <u>since<\/u><sup>(4)<\/sup> then.<\/p>", "o": ["<u>on<\/u>", "<u>has lived<\/u>", "<u>in<\/u>", "<u>since<\/u>"], "note": "", "t": "Linking words & prepositions", "a": 1, "x": "ใช้ in กับปี → born in 2012"}, {"n": "50", "alt": "", "d": "", "g": -1, "s": "<p>It is <u>important<\/u><sup>(1)<\/sup> <u>to<\/u><sup>(2)<\/sup> protect the <u>environmental<\/u><sup>(3)<\/sup> for <u>future<\/u><sup>(4)<\/sup> generations.<\/p>", "o": ["<u>important<\/u>", "<u>to<\/u>", "<u>environmental<\/u>", "<u>future<\/u>"], "note": "", "t": "Adjectives, adverbs & comparison", "a": 3, "x": "หลัง the ต้องเป็นคำนาม → the environment"}], "src": "claude", "id": "new3", "title": "ชุดฝึกที่ 3", "sub": "ข้อสอบแต่งใหม่สไตล์ SAMSEN Pre-Test ห้องพิเศษ · 50 ข้อ", "key": "ข้อสอบและเฉลยแต่งโดย Claude"}, {"groups": [{"l": "For items 11 – 13", "h": "<div class=\"box\"><p class=\"bt\">A Village That Floats<\/p><p>Koh Panyee is a fishing village in Phang Nga Bay. It ____(11)____ on wooden stilts over the sea about 200 years ago. Because there was no flat land, the village children had nowhere to play football. So in 1986, they ____(12)____ their own floating football pitch from old boats and pieces of wood. Today the village team is one of the best in the south, and their story ____(13)____ in a famous TV advertisement.<\/p><\/div>"}, {"l": "For items 14 – 16", "h": "<div class=\"box\"><p>Did you know that octopuses have three hearts and blue blood? They are also very ____(14)____ animals. In aquariums, some octopuses have learned to open jars ____(15)____ get the food inside. One octopus in New Zealand even escaped from its tank at night and ____(16)____ its way down a pipe back to the ocean!<\/p><\/div>"}, {"l": "For items 17 – 19", "h": "<div class=\"box\"><p>Dear Grandma,<\/p><p>Thank you so much ____(17)____ the beautiful sweater. It fits me perfectly! It has been very cold here in Sapporo, so I ____(18)____ it almost every day since it arrived. I can't wait ____(19)____ you in April.<\/p><p>Love,<\/p><p>Mint<\/p><\/div>"}, {"l": "For items 31 – 33", "h": "<div class=\"box\"><p class=\"sp\"><b>Officer:<\/b><span>Can I see your passport, please?<\/span><\/p><p class=\"sp\"><b>Mr. Tanaka:<\/b><span>____(31)____<\/span><\/p><p class=\"sp\"><b>Officer:<\/b><span>What is the purpose of your visit?<\/span><\/p><p class=\"sp\"><b>Mr. Tanaka:<\/b><span>____(32)____ I'm visiting my daughter, who studies in Bangkok.<\/span><\/p><p class=\"sp\"><b>Officer:<\/b><span>How long are you going to stay?<\/span><\/p><p class=\"sp\"><b>Mr. Tanaka:<\/b><span>____(33)____<\/span><\/p><p class=\"sp\"><b>Officer:<\/b><span>Enjoy your stay in Thailand.<\/span><\/p><\/div>"}, {"l": "For items 34 – 36", "h": "<div class=\"box\"><p class=\"bt\">The Man Who Planted a Forest<\/p><p>In 1979, a sixteen-year-old boy named Jadav Payeng from Assam, India, found hundreds of snakes lying dead on a sandbar in the Brahmaputra River. A flood had washed them there, and there were no trees to give them shade from the hot sun. Jadav was so upset that he decided to do something about it.<\/p><p>Every day, he planted bamboo and other trees on the empty island. He carried water from the river to the plants by himself. Nobody helped him, and many people thought he was wasting his time.<\/p><p>Almost forty years later, his forest covers more than 550 hectares — bigger than New York's Central Park. It is now home to tigers, deer, rhinos and more than 100 elephants. Jadav is known around the world as \"the Forest Man of India\".<\/p><\/div>"}, {"l": "For items 37 – 39", "h": "<div class=\"box\"><p>Have you ever noticed that you can't tickle yourself? Scientists say it is because of a part of the brain called the cerebellum. When you move your own hand, your brain predicts exactly what you will feel. Because there is no surprise, the feeling is much weaker. When someone else tickles you, however, the brain cannot predict the touch, so it feels much stronger and makes you laugh. Interestingly, in one study, people were able to tickle themselves using a robot that moved with a short delay.<\/p><\/div>"}, {"l": "For items 40 – 41", "h": "<div class=\"box\"><p>Tickets for the school play \"The Little Prince\" are now on sale! Shows are on Thursday and Friday at 6 p.m. in the school theatre. Tickets cost 50 baht for students and 100 baht for adults. All money will go to the school library fund. Get your tickets early — last year all the seats were sold out in two days!<\/p><\/div>"}, {"l": "For item 42", "h": "<div class=\"notice\"><div class=\"nt\">SAMSEN SUMMER CAMPS<\/div><table class=\"tt\"><tr><th>Camp<\/th><th>Dates<\/th><th>Ages<\/th><th>Fee<\/th><\/tr><tr><td>Robotics<\/td><td>1–5 April<\/td><td>11–14<\/td><td>3,500 baht<\/td><\/tr><tr><td>English Drama<\/td><td>8–12 April<\/td><td>10–13<\/td><td>2,800 baht<\/td><\/tr><tr><td>Football<\/td><td>1–12 April<\/td><td>9–15<\/td><td>4,000 baht<\/td><\/tr><tr><td>Art &amp; Painting<\/td><td>22–26 April<\/td><td>8–11<\/td><td>2,500 baht<\/td><\/tr><\/table><p class=\"nf\">10% discount for students who join two camps.<\/p><\/div>"}, {"l": "For item 43", "h": "<figure class=\"chart\"><figcaption>Books borrowed from the school library (Term 1)<\/figcaption><svg viewBox=\"0 0 360 200\" role=\"img\" aria-label=\"bar chart\"><g class=\"ax\"><line x1=\"50\" y1=\"20\" x2=\"50\" y2=\"170\"/><line x1=\"50\" y1=\"170\" x2=\"350\" y2=\"170\"/><\/g><g class=\"gl\"><line x1=\"50\" y1=\"132.5\" x2=\"350\" y2=\"132.5\"/><line x1=\"50\" y1=\"95\" x2=\"350\" y2=\"95\"/><line x1=\"50\" y1=\"57.5\" x2=\"350\" y2=\"57.5\"/><line x1=\"50\" y1=\"20\" x2=\"350\" y2=\"20\"/><\/g><g class=\"yl\"><text x=\"44\" y=\"174\">0<\/text><text x=\"44\" y=\"136\">50<\/text><text x=\"44\" y=\"99\">100<\/text><text x=\"44\" y=\"61\">150<\/text><text x=\"44\" y=\"24\">200<\/text><\/g><g class=\"br\"><rect x=\"65\" y=\"125\" width=\"50\" height=\"45\"/><rect x=\"135\" y=\"80\" width=\"50\" height=\"90\"/><rect x=\"205\" y=\"35\" width=\"50\" height=\"135\"/><rect x=\"275\" y=\"102.5\" width=\"50\" height=\"67.5\"/><\/g><g class=\"vl\"><text x=\"90\" y=\"119\">60<\/text><text x=\"160\" y=\"74\">120<\/text><text x=\"230\" y=\"29\">180<\/text><text x=\"300\" y=\"96\">90<\/text><\/g><g class=\"xl\"><text x=\"90\" y=\"188\">June<\/text><text x=\"160\" y=\"188\">July<\/text><text x=\"230\" y=\"188\">August<\/text><text x=\"300\" y=\"188\">September<\/text><\/g><\/svg><\/figure>"}, {"l": "For item 44", "h": "<div class=\"notice\"><div class=\"nt\">MEDICINE LABEL<\/div><p><b>CoolKid Fever Syrup<\/b><br>Children 6–12 years: 10 ml every 6 hours<br>Do not take more than 4 times in 24 hours.<br>Shake well before use. Keep in a cool, dry place.<\/p><\/div>"}, {"l": "For item 45", "h": "<div class=\"notice poster\"><div class=\"nt big\">QUIET ZONE<\/div><p>This carriage is for passengers who wish to travel in silence.<br>Please switch your phone to silent mode<br>and take calls in the area between carriages.<\/p><\/div>"}], "qs": [{"n": "1", "alt": "", "d": "Directions: Choose the best alternative to complete each blank.", "g": -1, "s": "<p>Ploy: Why are your hands so dirty?<\/p><p>Tan: I ________ in the garden all morning. I ________ twenty small trees so far.<\/p>", "o": ["am working / planted", "have worked / have been planting", "have been working / have planted", "worked / planted"], "note": "", "t": "Tenses", "a": 3, "x": "ทำต่อเนื่องจนเพิ่งเสร็จและเห็นผล (มือสกปรก) → have been working; ผลงานที่นับได้ \"so far\" → have planted (ใช้ continuous กับจำนวนที่นับได้ไม่ได้)"}, {"n": "2", "alt": "", "d": "", "g": -1, "s": "<p>This time tomorrow, we ________ over the Andaman Sea on our way to Phuket.<\/p>", "o": ["fly", "were flying", "have flown", "will be flying"], "note": "", "t": "Tenses", "a": 4, "x": "\"This time tomorrow\" = กำลังทำอยู่ ณ เวลาหนึ่งในอนาคต → Future Continuous: will be flying"}, {"n": "3", "alt": "", "d": "", "g": -1, "s": "<p>I wish I ________ my phone at home yesterday. I couldn't call my mum when the bus broke down.<\/p>", "o": ["hadn't left", "wouldn't leave", "haven't left", "didn't leave"], "note": "", "t": "Conditionals & wish", "a": 1, "x": "wish เกี่ยวกับอดีต (yesterday) → wish + had V3 (ปฏิเสธ: hadn't left)"}, {"n": "4", "alt": "", "d": "", "g": -1, "s": "<p>You ________ wear a uniform on Sports Day. You can wear any sports clothes you like.<\/p>", "o": ["have to", "don't have to", "mustn't", "shouldn't"], "note": "", "t": "Modals", "a": 2, "x": "ไม่จำเป็นต้อง (แต่ใส่ก็ได้) → don't have to (mustn't = ห้าม)"}, {"n": "5", "alt": "", "d": "", "g": -1, "s": "<p>The teacher asked me ________.<\/p>", "o": ["where had I put my homework", "where did I put my homework", "where I had put my homework", "where I put my homework"], "note": "", "t": "Sentence structure", "a": 3, "x": "ประโยคคำถามทางอ้อมต้องเรียงแบบบอกเล่า (ประธานก่อนกริยา) และเลื่อน tense ย้อนอดีตหนึ่งขั้น (put → had put)"}, {"n": "6", "alt": "", "d": "", "g": -1, "s": "<p>________ the heavy rain, the football match went on as planned.<\/p>", "o": ["However", "Despite", "Although", "Because of"], "note": "", "t": "Linking words & prepositions", "a": 2, "x": "ตามด้วยคำนาม (the heavy rain) และมีความหมายขัดแย้ง → Despite (Although ต้องตามด้วยประโยค)"}, {"n": "7", "alt": "", "d": "", "g": -1, "s": "<p>It was ________ interesting book that I finished it in one night.<\/p>", "o": ["such an", "so", "very an", "too"], "note": "", "t": "Adjectives, adverbs & comparison", "a": 1, "x": "such + a/an + adj + noun + that … ; so ใช้กับคุณศัพท์ที่ไม่มีคำนามตาม"}, {"n": "8", "alt": "", "d": "", "g": -1, "s": "<p>I would rather ________ at home than ________ to the crowded shopping mall.<\/p>", "o": ["staying / going", "stay / going", "to stay / to go", "stay / go"], "note": "", "t": "Gerund & infinitive", "a": 4, "x": "would rather + V1 … than + V1"}, {"n": "9", "alt": "", "d": "", "g": -1, "s": "<p>Mobile phones must ________ before you enter the exam room.<\/p>", "o": ["be switching off", "be switched off", "switch off", "switched off"], "note": "", "t": "Passive & causative", "a": 2, "x": "โทรศัพท์ \"ต้องถูกปิด\" → Passive หลัง modal: must be + V3"}, {"n": "10", "alt": "", "d": "", "g": -1, "s": "<p>You can borrow ________ pen — the blue one or the black one. They both work.<\/p>", "o": ["both", "every", "either", "neither"], "note": "", "t": "Nouns, pronouns & agreement", "a": 3, "x": "เลือกอย่างใดอย่างหนึ่งจาก 2 สิ่ง → either (หลัง either ใช้นามเอกพจน์ pen)"}, {"n": "11", "alt": "", "d": "", "g": 0, "s": "", "o": ["built", "is building", "has built", "was built"], "note": "", "t": "Passive & causative", "a": 4, "x": "หมู่บ้าน \"ถูกสร้าง\" เมื่อ 200 ปีก่อน → was built"}, {"n": "12", "alt": "", "d": "", "g": 0, "s": "", "o": ["made", "have made", "had been made", "make"], "note": "", "t": "Tenses", "a": 1, "x": "in 1986 → Past Simple: made"}, {"n": "13", "alt": "", "d": "", "g": 0, "s": "", "o": ["has told", "was telling", "tells", "has been told"], "note": "", "t": "Passive & causative", "a": 4, "x": "เรื่องราว \"ถูกเล่า\" (และยังเป็นที่รู้จักถึงปัจจุบัน) → Passive Present Perfect: has been told"}, {"n": "14", "alt": "", "d": "", "g": 1, "s": "", "o": ["intelligent", "intelligently", "intelligence", "intellect"], "note": "", "t": "Adjectives, adverbs & comparison", "a": 1, "x": "ขยายคำนาม animals ต้องเป็นคุณศัพท์ → intelligent"}, {"n": "15", "alt": "", "d": "", "g": 1, "s": "", "o": ["because of", "such as", "in order to", "so that"], "note": "", "t": "Gerund & infinitive", "a": 3, "x": "บอกจุดประสงค์ ตามด้วย V1 (get) → in order to (so that ต้องตามด้วยประโยคที่มีประธาน)"}, {"n": "16", "alt": "", "d": "", "g": 1, "s": "", "o": ["was finding", "found", "finds", "has found"], "note": "", "t": "Tenses", "a": 2, "x": "เล่าเหตุการณ์ในอดีตต่อจาก escaped → found its way (หาทางไปจนได้)"}, {"n": "17", "alt": "", "d": "", "g": 2, "s": "", "o": ["for", "with", "to", "about"], "note": "", "t": "Linking words & prepositions", "a": 1, "x": "Thank you for + สิ่งที่ได้รับ"}, {"n": "18", "alt": "", "d": "", "g": 2, "s": "", "o": ["was wearing", "have worn", "wear", "wore"], "note": "", "t": "Tenses", "a": 2, "x": "since it arrived (ตั้งแต่ได้รับจนถึงตอนนี้) → Present Perfect: have worn"}, {"n": "19", "alt": "", "d": "", "g": 2, "s": "", "o": ["to seeing", "see", "to see", "seeing"], "note": "", "t": "Gerund & infinitive", "a": 3, "x": "can't wait + to V1 = รอไม่ไหวที่จะ…"}, {"n": "20", "alt": "", "d": "Directions: Choose the best alternative to complete each sentence.", "g": -1, "s": "<p>After running the marathon, Tom was completely ________ and fell asleep on the sofa.<\/p>", "o": ["excited", "energetic", "exhausting", "exhausted"], "note": "", "t": "Vocabulary", "a": 4, "x": "exhausted = เหนื่อยล้ามาก (ความรู้สึกของคน)"}, {"n": "21", "alt": "", "d": "", "g": -1, "s": "<p>The manager will ________ the winners of the drawing competition at the end of the ceremony.<\/p>", "o": ["pronounce", "denounce", "renounce", "announce"], "note": "", "t": "Vocabulary", "a": 4, "x": "announce = ประกาศ (pronounce = ออกเสียง)"}, {"n": "22", "alt": "", "d": "", "g": -1, "s": "<p>Water ________ at 100 degrees Celsius.<\/p>", "o": ["burns", "boils", "freezes", "melts"], "note": "", "t": "Vocabulary", "a": 2, "x": "น้ำเดือดที่ 100 องศาเซลเซียส → boils"}, {"n": "23", "alt": "", "d": "", "g": -1, "s": "<p>Could you ________ these words in the dictionary? I don't know what they mean.<\/p>", "o": ["look up", "look forward to", "look over", "look out"], "note": "", "t": "Idioms & phrasal verbs", "a": 1, "x": "look up = เปิดหา (ในพจนานุกรม)"}, {"n": "24", "alt": "", "d": "", "g": -1, "s": "<p>The new phone costs ________. I'll never be able to afford it.<\/p>", "o": ["a drop in the ocean", "a piece of cake", "an arm and a leg", "the tip of the iceberg"], "note": "", "t": "Idioms & phrasal verbs", "a": 3, "x": "cost an arm and a leg = แพงมาก"}, {"n": "25", "alt": "", "d": "", "g": -1, "s": "<p>Our teacher asked us to ________ a name for our class project by Friday.<\/p>", "o": ["come up with", "catch up with", "put up with", "get away with"], "note": "", "t": "Idioms & phrasal verbs", "a": 1, "x": "come up with = คิด (ไอเดีย/ชื่อ) ขึ้นมา"}, {"n": "26", "alt": "", "d": "", "g": -1, "s": "<p>Which word is the <b>opposite<\/b> of the underlined word?<\/p><p>The instructions for the new game were very <u>complicated<\/u>.<\/p>", "o": ["strange", "difficult", "simple", "boring"], "note": "", "t": "Vocabulary", "a": 3, "x": "complicated = ซับซ้อน ตรงข้ามคือ simple"}, {"n": "27", "alt": "", "d": "Directions: Choose the best response for each situation.", "g": -1, "s": "<p>A: Excuse me, is this seat taken?<\/p><p>B: ________<\/p>", "o": ["Yes, please take it.", "No, it's free. Please sit down.", "No, I'm taking it.", "Sorry, I don't sit here."], "note": "", "t": "Conversation", "a": 2, "x": "ถามว่าที่นั่งมีคนจองไหม ถ้าว่างต้องตอบ No, it's free."}, {"n": "28", "alt": "", "d": "", "g": -1, "s": "<p>Your classmate forgot her pencil. You want to offer yours. You say, \"________\"<\/p>", "o": ["Can you lend me your pencil?", "Have you got a pencil for me?", "I'd like to borrow a pencil.", "Would you like to borrow my pencil?"], "note": "", "t": "Conversation", "a": 4, "x": "เสนอให้ยืม → Would you like to borrow…? (ข้ออื่นเป็นการขอยืมจากเขา)"}, {"n": "29", "alt": "", "d": "", "g": -1, "s": "<p>A: I think online learning is better than learning in the classroom.<\/p><p>B: ________ I learn more when I can ask the teacher questions face to face.<\/p>", "o": ["That's just what I was thinking.", "I see what you mean, but I'm not sure.", "Exactly!", "I couldn't agree more."], "note": "", "t": "Conversation", "a": 2, "x": "ประโยคต่อมาแสดงความเห็นต่าง จึงต้องเป็นการไม่เห็นด้วยอย่างสุภาพ (ข้ออื่นเป็นการเห็นด้วย)"}, {"n": "30", "alt": "", "d": "", "g": -1, "s": "<p>A: Happy New Year!<\/p><p>B: ________<\/p>", "o": ["Congratulations!", "You're welcome.", "Thank you. The same to you!", "Never mind."], "note": "", "t": "Conversation", "a": 3, "x": "ตอบคำอวยพร → The same to you! (ขอให้เธอเช่นกัน)"}, {"n": "31", "alt": "", "d": "", "g": 3, "s": "", "o": ["Here you are.", "You're welcome.", "No problem, I'll call you.", "It's on the table."], "note": "", "t": "Conversation", "a": 1, "x": "ยื่นของให้ → Here you are."}, {"n": "32", "alt": "", "d": "", "g": 3, "s": "", "o": ["I'm a student.", "I'm here on business.", "I'm here to work.", "I'm on holiday."], "note": "", "t": "Conversation", "a": 4, "x": "มาเยี่ยมลูกสาว = มาเที่ยว/พักผ่อน (ไม่ใช่ธุรกิจหรือทำงาน)"}, {"n": "33", "alt": "", "d": "", "g": 3, "s": "", "o": ["Since last Monday.", "At a hotel.", "By plane.", "For two weeks."], "note": "", "t": "Conversation", "a": 4, "x": "How long … stay? ถามระยะเวลา → For two weeks."}, {"n": "34", "alt": "", "d": "Directions: Read the passages and choose the best answer.", "g": 4, "s": "<p>What made Jadav start planting trees?<\/p>", "o": ["He saw snakes that died because there was no shade.", "He wanted to build a park like Central Park.", "He wanted to sell bamboo.", "His village asked him to do it."], "note": "", "t": "Reading", "a": 1, "x": "เขาเห็นงูตายจำนวนมากเพราะไม่มีต้นไม้ให้ร่มเงา"}, {"n": "35", "alt": "", "d": "", "g": 4, "s": "<p>Which word best describes Jadav?<\/p>", "o": ["selfish", "patient", "careless", "lazy"], "note": "", "t": "Reading", "a": 2, "x": "ปลูกต้นไม้ทุกวันคนเดียวนานเกือบ 40 ปี → อดทน (patient)"}, {"n": "36", "alt": "", "d": "", "g": 4, "s": "<p>Which statement is <b>NOT<\/b> true?<\/p>", "o": ["Jadav worked alone for many years.", "Wild animals now live in the forest.", "People believed in his project from the start.", "His forest is larger than Central Park."], "note": "", "t": "Reading", "a": 3, "x": "หลายคนคิดว่าเขาเสียเวลาเปล่า ไม่ได้เชื่อตั้งแต่แรก"}, {"n": "37", "alt": "", "d": "", "g": 5, "s": "<p>Why can't people tickle themselves?<\/p>", "o": ["The cerebellum stops them from moving.", "They are afraid of laughing.", "Their brains know what will happen.", "Their hands are too weak."], "note": "", "t": "Reading", "a": 3, "x": "สมองคาดการณ์สัมผัสได้ล่วงหน้า จึงไม่รู้สึกถึงความประหลาดใจ"}, {"n": "38", "alt": "", "d": "", "g": 5, "s": "<p>The word <b>\"predicts\"<\/b> is closest in meaning to ________.<\/p>", "o": ["guesses in advance", "feels pain", "stops", "forgets"], "note": "", "t": "Reading", "a": 1, "x": "predict = คาดการณ์ล่วงหน้า"}, {"n": "39", "alt": "", "d": "", "g": 5, "s": "<p>Why could people tickle themselves with the robot?<\/p>", "o": ["The robot made funny sounds.", "The delay made the touch less predictable.", "The robot was very strong.", "The robot used the cerebellum."], "note": "", "t": "Reading", "a": 2, "x": "หุ่นยนต์ขยับช้ากว่าเล็กน้อย สมองจึงคาดการณ์สัมผัสได้ยากขึ้น"}, {"n": "40", "alt": "", "d": "", "g": 6, "s": "<p>What will the money from the tickets be used for?<\/p>", "o": ["Paying the actors", "Building a new theatre", "Next year's play", "The school library"], "note": "", "t": "Reading", "a": 4, "x": "\"All money will go to the school library fund.\""}, {"n": "41", "alt": "", "d": "", "g": 6, "s": "<p>Why does the writer say \"Get your tickets early\"?<\/p>", "o": ["Tickets are cheaper on the first day.", "Only students can buy tickets.", "The play starts early in the morning.", "Tickets may sell out quickly."], "note": "", "t": "Reading", "a": 4, "x": "ปีที่แล้วตั๋วขายหมดภายใน 2 วัน"}, {"n": "42", "alt": "", "d": "", "g": 7, "s": "<p>Pete is 12 years old. He wants to join two camps that do not happen at the same time. Which pair can he choose?<\/p>", "o": ["Football and Art &amp; Painting", "Robotics and Football", "Robotics and English Drama", "English Drama and Football"], "note": "", "t": "Notices & charts", "a": 3, "x": "หุ่นยนต์ (1–5 เม.ย.) กับละคร (8–12 เม.ย.) วันไม่ชนกัน และอายุ 12 ปีเข้าได้ทั้งคู่ (ฟุตบอล 1–12 เม.ย. ชนกับทั้งสองค่าย และค่ายศิลปะรับแค่อายุ 8–11 ปี)"}, {"n": "43", "alt": "", "d": "", "g": 8, "s": "<p>Which statement is <b>INCORRECT<\/b>?<\/p>", "o": ["In total, 400 books were borrowed during the term.", "Fewer books were borrowed in September than in July.", "August was the busiest month for the library.", "The number of books borrowed doubled from June to July."], "note": "", "t": "Notices & charts", "a": 1, "x": "รวมทั้งเทอม = 60 + 120 + 180 + 90 = 450 เล่ม ไม่ใช่ 400"}, {"n": "44", "alt": "", "d": "", "g": 9, "s": "<p>What is the <b>largest<\/b> amount of syrup a ten-year-old can take in one day?<\/p>", "o": ["10 ml", "24 ml", "40 ml", "60 ml"], "note": "", "t": "Notices & charts", "a": 3, "x": "ครั้งละ 10 มล. ไม่เกิน 4 ครั้งใน 24 ชั่วโมง → 10 × 4 = 40 มล."}, {"n": "45", "alt": "", "d": "", "g": 10, "s": "<p>Where would you most likely see this sign?<\/p>", "o": ["In a restaurant", "On a train", "At a football stadium", "In a classroom"], "note": "", "t": "Notices & charts", "a": 2, "x": "คำว่า carriage (ตู้โดยสาร) และ passengers → บนรถไฟ"}, {"n": "46", "alt": "", "d": "Directions: Choose the underlined part which contains an error.", "g": -1, "s": "<p>Bangkok is <u>much<\/u><sup>(1)<\/sup> <u>more hotter<\/u><sup>(2)<\/sup> <u>than<\/u><sup>(3)<\/sup> Chiang Mai <u>in<\/u><sup>(4)<\/sup> December.<\/p>", "o": ["<u>much<\/u>", "<u>more hotter<\/u>", "<u>than<\/u>", "<u>in<\/u>"], "note": "", "t": "Adjectives, adverbs & comparison", "a": 2, "x": "hot เป็นคุณศัพท์พยางค์เดียว ขั้นกว่าคือ hotter ไม่ต้องมี more"}, {"n": "47", "alt": "", "d": "", "g": -1, "s": "<p>Everyone in my family <u>love<\/u><sup>(1)<\/sup> <u>eating<\/u><sup>(2)<\/sup> som tam, <u>especially<\/u><sup>(3)<\/sup> my <u>grandfather<\/u><sup>(4)<\/sup>.<\/p>", "o": ["<u>love<\/u>", "<u>eating<\/u>", "<u>especially<\/u>", "<u>grandfather<\/u>"], "note": "", "t": "Nouns, pronouns & agreement", "a": 1, "x": "Everyone ใช้กริยาเอกพจน์ → loves"}, {"n": "48", "alt": "", "d": "", "g": -1, "s": "<p>I <u>have seen<\/u><sup>(1)<\/sup> that movie <u>last<\/u><sup>(2)<\/sup> weekend, and I <u>think<\/u><sup>(3)<\/sup> it was <u>amazing<\/u><sup>(4)<\/sup>.<\/p>", "o": ["<u>have seen<\/u>", "<u>last<\/u>", "<u>think<\/u>", "<u>amazing<\/u>"], "note": "", "t": "Tenses", "a": 1, "x": "last weekend ระบุเวลาในอดีต ใช้ Past Simple → saw"}, {"n": "49", "alt": "", "d": "", "g": -1, "s": "<p>You <u>had better<\/u><sup>(1)<\/sup> <u>to bring<\/u><sup>(2)<\/sup> a jacket <u>because<\/u><sup>(3)<\/sup> it <u>gets<\/u><sup>(4)<\/sup> cold at night.<\/p>", "o": ["<u>had better<\/u>", "<u>to bring<\/u>", "<u>because<\/u>", "<u>gets<\/u>"], "note": "", "t": "Modals", "a": 2, "x": "had better + V1 (ไม่มี to) → had better bring"}, {"n": "50", "alt": "", "d": "", "g": -1, "s": "<p>My friend and <u>me<\/u><sup>(1)<\/sup> <u>went<\/u><sup>(2)<\/sup> to the cinema <u>together<\/u><sup>(3)<\/sup> <u>last<\/u><sup>(4)<\/sup> Saturday.<\/p>", "o": ["<u>me<\/u>", "<u>went<\/u>", "<u>together<\/u>", "<u>last<\/u>"], "note": "", "t": "Nouns, pronouns & agreement", "a": 1, "x": "ทำหน้าที่ประธานต้องใช้ I → My friend and I"}], "src": "claude", "id": "new4", "title": "ชุดฝึกที่ 4", "sub": "ข้อสอบแต่งใหม่สไตล์ SAMSEN Pre-Test ห้องพิเศษ · 50 ข้อ", "key": "ข้อสอบและเฉลยแต่งโดย Claude"}]</script>
<script>
(function(){
const SETS = JSON.parse(document.getElementById('data').textContent);
const KEY = 'samsen-eng-mock-v1';
const app = document.getElementById('app');
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }
let store = load(); store.sets = store.sets || {}; store.mode = store.mode || 'practice';
let S = null, timerId = null, filter = 'wrong';
const $ = (h) => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstChild; };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const setOf = id => SETS.find(s => s.id === id);
const rec = id => (store.sets[id] = store.sets[id] || {});
const yearOf = s => (s.title.match(/20\d\d/)||[''])[0];
const shortTitle = s => 'ข้อสอบเสมือน · ' + s.title;
const qLabel = q => q.alt ? `${q.n} (${q.alt})` : q.n;
const fmt = sec => { sec=Math.max(0,Math.round(sec)); const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); };

/* ---------- home ---------- */
function home(){
  stopTimer(); S = null; window.scrollTo(0,0);
  const m = store.mode;
  let h = `<header class="mast"><span class="eyebrow">Mock Test · ระดับห้องพิเศษ</span>
    <h1>ข้อสอบเสมือนสามเสน</h1>
    <p class="muted" style="margin:0">ข้อสอบแต่งใหม่ ${SETS.length} ชุด รวม ${SETS.reduce((a,s)=>a+s.qs.length,0)} ข้อ ตามรูปแบบ Pre-Test สามเสน มีเฉลยและคำอธิบายภาษาไทยทุกข้อ และสรุปคะแนนแยกตามหมวด</p></header>
    <div class="modes" role="group" aria-label="เลือกโหมด">
      <button class="mode" id="m-practice" aria-pressed="${m==='practice'}"><b>โหมดฝึก</b><span>ตอบแล้วเห็นเฉลยและคำอธิบายทันที</span></button>
      <button class="mode" id="m-exam" aria-pressed="${m==='exam'}"><b>โหมดสอบจริง</b><span>จับเวลา 1 นาทีต่อข้อ เห็นคะแนนเมื่อส่งคำตอบ</span></button>
    </div>`;
  let lastYear = '';
  h += '<div>';
  SETS.forEach(s => {
    const y = 'ชุดฝึก 50 ข้อ · เวลา 50 นาที';
    if (y !== lastYear){ if(lastYear) h+='</div>'; h += `<div class="year">${y}</div><div class="sets">`; lastYear = y; }
    const r = store.sets[s.id] || {};
    const n = s.qs.length;
    const room = s.title;
    let meta = `<span>${n} ข้อ</span>`;
    if (r.last) meta += `<span>ล่าสุด <span class="score">${r.last.score}/${r.last.total}</span></span><span>ดีที่สุด <span class="score">${r.best}/${n}</span></span>`;
    if (r.weak) meta += `<span>ควรทบทวน: ${esc(r.weak)}</span>`;
    const p = r.prog;
    let acts = '';
    if (p) acts += `<button class="btn primary" data-act="resume" data-id="${s.id}">ทำต่อ (${Object.keys(p.ans).length}/${n})</button>`;
    else acts += `<button class="btn primary" data-act="start" data-id="${s.id}">เริ่มทำ</button>`;
    if (p) acts += `<button class="btn ghost" data-act="start" data-id="${s.id}">เริ่มใหม่</button>`;
    if (r.wrong && r.wrong.length) acts += `<button class="btn ghost" data-act="wrong" data-id="${s.id}">ฝึกข้อที่ผิด (${r.wrong.length})</button>`;
    h += `<article class="set"><div><h3>${esc(room)}</h3><div class="meta">${meta}</div></div><div class="acts">${acts}</div></article>`;
  });
  h += '</div></div>';
  h += `<p class="foot">คะแนนและความคืบหน้าจะจำไว้ในเครื่องนี้เท่านั้น ถ้าเปลี่ยนเครื่องหรือล้างข้อมูลเบราว์เซอร์ คะแนนจะเริ่มใหม่ ข้อสอบชุดนี้ Claude แต่งขึ้นใหม่ทั้งหมดเลียนแบบแนวข้อสอบ ไม่ใช่ข้อสอบจริงของโรงเรียน</p>`;
  app.innerHTML = h;
  app.querySelector('#m-practice').onclick = () => { store.mode='practice'; save(); home(); };
  app.querySelector('#m-exam').onclick = () => { store.mode='exam'; save(); home(); };
  app.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    const id = b.dataset.id, s = setOf(id), r = rec(id);
    if (b.dataset.act === 'resume') begin(id, r.prog.mode, r.prog.idxs, r.prog);
    else if (b.dataset.act === 'start') { delete r.prog; save(); begin(id, store.mode, s.qs.map((_,i)=>i)); }
    else begin(id, 'practice', r.wrong.slice(), null, true);
  });
}

/* ---------- session ---------- */
function begin(id, mode, idxs, prog, wrongOnly){
  const s = setOf(id);
  S = prog ? {id, mode:prog.mode, idxs:prog.idxs, ans:prog.ans, cur:prog.cur||0, used:prog.used||0, wrongOnly:false}
           : {id, mode, idxs, ans:{}, cur:0, used:0, wrongOnly:!!wrongOnly};
  S.limit = S.mode==='exam' ? S.idxs.length*60 : 0;
  S.t0 = Date.now();
  if (S.mode==='exam') startTimer();
  renderQ();
}
function persist(){
  if (!S || S.wrongOnly) return;
  const r = rec(S.id);
  r.prog = {mode:S.mode, idxs:S.idxs, ans:S.ans, cur:S.cur, used:usedSec()};
  save();
}
function usedSec(){ return S.used + (Date.now()-S.t0)/1000; }
function startTimer(){ stopTimer(); timerId = setInterval(tick, 1000); }
function stopTimer(){ if (timerId){ clearInterval(timerId); timerId=null; } }
function tick(){
  const el = document.getElementById('timer'); if(!el||!S) return;
  const left = S.limit - usedSec();
  el.textContent = fmt(left); el.classList.toggle('low', left < 120);
  if (left <= 0){ finish(); }
}

function ctxHTML(s, q, i){
  let h = '';
  const prev = i>0 ? s.qs[S.idxs[S.cur-1]] : null;
  if (q.d) h += `<p class="dir">${esc(q.d)}</p>`;
  if (q.g >= 0){
    const g = s.groups[q.g];
    h += `<div class="ctx">${g.l?`<span class="lab">${esc(g.l)}</span>`:''}${g.h}</div>`;
  }
  return h;
}
function optsHTML(q, chosen, reveal){
  return q.o.map((o,k) => {
    const n = k+1; let cls = 'opt';
    if (reveal){ if (n===q.a) cls+=' right'; else if (n===chosen) cls+=' wrong'; }
    else if (n===chosen) cls+=' sel';
    return `<button class="${cls}" data-n="${n}" ${reveal?'disabled':''} aria-label="ตัวเลือก ${n}"><span class="bub">${n}</span><span class="ot">${o}</span></button>`;
  }).join('');
}
function fbHTML(q, chosen){
  const ok = chosen===q.a;
  const warn = /หมายเหตุ|กำกวม/.test(q.x);
  return `<div class="fb ${ok?'ok':'no'}"><b>${ok?'ถูกต้อง':'ยังไม่ถูก · คำตอบคือข้อ '+q.a}</b><span>${q.x}</span>${warn?'<span class="warnline">⚠ ข้อนี้ข้อสอบต้นฉบับค่อนข้างกำกวม</span>':''}</div>`;
}

function renderQ(confirming){
  const s = setOf(S.id), qi = S.idxs[S.cur], q = s.qs[qi];
  const chosen = S.ans[qi];
  const reveal = S.mode==='practice' && chosen != null;
  const answered = Object.keys(S.ans).length;
  const total = S.idxs.length;
  const last = S.cur === total-1;
  let h = `<div class="bar"><div class="in">
      <button class="btn ghost" id="b-home" aria-label="กลับหน้าแรก">←</button>
      <div class="t"><b>${esc(shortTitle(s))}${S.wrongOnly?' · ฝึกข้อที่ผิด':''}</b><small>ข้อที่ ${S.cur+1} จาก ${total} · ตอบแล้ว ${answered}</small></div>
      ${S.mode==='exam'?`<span class="timer" id="timer">${fmt(S.limit-usedSec())}</span>`:''}
    </div><div class="prog"><i style="width:${answered/total*100}%"></i></div></div>`;
  h += ctxHTML(s, q, S.cur);
  h += `<section class="q"><div class="qn">ข้อ ${esc(qLabel(q))}<span class="topic">${esc(q.t)}</span></div><div class="stem">${q.s}</div>
        <div class="opts">${optsHTML(q, chosen, reveal)}</div>${q.note?`<p class="note">${esc(q.note)}</p>`:''}
        ${reveal?fbHTML(q, chosen):''}</section>`;
  h += `<div class="nav"><button class="btn" id="b-prev" ${S.cur===0?'disabled':''}>← ข้อก่อนหน้า</button>`;
  if (last) h += `<button class="btn primary" id="b-finish">${S.mode==='exam'?'ส่งคำตอบ':'ดูผลคะแนน'}</button>`;
  else h += `<button class="btn ${reveal||S.mode==='exam'?'primary':''}" id="b-next">ข้อต่อไป →</button>`;
  h += `</div>`;
  if (confirming){
    const miss = total - answered;
    h += `<div class="confirm" id="conf"><b>ส่งคำตอบเลยไหม?</b><span>${miss?`ยังไม่ได้ตอบ ${miss} ข้อ ข้อที่ไม่ได้ตอบจะนับเป็นผิด`:'ตอบครบทุกข้อแล้ว'}</span>
      <div class="row"><button class="btn primary" id="c-yes">ส่งคำตอบ</button><button class="btn" id="c-no">กลับไปทำต่อ</button></div></div>`;
  }
  h += `<div class="grid" aria-label="ไปยังข้อ">${S.idxs.map((ix,k)=>{
      const a=S.ans[ix]; let c='';
      if (a!=null) c = S.mode==='practice' ? (a===s.qs[ix].a?'r':'w') : 'done';
      if (k===S.cur) c+=' cur';
      return `<button class="${c}" data-k="${k}">${esc(s.qs[ix].n)}</button>`; }).join('')}</div>`;
  if (S.mode==='exam' && !last && !confirming) h += `<div class="nav"><span></span><button class="btn" id="b-finish">ส่งคำตอบ</button></div>`;
  app.innerHTML = h;
  app.querySelector('#b-home').onclick = () => { persist(); home(); };
  app.querySelectorAll('.opt:not(:disabled)').forEach(b => b.onclick = () => {
    S.ans[qi] = +b.dataset.n; persist();
    if (S.mode==='exam'){ renderQ(); } else { renderQ(); }
  });
  const go = k => { S.cur = k; persist(); renderQ(); window.scrollTo(0,0); };
  const p = app.querySelector('#b-prev'); if (p) p.onclick = () => go(S.cur-1);
  const n = app.querySelector('#b-next'); if (n) n.onclick = () => go(S.cur+1);
  app.querySelectorAll('.grid button').forEach(b => b.onclick = () => go(+b.dataset.k));
  app.querySelectorAll('#b-finish').forEach(f => f.onclick = () => {
    if (S.mode==='exam'){ renderQ(true); const c=document.getElementById('conf'); c && c.scrollIntoView({block:'center'}); }
    else finish();
  });
  const y = app.querySelector('#c-yes'); if (y) y.onclick = finish;
  const no = app.querySelector('#c-no'); if (no) no.onclick = () => renderQ();
  if (S.mode==='exam') tick();
}

function finish(){
  stopTimer();
  const s = setOf(S.id);
  const used = usedSec();
  let score = 0; const wrong = [];
  S.idxs.forEach(ix => { if (S.ans[ix]===s.qs[ix].a) score++; else wrong.push(ix); });
  const r = rec(S.id);
  if (!S.wrongOnly){
    r.last = {score, total:S.idxs.length, at:Date.now(), mode:S.mode};
    r.best = Math.max(r.best||0, score);
    r.wrong = wrong;
    delete r.prog;
    const T = topicStats(s, S.idxs, S.ans);
    const weak = T.filter(t=>t.n>=2 && t.c/t.n<0.6).sort((x,y)=>x.c/x.n-y.c/y.n).slice(0,2).map(t=>t.t);
    r.weak = weak.join(', ');
  } else {
    r.wrong = (r.wrong||[]).filter(ix => !(S.ans[ix]===s.qs[ix].a));
  }
  save();
  const done = {...S, score, wrongList:wrong, used};
  S = null; filter = wrong.length ? 'wrong' : 'all';
  result(done);
}

function topicStats(s, idxs, ans){
  const m = {};
  idxs.forEach(ix => { const q=s.qs[ix]; const k=q.t; m[k]=m[k]||{t:k,n:0,c:0}; m[k].n++; if(ans[ix]===q.a) m[k].c++; });
  return Object.values(m).sort((a,b)=>b.n-a.n);
}
function result(R){
  window.scrollTo(0,0);
  const s = setOf(R.id), total = R.idxs.length, pct = Math.round(R.score/total*100);
  const skipped = R.idxs.filter(ix => R.ans[ix]==null).length;
  let h = `<header class="res-head"><span class="eyebrow">${esc(shortTitle(s))}${R.wrongOnly?' · ฝึกข้อที่ผิด':''}</span>
    <div class="big">${R.score}<small> / ${total}</small></div>
    <div class="stats"><span>${pct}%</span><span>ผิด ${total-R.score-skipped} ข้อ</span>${skipped?`<span>ไม่ได้ตอบ ${skipped} ข้อ</span>`:''}${R.mode==='exam'?`<span>ใช้เวลา ${fmt(R.used)} นาที</span>`:''}</div>
    <div class="nav" style="justify-content:flex-start">
      <button class="btn primary" id="r-home">กลับหน้าแรก</button>
      ${R.wrongList.length?`<button class="btn" id="r-wrong">ฝึกข้อที่ผิดอีกรอบ</button>`:''}
      <button class="btn ghost" id="r-again">ทำชุดนี้ใหม่</button></div></header>
    <h2 style="font-size:1.1rem;margin-top:18px">คะแนนแยกตามหมวด</h2>
    <div class="tops">${topicStats(s,R.idxs,R.ans).map(t=>`<div class="trow ${t.c/t.n<0.6?'weak':''}"><span>${esc(t.t)}</span><span class="tb"><i style="width:${t.c/t.n*100}%"></i></span><span class="tv">${t.c}/${t.n}</span></div>`).join('')}</div>
    <p class="muted" style="font-size:.85rem;margin:2px 0 0">แถบสีแดง = ได้ต่ำกว่า 60% ควรทบทวนหมวดนั้น</p>
    <div class="filters" role="group" aria-label="ตัวกรอง">
      <button class="btn" data-f="wrong" aria-pressed="${filter==='wrong'}">เฉพาะข้อที่ผิด</button>
      <button class="btn" data-f="all" aria-pressed="${filter==='all'}">ทุกข้อ</button></div><div class="rv">`;
  R.idxs.forEach(ix => {
    const q = s.qs[ix], a = R.ans[ix], ok = a===q.a;
    if (filter==='wrong' && ok) return;
    const tag = a==null ? '<span class="tag skip">ไม่ได้ตอบ</span>' : ok ? '<span class="tag ok">ถูก</span>' : `<span class="tag no">ตอบข้อ ${a}</span>`;
    const g = q.g>=0 ? s.groups[q.g] : null;
    h += `<section class="q"><div class="rvh"><span class="qn">ข้อ ${esc(qLabel(q))}</span>${tag}<span class="topic">${esc(q.t)}</span></div>
      ${g?`<details class="ctxd"><summary>ดูบทอ่าน/รูปประกอบ</summary><div class="ctx" style="margin-top:8px">${g.h}</div></details>`:''}
      <div class="stem">${q.s}</div><div class="opts">${optsHTML(q, a, true)}</div>${fbHTML(q, a)}</section>`;
  });
  if (filter==='wrong' && !R.wrongList.length) h += `<p class="muted">ถูกทุกข้อ เก่งมาก</p>`;
  h += '</div>';
  app.innerHTML = h;
  app.querySelector('#r-home').onclick = home;
  const w = app.querySelector('#r-wrong'); if (w) w.onclick = () => begin(R.id, 'practice', R.wrongList.slice(), null, true);
  app.querySelector('#r-again').onclick = () => begin(R.id, R.wrongOnly?'practice':R.mode, R.wrongOnly?R.idxs:s.qs.map((_,i)=>i), null, R.wrongOnly);
  app.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; result(R); });
}
window.addEventListener('pagehide', persist);
home();
})();
</script>

</body>
</html>
