<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>ซ้อมสูตรคณิต ม.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Anuphan:wght@400;500;600&display=swap">
<style>
/* Layout: one exercise-book column on graph paper; the active question is the only "sheet" lifted off the page */
:root{
  --paper:#fbfcfe; --grid:#e6ecf6; --sheet:#ffffff; --ink:#1b2747; --ink-2:#56617d; --line:#d3dbea;
  --blue:#2a56c9; --blue-soft:#e7eefc; --hl:#ffe168; --hl-ink:#3a2e00; --mk:#ffe168; --fig:#ffffff;
  --ok:#16835a; --ok-soft:#e1f3ea; --bad:#cc3a30; --bad-soft:#fce7e5; --warn:#b97a06;
  --f-display:'Mitr','Anuphan','Noto Sans Thai',system-ui,sans-serif;
  --f-body:'Anuphan','Noto Sans Thai',system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1628; --grid:#18223a; --sheet:#151e35; --ink:#e6ebf7; --ink-2:#9aa6c4; --line:#2a3658;
  --blue:#86a6ff; --blue-soft:#1d2a50; --hl:#e9c53f; --hl-ink:#231b00; --mk:rgba(233,197,63,.32);
  --ok:#53cf95; --ok-soft:#12342a; --bad:#ff7e72; --bad-soft:#3b1c1f; --warn:#f0b445; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1628; --grid:#18223a; --sheet:#151e35; --ink:#e6ebf7; --ink-2:#9aa6c4; --line:#2a3658;
  --blue:#86a6ff; --blue-soft:#1d2a50; --hl:#e9c53f; --hl-ink:#231b00; --mk:rgba(233,197,63,.32);
  --ok:#53cf95; --ok-soft:#12342a; --bad:#ff7e72; --bad-soft:#3b1c1f; --warn:#f0b445; color-scheme:dark}

body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible,.flash:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(1.7rem,5vw,2.3rem);line-height:1.15;margin:0;text-wrap:balance}
h1 mark{background:linear-gradient(transparent 58%,var(--mk) 58%);color:inherit;padding:0 .1em}
.sub{margin:4px 0 0;color:var(--ink-2);font-size:.92rem}
.tally{font-family:var(--f-display);font-size:.9rem;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.tally b{color:var(--ink);font-weight:500}

.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px;background:var(--sheet);border:1px solid var(--line);border-radius:999px;scrollbar-width:none}
.tabs button{flex:1 0 auto;border:0;background:none;padding:8px 14px;border-radius:999px;font-family:var(--f-display);font-size:.95rem;color:var(--ink-2);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}

.filter{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r)}
.filter summary{padding:10px 14px;font-family:var(--f-display);cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
.filter summary::after{content:'▾';color:var(--ink-2)}
.filter[open] summary::after{content:'▴'}
.fbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.glabel{font-size:.78rem;letter-spacing:.04em;color:var(--ink-2);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:none;border-radius:999px;padding:4px 12px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue);font-weight:500}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:0;background:none;color:var(--blue);text-decoration:underline;text-underline-offset:3px;font-size:.86rem;padding:2px 4px}

.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 1px 0 var(--line),0 10px 24px -18px rgba(20,30,60,.45);display:flex;flex-direction:column;gap:14px;min-width:0}
.tag{align-self:flex-start;font-size:.78rem;letter-spacing:.03em;background:var(--hl);color:var(--hl-ink);padding:2px 10px;border-radius:6px;font-weight:500}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:.85rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.q{font-size:1.12rem;line-height:1.75;margin:0}
.q .m,.fx{font-family:var(--f-display);font-weight:400}
.fx{font-size:1.3rem;line-height:1.9}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;font-size:.86em;line-height:1.25}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .25em 1px}
.fr>span:last-child{padding-top:1px}
sup,sub{font-size:.68em}
i{font-style:normal;color:var(--ink-2);font-size:.85em;margin-left:.4em}

.btn{border:0;border-radius:12px;padding:12px 18px;font-family:var(--f-display);font-size:1rem;background:var(--ink);color:var(--paper)}
.btn.alt{background:var(--blue-soft);color:var(--blue)}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink-2)}
.btn.okb{background:var(--ok);color:var(--sheet)}
.btn.badb{background:var(--bad-soft);color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row .btn{flex:1 1 140px}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--sheet);border-radius:12px;padding:12px 14px;font-family:var(--f-display);font-size:1.08rem;line-height:1.8;min-width:0;display:flex;gap:10px;align-items:center}
.opt .k{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--ink-2);font-family:var(--f-body)}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}

.ans{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ans input{flex:1 1 160px;min-width:0;font-family:var(--f-display);font-size:1.25rem;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
.ans .unit{color:var(--ink-2)}

.fb{border-radius:12px;padding:12px 14px;font-family:var(--f-display)}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.sol{border-top:1.5px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.sol h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:1rem}
.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;font-family:var(--f-display);font-size:1.05rem;line-height:1.9}
.steps b{background:linear-gradient(transparent 60%,var(--mk) 60%);color:inherit;font-weight:500}
.tbl{overflow-x:auto}
table{border-collapse:collapse;font-family:var(--f-display);font-size:.98rem;min-width:280px}
th,td{border:1px solid var(--line);padding:6px 12px;text-align:center}
th{background:var(--blue-soft);font-weight:500}
.hint{background:var(--blue-soft);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.hint div{font-size:.9rem}

.flash{cursor:pointer;min-height:240px;justify-content:center;align-items:center;text-align:center}
.flash .tag{align-self:center}
.fc-name{font-family:var(--f-display);font-size:1.35rem;line-height:1.6;text-wrap:balance}
.fc-back{display:flex;flex-direction:column;gap:6px;align-items:center;border-top:1.5px dashed var(--line);padding-top:14px;width:100%}
.fc-back .fx{font-size:1.5rem;color:var(--blue)}
.nt{margin:0;color:var(--ink-2);font-size:.92rem}
.cue{color:var(--ink-2);font-size:.85rem}
.bar{height:8px;background:var(--grid);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--ok);border-radius:99px}

.big{font-family:var(--f-display);font-size:2.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.timer{font-family:var(--f-display);font-size:1.1rem;font-variant-numeric:tabular-nums;color:var(--ink)}
.rows{display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 12px;align-items:center}
.trow .bar{grid-column:1/-1}
.trow .pc{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:.88rem}
.trow button{border:0;background:none;color:var(--blue);font-size:.88rem;padding:2px 6px}
.lv-bad>span{background:var(--bad)}.lv-mid>span{background:var(--warn)}
details.mist{border:1px solid var(--line);border-radius:12px;padding:8px 12px}
details.mist summary{cursor:pointer}
.muted{color:var(--ink-2);font-size:.9rem;margin:0}
.search{width:100%;font:inherit;font-size:1.05rem;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.ssec{scroll-margin-top:12px}
.ssec h2{margin:0;font-family:var(--f-display);font-weight:500;font-size:1.25rem;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ssec h2 small{font-family:var(--f-body);font-size:.75rem;color:var(--ink-2);font-weight:400;letter-spacing:.03em}
.flist{display:flex;flex-direction:column}
.fitem{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:4px 20px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.fitem:first-child{border-top:0}
.fitem .fn{font-size:.98rem}
.fitem .fx{color:var(--blue);font-size:1.2rem;line-height:1.8}
.fitem .nt{grid-column:2;font-size:.85rem}
@media (max-width:560px){.fitem{grid-template-columns:minmax(0,1fr)}.fitem .nt{grid-column:1}}
.ex{margin:0;font-family:var(--f-display);font-size:.95rem;line-height:1.9;background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:6px 12px}
.ex .exl{margin-right:8px;font-family:var(--f-body);font-size:.72rem;letter-spacing:.04em;color:var(--ink-2);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.ex b{background:linear-gradient(transparent 60%,var(--mk) 60%);font-weight:500;color:inherit}
.fitem .ex{grid-column:2}
@media (max-width:560px){.fitem .ex{grid-column:1}}
.figs{display:flex;flex-wrap:wrap;gap:8px}
.figs img{max-width:100%;height:auto;max-height:150px;background:var(--fig);border:1px solid var(--line);border-radius:10px;padding:6px}
.fitem .figs{grid-column:2}
@media (max-width:560px){.fitem .figs{grid-column:1}}
.flash .figs{justify-content:center}
.warnbox{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:2px 8px;font-size:.8rem}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .25s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>ซ้อม<mark>สูตรคณิต</mark> ม.1</h1>
      <p class="sub">สูตรจากชีทครูมด + หัวข้อที่ออกบ่อยในข้อสอบเข้าจริง</p>
    </div>
    <div class="tally" id="tally"></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="sum">สรุปสูตร</button>
    <button role="tab" data-tab="flash">บัตรสูตร</button>
    <button role="tab" data-tab="mc">เลือกสูตร</button>
    <button role="tab" data-tab="prob">โจทย์ประยุกต์</button>
    <button role="tab" data-tab="speed">ทำเวลา</button>
    <button role="tab" data-tab="me">ผลของฉัน</button>
  </nav>
  <details class="filter" id="filter"><summary id="fsum">เลือกเรื่องที่จะฝึก</summary><div class="fbody" id="fbody"></div></details>
  <main id="stage"></main>
</div>

const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const lcm=(a,b)=>a/gcd(a,b)*b;
const N=n=>Number(n).toLocaleString('en-US');
const F=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const P=(b,e)=>`${b}<sup>${e}</sup>`;
const co=(k,v='x')=>k===1?v:k+v;
const facMap=n=>{const f={};let m=n,p=2;while(m>1){while(m%p===0){f[p]=(f[p]||0)+1;m/=p}p++}return f};
const fmtMap=f=>Object.keys(f).sort((a,b)=>a-b).map(p=>f[p]>1?P(p,f[p]):p).join(' × ');
const fac=n=>fmtMap(facMap(n));
const note=t=>` <i>${t}</i>`;

function conv(pairs){const z=pick(pairs),[s,b,f,h,mx]=z;let big,small;do{big=r6(ri(1,mx)/pick([1,2,4,10]));small=r6(big*f)}while(small%1);
 const toSmall=Math.random()<.5;
 return toSmall?{q:`${N(big)} ${b} เท่ากับกี่ ${s}`,a:small,u:s,h:['un4',...h],s:[`1 ${b} = ${N(f)} ${s}`,`หน่วยใหญ่ → หน่วยเล็ก ให้ <b>คูณ</b>`,`${N(big)} × ${N(f)} = <b>${N(small)}</b> ${s}`]}
  :{q:`${N(small)} ${s} เท่ากับกี่ ${b}`,a:big,u:b,h:['un4',...h],s:[`1 ${b} = ${N(f)} ${s}`,`หน่วยเล็ก → หน่วยใหญ่ ให้ <b>หาร</b>`,`${N(small)} ÷ ${N(f)} = <b>${N(big)}</b> ${b}`]}}

 if(!canRev||Math.random()<.7){
  let wrong=shuf(card.w).slice(0,3);

  while(wrong.length<3){const f=extra.shift();if(f!==card.f&&!wrong.includes(f))wrong.push(f)}
  return{card,prompt:`สูตรของ <b>${card.n}</b> คือข้อใด`,opts:shuf([{h:card.f,ok:true},...wrong.map(h=>({h,ok:false}))])};
 }

 return{card,prompt:`<span class="fx">${card.f}</span><br>สูตรนี้คือข้อใด`,opts:shuf([{h:card.n,ok:true},...others.map(k=>({h:k.n,ok:false}))])};
}

const solHTML=p=>`<div class="sol"><h3>วิธีทำ</h3>${figs(p.h)}${tableHTML(p.tb)}<ol class="steps">${p.s.map(x=>`<li>${x}</li>`).join('')}</ol></div>`;
const hintHTML=p=>`<div class="hint" hidden id="hint">${p.h.map(id=>{const k=CARD[id];return `<div>${k.n}</div><div class="fx">${k.f}</div>`}).join('')}${figs(p.h)}</div>`;
const parseAns=v=>{v=String(v).replace(/[,\s]/g,'').replace('−','-');if(v==='')return NaN;const m=v.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);return m?Number(m[1])/Number(m[2]):Number(v)};
const figs=ids=>{const ks=[...new Set(ids.flatMap(id=>(CARD[id]&&CARD[id].i)||[]))];return ks.length?`<div class="figs">${ks.map(k=>`<img src="${IMG[k]}" alt="" loading="lazy">`).join('')}</div>`:''};
const fmtAns=p=>p.af?p.af:`${N(p.a)}${p.u?' '+p.u:''}`;

/* ===== 1. flashcards ===== */
let lastCard=null;
function pickCard(){const d=deck();let tot=0;const w=d.map(k=>{const x=(k.id===lastCard&&d.length>1)?0:5-Math.min(st.boxes[k.id]||0,4);tot+=x;return x});
 let r=Math.random()*tot;for(let i=0;i<d.length;i++){r-=w[i];if(r<0)return d[i]}return d[0]}
function flashView(){
 const d=deck(),known=d.filter(k=>(st.boxes[k.id]||0)>=3).length,card=pickCard();lastCard=card.id;
 stage.innerHTML=`<div class="sheet flash pop" id="fc" tabindex="0" role="button" aria-label="พลิกบัตร">
   <span class="tag">${TN[card.t]}</span><div class="fc-name">${card.n}</div>
   <div class="fc-back" hidden id="back"><div class="fx">${card.f}</div>${card.x?`<p class="nt">${card.x}</p>`:''}${card.e?`<p class="ex"><span class="exl">ตัวอย่าง</span>${card.e}</p>`:''}${figs([card.id])}</div>
   <div class="cue" id="cue">นึกสูตรในใจก่อน แล้วแตะเพื่อพลิกดู</div></div>
  <div class="row" id="fcb"><button class="btn alt" id="flip">พลิกดูสูตร</button></div>
  <div class="meta"><span>จำแม่นแล้ว ${known} / ${d.length} สูตร</span><span>สูตรที่ยังไม่แม่นจะวนมาบ่อยขึ้น</span></div>
  <div class="bar"><span style="width:${d.length?known/d.length*100:0}%"></span></div>`;
 const flip=()=>{if(!$('#back').hidden)return;$('#back').hidden=false;$('#cue').hidden=true;
  $('#fcb').innerHTML=`<button class="btn badb" id="no">ยังไม่แม่น</button><button class="btn okb" id="yes">จำได้แล้ว</button>`;
  $('#no').onclick=()=>{st.boxes[card.id]=0;save();flashView()};
  $('#yes').onclick=()=>{st.boxes[card.id]=Math.min((st.boxes[card.id]||0)+1,5);save();flashView()};$('#yes').focus()};
 $('#fc').onclick=flip;$('#fc').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};$('#flip').onclick=flip;
}

/* ===== 2. multiple choice ===== */
let mcStreak=0;
function mcView(){
 const card=pick(deck()),m=makeMC(card);
 stage.innerHTML=`<div class="sheet pop"><div class="meta"><span class="tag">${TN[card.t]}</span><span>ถูกติดกัน ${mcStreak} ข้อ</span></div>
  <p class="q">${m.prompt}</p><div class="opts">${m.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${KEYS[i]}</span><span>${o.h}</span></button>`).join('')}</div><div id="after"></div></div>`;
 stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  const o=m.opts[+b.dataset.i];stage.querySelectorAll('.opt').forEach((x,i)=>{x.disabled=true;if(m.opts[i].ok)x.classList.add('right')});
  if(!o.ok){b.classList.add('wrong');st.boxes[card.id]=0;mcStreak=0}else mcStreak++;
  rec(card.t,o.ok);
  $('#after').innerHTML=`<div class="fb ${o.ok?'ok':'bad'}">${o.ok?'ถูกต้อง':'ยังไม่ถูก'} · ${card.n} = <span class="fx">${card.f}</span></div>${card.x?`<p class="nt" style="margin-top:8px">${card.x}</p>`:''}${figs([card.id])}
   <div class="row" style="margin-top:12px"><button class="btn" id="nx">ข้อต่อไป</button></div>`;$('#nx').focus();$('#nx').onclick=mcView;
 });
}

/* ===== 3. applied problems ===== */
function probView(){
 const p=makeProb();let done=false;
 stage.innerHTML=`<div class="sheet pop"><div class="meta"><span class="tag">${TN[p.t]}</span><button class="btn ghost" id="hb" style="padding:6px 12px;font-size:.88rem">ดูสูตรช่วย</button></div>
  <p class="q">${p.q}</p>${hintHTML(p)}
  <div class="ans"><input id="in" inputmode="${p.af?'text':'decimal'}" autocomplete="off" placeholder="พิมพ์คำตอบ" aria-label="คำตอบ">${p.u?`<span class="unit">${p.u}</span>`:''}</div>
  <div class="row" id="pb"><button class="btn" id="chk">ตรวจคำตอบ</button><button class="btn ghost" id="give">ดูเฉลย</button></div><div id="after"></div></div>`;
 $('#hb').onclick=()=>{$('#hint').hidden=!$('#hint').hidden};
 const finish=(ok,shown)=>{done=true;rec(p.t,ok);$('#in').disabled=true;
  $('#after').innerHTML=`<div class="fb ${ok?'ok':'bad'}">${ok?'ถูกต้อง เก่งมาก':shown?'เฉลย':'ยังไม่ถูก'} · คำตอบคือ ${fmtAns(p)}</div>${solHTML(p)}`;
  $('#pb').innerHTML=`<button class="btn" id="nx">ข้อต่อไป</button>`;$('#nx').onclick=probView;$('#nx').focus()};
 const check=()=>{const v=parseAns($('#in').value);if(isNaN(v)){$('#in').focus();return}finish(Math.abs(v-p.a)<1e-9,false)};
 $('#chk').onclick=check;$('#give').onclick=()=>finish(false,true);
 $('#in').onkeydown=e=>{if(e.key==='Enter'&&!done)check()};$('#in').focus({preventScroll:true});
}

/* ===== 4. speed round ===== */
const fmtT=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function speedIntro(){
 const b=st.best;
 stage.innerHTML=`<div class="sheet pop"><span class="tag">ทำเวลา 10 ข้อ</span>
  <p class="q">ผสมทั้งข้อเลือกสูตรและโจทย์ประยุกต์จากเรื่องที่เลือกไว้ ตอบแล้วไปข้อถัดไปทันที เฉลยข้อที่ผิดจะแสดงตอนจบ</p>
  <p class="muted">${b?`สถิติดีที่สุด: ถูก ${b.s}/10 ในเวลา ${fmtT(b.t)}`:'ยังไม่มีสถิติ ลองทำรอบแรกได้เลย'}</p>
  <div class="row"><button class="btn" id="go">เริ่มจับเวลา</button></div></div>`;
 $('#go').onclick=speedRun;$('#go').focus();
}
function speedRun(){
 const Q=[];for(let i=0;i<10;i++){Q.push(Math.random()<.5?{k:'mc',m:makeMC(pick(deck()))}:{k:'p',p:makeProb()})}
 let i=0,score=0,t0=Date.now();const miss=[];
 const sec=()=>Math.floor((Date.now()-t0)/1000);
 const next=()=>{if(i>=10)return end();const it=Q[i];
  const head=`<div class="meta"><span>ข้อ ${i+1} / 10 · ถูก ${score}</span><span class="timer" id="tm">${fmtT(sec())}</span></div><div class="bar"><span style="width:${i*10}%"></span></div>`;
  if(it.k==='mc'){const m=it.m;
   stage.innerHTML=`<div class="sheet pop">${head}<span class="tag">${TN[m.card.t]}</span><p class="q">${m.prompt}</p><div class="opts">${m.opts.map((o,j)=>`<button class="opt" data-i="${j}"><span class="k">${KEYS[j]}</span><span>${o.h}</span></button>`).join('')}</div></div>`;
   stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=m.opts[+b.dataset.i].ok;stage.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(m.opts[j].ok)x.classList.add('right')});
    if(!ok){b.classList.add('wrong');miss.push(`<details class="mist"><summary>${m.card.n}</summary><div class="fx">${m.card.f}</div></details>`)}else score++;
    rec(m.card.t,ok);i++;setTimeout(next,ok?350:900)});
  }else{const p=it.p;
   stage.innerHTML=`<div class="sheet pop">${head}<span class="tag">${TN[p.t]}</span><p class="q">${p.q}</p>
    <div class="ans"><input id="in" inputmode="${p.af?'text':'decimal'}" autocomplete="off" placeholder="พิมพ์คำตอบ" aria-label="คำตอบ">${p.u?`<span class="unit">${p.u}</span>`:''}</div>
    <div class="row"><button class="btn" id="chk">ส่งคำตอบ</button><button class="btn ghost" id="skip">ข้าม</button></div><div id="fl"></div></div>`;
   const sub=v=>{const ok=Math.abs(v-p.a)<1e-9;if(ok)score++;else miss.push(`<details class="mist"><summary>${p.q} <b>(ตอบ ${fmtAns(p)})</b></summary>${solHTML(p)}</details>`);
    rec(p.t,ok);$('#fl').innerHTML=`<div class="fb ${ok?'ok':'bad'}">${ok?'ถูก':'คำตอบคือ '+fmtAns(p)}</div>`;$('#chk').disabled=$('#skip').disabled=$('#in').disabled=true;i++;setTimeout(next,ok?350:1100)};
   $('#chk').onclick=()=>{const v=parseAns($('#in').value);if(isNaN(v)){$('#in').focus();return}sub(v)};
   $('#skip').onclick=()=>sub(NaN);$('#in').onkeydown=e=>{if(e.key==='Enter')$('#chk').click()};$('#in').focus({preventScroll:true});
  }};
 clearInterval(timerId);timerId=setInterval(()=>{const el=$('#tm');if(el)el.textContent=fmtT(sec())},500);
 const end=()=>{clearInterval(timerId);const t=sec(),b=st.best,nb=!b||score>b.s||(score===b.s&&t<b.t);if(nb){st.best={s:score,t};save()}
  stage.innerHTML=`<div class="sheet pop"><span class="tag">จบรอบ</span><div class="big">${score}/10</div><p class="muted">ใช้เวลา ${fmtT(t)}${nb?' · สถิติใหม่':b?` · สถิติดีที่สุด ${b.s}/10 ใน ${fmtT(b.t)}`:''}</p>
   ${miss.length?`<h3 style="margin:0;font-family:var(--f-display);font-weight:500">ข้อที่พลาด (แตะเพื่อดูเฉลย)</h3><div class="rows">${miss.join('')}</div>`:'<div class="fb ok">ถูกครบทุกข้อ</div>'}
   <div class="row"><button class="btn" id="again">เล่นอีกรอบ</button></div></div>`;$('#again').onclick=speedRun};
 next();
}

/* ===== 5. my results ===== */
function meView(){
 const rows=TOPICS.map(t=>({t,o:st.topics[t.id]})),done=rows.filter(r=>r.o&&r.o.a).sort((a,b)=>a.o.c/a.o.a-b.o.c/b.o.a),todo=rows.filter(r=>!r.o||!r.o.a);
 const lv=p=>p<60?'lv-bad':p<80?'lv-mid':'';
 const known=CARDS.filter(k=>(st.boxes[k.id]||0)>=3).length;
 stage.innerHTML=`<div class="sheet pop">
  <div class="row" style="gap:24px"><div><div class="big">${N(st.total)}</div><p class="muted">ข้อที่ทำแล้ว</p></div>
   <div><div class="big">${st.total?Math.round(st.ok/st.total*100):0}%</div><p class="muted">ตอบถูก</p></div>
   <div><div class="big">${known}/${CARDS.length}</div><p class="muted">สูตรที่จำแม่น</p></div></div>
  <h3 style="margin:0;font-family:var(--f-display);font-weight:500">ความแม่นรายเรื่อง (เรื่องที่อ่อนสุดอยู่บน)</h3>
  ${done.length?`<div class="rows">${done.map(r=>{const p=Math.round(r.o.c/r.o.a*100);return `<div class="trow"><span>${r.t.n}</span><span class="pc">${r.o.c}/${r.o.a} · ${p}%</span><button data-t="${r.t.id}">ฝึกเรื่องนี้</button><div class="bar ${lv(p)}"><span style="width:${p}%"></span></div></div>`}).join('')}</div>`:'<p class="muted">ยังไม่มีข้อมูล ลองทำแบบเลือกสูตรหรือโจทย์ประยุกต์ก่อน ผลจะมาแสดงที่นี่</p>'}
  ${todo.length?`<p class="muted">ยังไม่ได้ลอง: ${todo.map(r=>r.t.n).join(' · ')}</p>`:''}
  <div class="row" id="rs"><button class="btn ghost" id="reset">ล้างผลทั้งหมด</button></div></div>
  <p class="muted">ผลเก็บไว้ในเครื่องนี้เท่านั้น ถ้าเปิดจากอีกเครื่องจะเริ่มนับใหม่</p>`;
 stage.querySelectorAll('.trow button').forEach(b=>b.onclick=()=>{st.sel=[b.dataset.t];save();renderFilter();go('prob')});
 $('#reset').onclick=()=>{$('#rs').innerHTML=`<span class="muted" style="align-self:center">ล้างคะแนน สถิติ และความจำบัตรสูตรทั้งหมด?</span><button class="btn badb" id="y">ล้างเลย</button><button class="btn ghost" id="n">ยกเลิก</button>`;
  $('#y').onclick=()=>{Object.assign(st,{topics:{},boxes:{},best:null,total:0,ok:0});save();tally();meView()};$('#n').onclick=meView};
}

tally();renderFilter();go(st.tab);
</script>
</body></html>
